<style>
:root{
  --primary:#f8b6c8;
  --secondary:#a5d8e6;
  --primary-dark:#e893ac;
  --primary-light:#fcdce6;
  --secondary-dark:#7cc3d8;
  --secondary-light:#cdeaf3;
  --today-border:#e08aa0;
  --bg:#fef6f8;
  --bg-top:#fcdee6;
  --bg-bottom:#d6edf4;
  --text:#3a2e2e;
  --text-muted:#8a7a7a;
  --border:#f0e0e2;
  --radius-lg:16px;
  --radius-md:12px;
  --radius-sm:8px;
  --shadow-sm:0 2px 8px rgba(0,0,0,0.06);
  --shadow-md:0 4px 16px rgba(0,0,0,0.10);
  --font: system-ui, -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font);
  color:var(--text);
  background:linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%) fixed;
  min-height:100vh;
  -webkit-tap-highlight-color:transparent;
}
button{ font-family:inherit; font-size:1rem; cursor:pointer; }
h1,h2,h3{ margin:0; }
#app{ max-width:920px; margin:0 auto; padding-bottom:48px; }

.app-header{ padding:16px 16px 4px; }
.header-top{ display:flex; align-items:center; justify-content:space-between; }
.header-top h1{ font-size:1.2rem; font-weight:700; }
.header-badge{
  font-size:0.72rem; color:#fff; background:var(--primary-dark); padding:2px 10px; border-radius:12px;
  white-space:nowrap;
}
/* 操作行(月移動・今日・凡例)はスクロールしても画面上部に貼り付く(v35)。
   #app直下に置いてあるのでページ全体でstickyが効く。
   bodyの背景グラデーションはfixed指定=画面基準なので、画面上端の色である
   --bg-top を敷けば背景と自然につながる。sheet-backdrop(z-index:50)より必ず下にする */
.nav-bar{
  position:sticky; top:0; z-index:5; background:var(--bg-top);
  padding:8px 16px 10px; box-shadow:0 2px 6px rgba(120,90,90,0.10);
}
.header-nav{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.nav-btn{
  min-width:44px; min-height:44px; border:none; background:#fff; border-radius:var(--radius-md);
  box-shadow:var(--shadow-sm); font-size:1rem;
}
.month-label{ font-size:1.1rem; font-weight:700; min-width:110px; text-align:center; }
.today-btn{
  min-height:44px; padding:0 14px; border:none; border-radius:var(--radius-md);
  background:var(--secondary-light); color:var(--text); box-shadow:var(--shadow-sm);
}

.today-reminder-list{ display:flex; flex-direction:column; gap:6px; margin-bottom:6px; }
.today-reminder{
  display:flex; align-items:center; gap:8px; width:100%; box-sizing:border-box;
  background:var(--primary-light); border-left:4px solid var(--primary-dark); padding:8px 10px;
  border-radius:var(--radius-sm); font-size:0.88rem; overflow-wrap:anywhere;
}
.today-reminder-text{ flex:1; min-width:0; }
/* タップで予定の詳細を開けるお知らせ(v40)。見た目は従来のお知らせのまま、
   ボタン既定の枠線・書体・中央寄せだけ打ち消し、右端の「›」でタップできることを示す */
button.today-reminder{
  min-height:44px; border-top:none; border-right:none; border-bottom:none;
  text-align:left; font:inherit; font-size:0.88rem; color:inherit; cursor:pointer;
}
button.today-reminder:active{ filter:brightness(0.96); }
.today-reminder-chevron{ flex:none; color:var(--text-muted); font-size:1.1rem; line-height:1; }

/* day notice(日詳細シートの一番上に出す「その日のお知らせ」。v42。本体index.htmlと同じ見た目)。
   表示専用でタップできないので、ボタン用の指定は持たない */
.day-notice-list{ display:flex; flex-direction:column; gap:6px; margin-bottom:12px; }
.day-notice{
  background:var(--primary-light); border-left:4px solid var(--primary-dark); padding:8px 10px;
  border-radius:var(--radius-sm); font-size:0.88rem; overflow-wrap:anywhere;
}

.calendar{ margin:16px; background:#fff; border-radius:var(--radius-lg); box-shadow:var(--shadow-md); padding:12px; }
.weekday-row{ display:grid; grid-template-columns:repeat(7,1fr); text-align:center; color:var(--text-muted); font-size:0.82rem; margin-bottom:4px; }
.weekday.sun{ color:#e08a9a; }
.weekday.sat{ color:#6fa8c9; }
.month-grid{ display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:4px; }
.day-cell{
  min-height:64px; border:1px solid var(--border); border-radius:var(--radius-sm);
  background:#fff; padding:4px; display:flex; flex-direction:column; align-items:stretch;
  text-align:left; position:relative; min-width:0; overflow:hidden;
}
/* 過ぎた日(v39)。薄くしたうえで彩度も落とし、これから先の日と見分けやすくする。
   .outside(前後月の日)の指定を後ろに置いて、そちらの透明度を優先させている */
.day-cell.past{ opacity:0.55; filter:saturate(0.3); }
.day-cell.outside{ opacity:0.4; }
.day-cell.today{ border:2px solid var(--today-border); }
.day-num{ font-size:0.85rem; font-weight:600; }
.chip-list{ margin-top:2px; display:flex; flex-direction:column; gap:2px; overflow:hidden; }
.chip{
  font-size:0.62rem; color:#fff; padding:1px 4px; border-radius:5px; white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis; max-width:100%; min-width:0;
}
.chip-more{ background:var(--text-muted); }
.period-lines{ margin-top:auto; display:flex; flex-direction:column; gap:2px; padding-top:2px; }
.period-line{ height:3px; border-radius:2px; width:100%; opacity:0.85; }
.empty-state{ text-align:center; color:var(--text-muted); padding:24px 12px; }

/* 長期予定の一覧(カレンダー上部) */
.longterm-section{ margin:8px 16px 0; background:#fff; border-radius:var(--radius-lg); box-shadow:var(--shadow-sm); padding:10px 12px; }
.longterm-title{ font-size:0.95rem; font-weight:700; margin-bottom:6px; display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
.longterm-list{ display:flex; flex-direction:column; gap:6px; }
.today-date-label{ font-size:0.78rem; font-weight:400; color:var(--text-muted); white-space:nowrap; }
.longterm-item{
  position:relative; display:flex; align-items:stretch; gap:8px; width:100%; min-height:44px; border:none; text-align:left;
  background:var(--bg); border-radius:var(--radius-sm); padding:6px 8px;
}
/* 終了したイベントのハンコ(v41。本体index.htmlと同じ見た目) */
.finished-stamp{
  position:absolute; top:-8px; right:6px; border:2px solid #8a8a8a; color:#6f6f6f;
  background:rgba(255,255,255,0.85); padding:1px 8px; border-radius:6px; font-weight:700;
  font-size:0.72rem; letter-spacing:1px; transform:rotate(-12deg); pointer-events:none;
}
.longterm-item.is-finished{ opacity:0.55; }
/* 長いタイトルがハンコの下に潜り込んで読みにくくならないよう、ハンコの幅ぶんだけ右を空ける。
   84pxは「イベント終了」6文字+左右の余白+枠線の実測値。文言を変えるならこの値も見直すこと */
.longterm-item.is-finished .longterm-item-title{ padding-right:84px; }
.longterm-bar{ width:5px; border-radius:3px; flex-shrink:0; }
.longterm-body{ display:flex; flex-direction:column; gap:2px; min-width:0; }
.longterm-item-title{ font-size:0.92rem; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.longterm-item-schedule{ font-size:0.78rem; color:var(--text-muted); overflow-wrap:anywhere; }

/* カテゴリの凡例(v35でページ下部からヘッダーの操作行へ移動)。
   「今日」ボタンの右隣に置き、幅が足りなければ次の行へ折り返す */
.legend-inline{ display:flex; flex-wrap:wrap; align-items:center; gap:4px 10px; flex:1 1 auto; min-width:0; }
.legend-item{ display:flex; align-items:center; gap:5px; font-size:0.7rem; color:var(--text); white-space:nowrap; }
.legend-swatch{ width:10px; height:10px; border-radius:3px; display:inline-block; flex-shrink:0; }

.sheet-backdrop{
  position:fixed; inset:0; background:rgba(60,40,40,0.35); display:flex; align-items:flex-end;
  justify-content:center; z-index:50;
}
.sheet{
  background:#fff; width:100%; max-height:88vh; overflow-y:auto; border-radius:var(--radius-lg) var(--radius-lg) 0 0;
  box-shadow:var(--shadow-md); padding:16px;
}
@media (min-width:768px){
  .sheet-backdrop{ align-items:center; }
  .sheet{ width:520px; max-width:92vw; border-radius:var(--radius-lg); max-height:84vh; }
}
.sheet-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
.icon-btn{
  min-width:44px; min-height:44px; border:none; background:#fff; border-radius:var(--radius-md);
  box-shadow:var(--shadow-sm); font-size:1.1rem; display:flex; align-items:center; justify-content:center;
}
.event-item{
  display:flex; flex-direction:column; gap:2px;
  border-left:4px solid var(--primary); background:var(--bg); border-radius:var(--radius-sm);
  padding:10px; margin-bottom:8px;
}
.event-item-title{ font-weight:700; overflow-wrap:anywhere; }
.event-item-meta{ font-size:0.8rem; color:var(--text-muted); overflow-wrap:anywhere; }
.event-item-memo{ font-size:0.82rem; margin-top:4px; white-space:pre-wrap; overflow-wrap:anywhere; }
.event-item-memo a{ color:var(--secondary-dark); word-break:break-all; }
.empty-hint{ color:var(--text-muted); font-size:0.9rem; }
.longterm-collapse{
  width:100%; min-height:44px; border:none; background:var(--bg); border-radius:var(--radius-sm);
  padding:10px 12px; text-align:left; font-size:0.9rem; font-weight:700; color:var(--text);
  margin-bottom:8px;
}

.state-box{ margin:40px 16px; text-align:center; color:var(--text-muted); }
.state-box p{ margin:6px 0; }
/* ページ末尾の注意書き(v38)。読み飛ばされないよう、白いカードに枠線と見出しを付けて
   本文も本文色で表示する。特に押さえてほしい語だけ .note-strong で強調する */
.footer-note{
  margin:24px 16px 0; background:#fff; border:1px solid var(--primary-dark); border-left-width:5px;
  border-radius:var(--radius-lg); box-shadow:var(--shadow-sm); padding:14px 16px;
  font-size:0.82rem; line-height:1.75; color:var(--text);
}
.footer-note-title{ font-weight:700; color:var(--primary-dark); font-size:0.86rem; margin-bottom:6px; }
.footer-note p{ margin-bottom:6px; }
.footer-note p:last-child{ margin-bottom:0; }
.note-strong{ font-weight:700; color:var(--primary-dark); }
</style>

<body>
<div id="app" role="application" aria-label="推し活カレンダー(公開)"></div>
<script>
'use strict';

/* =========================================================
 * 推し活カレンダー 公開ページ(§12.7)
 * - 閲覧専用・単一ファイル・トークン不要
 * - 編集機能・localStorage・トークンは一切持たない
 * ========================================================= */

/* ---------- 1. CONSTANTS ---------- */
const PUBLIC_GIST_FILENAME = 'oshical-public.json';
// members(限定配信)はv31で公開可カテゴリに追加。ただしユーザーが個別に「公開カレンダーに載せる」
// チェックを入れた予定だけがoshical-public.jsonのeventsに乗る(本体index.htmlのbuildPublicPayload参照)。
// callは絶対にここへ追加しないこと
const ALLOWED_CATEGORIES = ['event', 'goods', 'ticket', 'stream', 'members', 'other', 'anniversary'];
const CATEGORY_LABELS = { event: 'イベント', goods: 'グッズ販売', ticket: 'チケット販売', stream: '配信', members: '限定配信', other: 'その他', anniversary: '記念日' };
const CATEGORY_PERIOD = { event: true, goods: true, ticket: true, stream: false, members: false, other: true, anniversary: false };
const DEFAULT_COLORS = { event: '#e893ac', goods: '#f8b6c8', ticket: '#9ccc65', stream: '#a5d8e6', members: '#7cc3d8', other: '#b8b8b8', anniversary: '#e8b04f' };
// MILESTONE_PRIORITY: リマインドの並び順(index.htmlのcomputeRemindersと同じ優先度定義。
// 公開ページにはシフトが無いため shift-tomorrow は含まない)
const MILESTONE_PRIORITY = { 'lastday-eve': 0, lastday: 1, firstday: 2, anniversary: 2.5, 'today-time': 3 };
const WEEKDAY_LABELS = ['日', '月', '火', '水', '木', '金', '土'];
const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
const TIME_RE = /^([01]\d|2[0-3]):[0-5]\d$/;
const COLOR_RE = /^#[0-9a-fA-F]{3,8}$/;

/* ---------- 2. date-utils(index.htmlのdate-utilsから公開ページに必要な分だけ複製) ---------- */
function pad2(n) {
  return String(n).padStart(2, '0');
}

function fmtDate(y, m, d) {
  return `${y}-${pad2(m)}-${pad2(d)}`;
}

function parseDateStr(s) {
  const parts = String(s).split('-').map(Number);
  return { y: parts[0], m: parts[1], d: parts[2] };
}

function dateStrToDate(s) {
  const { y, m, d } = parseDateStr(s);
  return new Date(y, m - 1, d);
}

function dateToDateStr(date) {
  return fmtDate(date.getFullYear(), date.getMonth() + 1, date.getDate());
}

function todayStr(now) {
  const d = now instanceof Date ? now : new Date();
  return dateToDateStr(d);
}

function addDays(dateStr, n) {
  const d = dateStrToDate(dateStr);
  d.setDate(d.getDate() + n);
  return dateToDateStr(d);
}

function addMonths(dateStr, n) {
  const { y, m, d } = parseDateStr(dateStr);
  const date = new Date(y, m - 1 + n, 1);
  const lastDay = daysInMonth(date.getFullYear(), date.getMonth() + 1);
  date.setDate(Math.min(d, lastDay));
  return dateToDateStr(date);
}

function daysInMonth(year, month) {
  return new Date(year, month, 0).getDate();
}

function compareDates(a, b) {
  if (a < b) return -1;
  if (a > b) return 1;
  return 0;
}

function isDateInRange(dateStr, start, end) {
  return compareDates(dateStr, start) >= 0 && compareDates(dateStr, end) <= 0;
}

function monthGrid(year, month) {
  const first = new Date(year, month - 1, 1);
  const startOffset = first.getDay();
  const gridStart = new Date(year, month - 1, 1 - startOffset);
  const cells = [];
  for (let i = 0; i < 42; i++) {
    const d = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate() + i);
    cells.push({ dateStr: dateToDateStr(d), inMonth: d.getMonth() === month - 1 });
  }
  const weeks = [];
  for (let i = 0; i < 6; i++) {
    weeks.push(cells.slice(i * 7, i * 7 + 7));
  }
  return weeks;
}

function formatMonthLabel(year, month) {
  return `${year}年${month}月`;
}

function formatDateLabel(dateStr) {
  const d = dateStrToDate(dateStr);
  const { m, d: day } = parseDateStr(dateStr);
  return `${m}月${day}日(${WEEKDAY_LABELS[d.getDay()]})`;
}

/* ---------- 3. misc / XSS対策 ---------- */
function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function safeColor(value, fallback) {
  return typeof value === 'string' && COLOR_RE.test(value) ? value : fallback;
}

// mixWithWhite: 色を白と混ぜて淡くする(t=0で元色、t=1で白)。背景グラデーション用
function mixWithWhite(hex, t) {
  const clean = String(hex).replace('#', '');
  const full = clean.length === 3 ? clean.split('').map((c) => c + c).join('') : clean;
  const n = parseInt(full, 16);
  const mix = (v) => Math.round(v + (255 - v) * t);
  const toHex = (v) => Math.max(0, Math.min(255, v)).toString(16).padStart(2, '0');
  return `#${toHex(mix((n >> 16) & 255))}${toHex(mix((n >> 8) & 255))}${toHex(mix(n & 255))}`;
}

// applyPublicTheme: 公開データのテーマ色(メイン/サブ)から背景グラデーションを設定
// 旧形式データ(themeなし)はカテゴリ色(goods/stream)にフォールバックする
function applyPublicTheme(payload) {
  const root = document.documentElement.style;
  const theme = (payload && payload.theme) || {};
  const colors = (payload && payload.colors) || {};
  const top = safeColor(theme.primary, safeColor(colors.goods, '#f8b6c8'));
  const bottom = safeColor(theme.secondary, safeColor(colors.stream, '#a5d8e6'));
  root.setProperty('--bg-top', mixWithWhite(top, 0.3));
  root.setProperty('--bg-bottom', mixWithWhite(bottom, 0.3));
  root.setProperty('--bg', mixWithWhite(top, 0.88));
  // theme.today が無い(旧形式ペイロード)場合はメイン色をそのまま使う簡易フォールバック
  root.setProperty('--today-border', safeColor(theme.today, '') || top);
}

// formatEventSchedule: 予定の日時表記を統一する純関数(index.htmlと同一仕様)
// 期間もの: 「6月20日(土)19:00〜8月9日(日) 23:59まで」 / 単日: 「21:00〜22:30」
// anniversary(記念日): 「毎年5月10日」+ time/endTimeがあれば単日と同じ流儀で付ける
function formatEventSchedule(ev) {
  if (!ev) return '';
  if (ev.category === 'anniversary') {
    if (!ev.startDate) return '';
    const { m, d } = parseDateStr(ev.startDate);
    const base = `毎年${m}月${d}日`;
    if (!ev.time && !ev.endTime) return base;
    if (!ev.time) return `${base} ${ev.endTime}まで`;
    return `${base} ${ev.time}〜${ev.endTime || ''}`;
  }
  const multi = ev.startDate !== ev.endDate;
  if (multi) {
    const start = `${formatDateLabel(ev.startDate)}${ev.time ? ` ${ev.time}` : ''}`;
    const end = `${formatDateLabel(ev.endDate)}${ev.endTime ? ` ${ev.endTime}まで` : ''}`;
    return `${start}〜 ${end}`;
  }
  if (!ev.time && !ev.endTime) return '';
  if (!ev.time) return `${ev.endTime}まで`;
  return `${ev.time}〜${ev.endTime || ''}`;
}

// formatEventScheduleWithDate: 一覧アイテム(今月のイベント予定/販売期間中一覧/今日の予定)専用の日時表記(index.htmlと同一仕様)。
// 期間もの・anniversaryは formatEventSchedule と同じ結果を返す(既に日付が入っているため)。
// 単日(startDate === endDate)のみ formatDateLabel の日付を先頭に付ける。
// formatEventSchedule 自体は変更しない(詳細シート/通知/公開ページの詳細表示は従来通り)
function formatEventScheduleWithDate(ev) {
  if (!ev) return '';
  if (ev.category === 'anniversary') return formatEventSchedule(ev);
  const multi = ev.startDate !== ev.endDate;
  if (multi) return formatEventSchedule(ev);
  const timePart = formatEventSchedule(ev);
  return `${formatDateLabel(ev.startDate)}${timePart ? ` ${timePart}` : ''}`;
}

// linkifyText: エスケープ済みテキスト中の https?:// のURLだけを安全な<a>に変換する
// 必ず先にescapeHtmlを通すこと。javascript:等は正規表現で最初から除外される
function linkifyText(str) {
  const escaped = escapeHtml(str);
  return escaped.replace(/(https?:\/\/[^\s<>&"']+(?:&amp;[^\s<>&"']+)*)/g,
    (url) => `<a href="${url}" target="_blank" rel="noopener noreferrer nofollow">${url}</a>`);
}

/* ---------- 4. データ取得・検証(Gist由来データは信頼しない) ---------- */
function getGistIdFromUrl() {
  const params = new URLSearchParams(location.search);
  const g = params.get('g');
  return g ? g.trim() : '';
}

// loadPublicData: 無認証でGistをGETし、公開ファイルのJSONを返す。エラーは日本語メッセージで投げる
async function loadPublicData(gistId) {
  let res;
  try {
    res = await fetch(`https://api.github.com/gists/${encodeURIComponent(gistId)}`, {
      headers: { Accept: 'application/vnd.github+json' },
    });
  } catch (e) {
    throw new Error('ネットワークに接続できません。通信環境を確認してください');
  }
  if (res.status === 404) throw new Error('指定された公開カレンダーが見つかりませんでした');
  if (res.status === 403) throw new Error('アクセスが集中しています。しばらくしてから開いてください');
  if (!res.ok) throw new Error(`データの取得に失敗しました(エラーコード ${res.status})`);
  let gist;
  try {
    gist = await res.json();
  } catch (e) {
    throw new Error('データの形式が正しくありません');
  }
  const file = gist && gist.files && gist.files[PUBLIC_GIST_FILENAME];
  if (!file || typeof file.content !== 'string') throw new Error('データの形式が正しくありません');
  let payload;
  try {
    payload = JSON.parse(file.content);
  } catch (e) {
    throw new Error('データの形式が正しくありません');
  }
  if (!payload || payload.v !== 1 || !Array.isArray(payload.events)) {
    throw new Error('データの形式が正しくありません');
  }
  return payload;
}

// sanitizeEvent: 公開Gist由来のイベント1件を検証する純関数。不正なものは null を返す
function sanitizeEvent(ev) {
  if (!ev || typeof ev !== 'object') return null;
  if (ALLOWED_CATEGORIES.indexOf(ev.category) === -1) return null;
  if (typeof ev.title !== 'string' || !ev.title.trim()) return null;
  if (typeof ev.startDate !== 'string' || !DATE_RE.test(ev.startDate)) return null;
  if (typeof ev.endDate !== 'string' || !DATE_RE.test(ev.endDate)) return null;
  const time = typeof ev.time === 'string' && TIME_RE.test(ev.time) ? ev.time : '';
  const endTime = typeof ev.endTime === 'string' && TIME_RE.test(ev.endTime) ? ev.endTime : '';
  const id = typeof ev.id === 'string' ? ev.id : '';
  const memo = typeof ev.memo === 'string' ? ev.memo.slice(0, 500) : '';
  const longTerm = ev.longTerm === true; // 旧形式データ(フィールド無し)は false 扱い
  return { id, category: ev.category, title: ev.title, startDate: ev.startDate, endDate: ev.endDate, time, endTime, memo, longTerm };
}

// sanitizePayload: 公開Gist由来データ全体を検証・無害化する純関数
function sanitizePayload(raw) {
  const source = raw && typeof raw === 'object' ? raw : {};
  const events = Array.isArray(source.events) ? source.events.map(sanitizeEvent).filter(Boolean) : [];
  const oshiName = typeof source.oshiName === 'string' ? source.oshiName : '';
  const colorsRaw = source.colors && typeof source.colors === 'object' ? source.colors : {};
  const colors = {};
  ALLOWED_CATEGORIES.forEach((cat) => { colors[cat] = safeColor(colorsRaw[cat], DEFAULT_COLORS[cat]); });
  const themeRaw = source.theme && typeof source.theme === 'object' ? source.theme : {};
  const theme = {
    primary: safeColor(themeRaw.primary, '#f8b6c8'),
    secondary: safeColor(themeRaw.secondary, '#a5d8e6'),
    today: safeColor(themeRaw.today, ''),
  };
  return { oshiName, theme, colors, events };
}

/* ---------- 5. logic(簡易版リマインド・当日抽出) ---------- */

// isLeapYear: うるう年(2月29日が存在する年)かどうかを判定する純関数(index.htmlと同一仕様)
function isLeapYear(year) {
  return (year % 4 === 0 && year % 100 !== 0) || year % 400 === 0;
}

// occursOnDay: 指定した日にその予定が表示されるかを判定する純関数(index.htmlと同一仕様)。
// anniversary(記念日)以外は従来通り isDateInRange による期間内判定。
// anniversary は startDate の月日が dateStr の月日と一致すれば年を問わず毎年表示する。
// 例外: startDate が 02-29(うるう日)の記念日は、2月29日が存在しない平年では 02-28 に表示する
function occursOnDay(ev, dateStr) {
  if (!ev || !dateStr) return false;
  if (ev.category !== 'anniversary') {
    return isDateInRange(dateStr, ev.startDate, ev.endDate);
  }
  if (!ev.startDate) return false;
  const start = parseDateStr(ev.startDate);
  const target = parseDateStr(dateStr);
  if (start.m === target.m && start.d === target.d) return true;
  if (start.m === 2 && start.d === 29 && target.m === 2 && target.d === 28) {
    return !isLeapYear(target.y);
  }
  return false;
}

function eventsOnDay(events, dateStr) {
  return (events || []).filter((ev) => ev && occursOnDay(ev, dateStr));
}

// todayAgenda: ヘッダー直下の「今日の予定」カードに出す当日情報を返す純関数(index.htmlと同一仕様。v25)。
// 公開データにシフトは無いため { dateStr, events } のみを返す。
// events は eventsOnDay(occursOnDayベース。記念日も含む)と同じ抽出結果から
// 長期予定(longTerm===true)を除外したものを、
// 時刻順(timeがある予定を先にtime昇順、無い予定は後ろに回す)→タイトル昇順(localeCompare)でソートする。
// 長期予定(longTerm)は「📌 販売期間中 一覧」に出るため、このカードには含めない
function todayAgenda(events, today) {
  const sorted = eventsOnDay(events, today)
    .filter((ev) => ev.longTerm !== true)
    .sort((a, b) => {
      if (a.time && b.time) {
        if (a.time !== b.time) return a.time < b.time ? -1 : 1;
        return String(a.title).localeCompare(String(b.title));
      }
      if (a.time && !b.time) return -1;
      if (!a.time && b.time) return 1;
      return String(a.title).localeCompare(String(b.title));
    });
  return { dateStr: today, events: sorted };
}

// isEventInMonth: 予定が指定した年月に重なるかを判定する純関数(index.htmlと同一仕様)。
// anniversary(記念日)は年を問わず「startDateの月 === 対象月」で判定する
function isEventInMonth(ev, year, month) {
  if (ev && ev.category === 'anniversary') {
    if (!ev.startDate) return false;
    return parseDateStr(ev.startDate).m === month;
  }
  const monthStart = fmtDate(year, month, 1);
  const monthEnd = fmtDate(year, month, daysInMonth(year, month));
  return isDateInRange(ev.startDate, monthStart, monthEnd)
    || isDateInRange(ev.endDate, monthStart, monthEnd)
    || (compareDates(ev.startDate, monthStart) <= 0 && compareDates(ev.endDate, monthEnd) >= 0);
}

// listLongTermEvents: 上部一覧に出す長期予定を返す純関数。全件返す(月による絞り込みなし)。
// 締切日(endDate)が近い順(同じなら startDate 昇順)で返す。
// today(YYYY-MM-DD)を渡すと、終了した予定(endDate < today)は一覧に出さない(最終日当日は表示する)。
// 日マスの細ライン(period-lines)や日詳細の折りたたみ(期間中の長期予定)のロジックは対象外(過去の月でも見られる)。
// today が falsy の場合は日付フィルタをスキップして従来通り全件返す(null安全・テスト互換のため)
function listLongTermEvents(events, today) {
  return (events || [])
    .filter((ev) => ev && ev.longTerm === true)
    .filter((ev) => !today || compareDates(ev.endDate, today) >= 0)
    .slice()
    .sort((a, b) => compareDates(a.endDate, b.endDate) || compareDates(a.startDate, b.startDate));
}

// listMonthlyEvents: 「今月のイベント予定」枠に出すイベントカテゴリの予定を返す純関数。
// category==='event' の予定のうち、指定した year/month と期間が重なるものを
// startDate 昇順(同じなら endDate 昇順)で返す。longTermかどうかは問わない(longTermのイベントも対象に含む)。
function listMonthlyEvents(events, year, month) {
  return (events || [])
    .filter((ev) => ev && ev.category === 'event' && isEventInMonth(ev, year, month))
    .slice()
    .sort((a, b) => compareDates(a.startDate, b.startDate) || compareDates(a.endDate, b.endDate));
}

// isEventFinished: その予定が「もう終わったか」を判定する純関数(v41。本体index.htmlの同名関数と同一仕様)。
// 終了日(endDate。無ければstartDate)が today より前なら終了。**最終日当日は終了扱いにしない**
// (「📌 販売期間中 一覧」が最終日当日まで表示し続けるのと同じ基準に揃える)。
// 記念日(anniversary)は毎年繰り返す予定なので、過去日でも常に false を返す。
// 「今月のイベント予定」の"イベント終了"スタンプ表示にだけ使う表示専用の判定。
// ev が無い・日付が無い・today が空のときは false(判断できないものにスタンプは押さない)
function isEventFinished(ev, today) {
  if (!ev || !today) return false;
  if (ev.category === 'anniversary') return false;
  const endDate = ev.endDate || ev.startDate;
  if (!endDate) return false;
  return compareDates(endDate, today) < 0;
}

// eventDomId / findEventByDomId: 公開データのidが空文字の可能性があるため、
// 空idのイベントは配列内インデックスをフォールバックのdata-idとして使う(open-event側で確実に同じイベントを引く)
function eventDomId(ev, events) {
  if (ev && ev.id) return ev.id;
  const idx = (events || []).indexOf(ev);
  return `idx:${idx}`;
}

function findEventByDomId(events, domId) {
  if (typeof domId !== 'string' || !domId) return null;
  if (domId.indexOf('idx:') === 0) {
    const idx = parseInt(domId.slice(4), 10);
    return Number.isInteger(idx) && events && events[idx] ? events[idx] : null;
  }
  return (events || []).find((ev) => ev && ev.id === domId) || null;
}

// computeSimpleReminders: computeReminders相当の簡易版(§12.7、v31で本体に近い内容へ拡張)。
// 公開データ(oshical-public.jsonのevents。既に公開チェック済みのものしか入っていない)にある
// 情報だけで以下のマイルストーンを判定する:
//   lastday-eve: 期間ものの endDate===明日 → ⚠明日が最終日(既存)
//   lastday    : 期間ものの endDate===今日 → 🔔今日が最終日(既存)
//   firstday   : 期間ものの startDate===今日 → 🎪今日から!(新規)
//   today-time : 単日+時刻ありの startDate===今日 → 📺今日◯時〜(新規)
//   anniversary: occursOnDayが今日に一致する記念日 → 🎉今日は◯◯!(新規)
// MILESTONE_PRIORITY の順(lastday-eve→lastday→firstday→anniversary→today-time)でソートして返す
// v40: 各リマインドに domId(eventDomId と同じ形式。idが空なら idx:番号)を持たせるようにした。
// お知らせをタップして予定の詳細シートを開くために、元イベントを引き直せる必要があるため。
// 本体index.htmlの computeReminders が eventId を持っているのと同じ役割。既存の
// milestone / text はそのままなので、この追加で表示や並び順は変わらない
function computeSimpleReminders(events, today) {
  const tomorrow = addDays(today, 1);
  const list = events || [];
  const reminders = [];
  list.forEach((ev) => {
    if (!ev || !ev.title || !ev.startDate || !ev.endDate) return;
    const domId = eventDomId(ev, list);
    // anniversary(記念日): 単日予定のため期間系リマインド(最終日前日/当日/初日)は対象外。
    // occursOnDay で毎年の同月日判定を行い、一致した日にだけ🎉リマインドを出す
    if (ev.category === 'anniversary') {
      if (occursOnDay(ev, today)) reminders.push({ milestone: 'anniversary', domId, text: `🎉 今日は『${ev.title}』!` });
      return;
    }
    const isPeriod = !!CATEGORY_PERIOD[ev.category];
    const isMultiDay = ev.startDate !== ev.endDate;
    if (isPeriod && isMultiDay && ev.endDate === tomorrow) {
      reminders.push({ milestone: 'lastday-eve', domId, text: `⚠ 『${ev.title}』は明日が最終日!` });
    }
    if (isPeriod && isMultiDay && ev.endDate === today) {
      reminders.push({ milestone: 'lastday', domId, text: `🔔 『${ev.title}』は今日が最終日!` });
    }
    if (isPeriod && isMultiDay && ev.startDate === today) {
      reminders.push({ milestone: 'firstday', domId, text: `🎪 『${ev.title}』今日から!` });
    }
    if (!isPeriod && ev.startDate === today && ev.time) {
      const range = ` ${ev.time}〜${ev.endTime || ''}`;
      reminders.push({ milestone: 'today-time', domId, text: `📺 『${ev.title}』今日${range}` });
    }
  });
  return reminders.sort((a, b) => MILESTONE_PRIORITY[a.milestone] - MILESTONE_PRIORITY[b.milestone]);
}

// filterDeadlineReminders: 画面表示用に、computeSimpleReminders() の結果から「最終日系」
// (lastday-eve: 明日が最終日 / lastday: 今日が最終日)のみを残す純関数(本体index.htmlの同名関数と
// 同一仕様)。firstday・today-time・anniversaryは今日の予定リストと重複するため表示から除外する
// (v32)。computeSimpleReminders 自体は将来の利用のため全種類を返したまま変更しない。
// 元の配列の順序を維持する。null / 非配列 の場合は空配列を返す
function filterDeadlineReminders(reminders) {
  if (!Array.isArray(reminders)) return [];
  return reminders.filter((r) => r && (r.milestone === 'lastday-eve' || r.milestone === 'lastday'));
}

// computeDayNotices: カレンダーの日をタップして開く日詳細シートの一番上に出す
// 「その日のお知らせ」を作る純関数(v42。本体index.htmlの同名関数と同一仕様。
// あちらは state、こちらは公開データの events 配列を受け取る点だけが違う)。
// **computeSimpleReminders との違い**: あちらは「今日」が基準で文言も「今日が最終日」になる。
// こちらは**指定した日(dateStr)そのもの**が基準で、文言も「この日が最終日」「この日から」になる。
// 出すのは期間もの(CATEGORY_PERIOD)かつ複数日の予定の「最終日」と「初日」だけ。
// 並びは最終日→初日の順。events が無い・dateStr が空のときは空配列。引数は書き換えない
function computeDayNotices(events, dateStr) {
  if (!dateStr) return [];
  const list = Array.isArray(events) ? events : [];
  const lastdayNotices = [];
  const firstdayNotices = [];
  list.forEach((ev) => {
    if (!ev || !ev.title || !ev.startDate || !ev.endDate) return;
    if (!CATEGORY_PERIOD[ev.category]) return;
    if (ev.startDate === ev.endDate) return; // 単日の期間ものは「最終日」「初日」を出す意味がない
    if (ev.endDate === dateStr) {
      lastdayNotices.push({ eventId: ev.id, kind: 'lastday', text: `🔔 『${ev.title}』はこの日が最終日` });
    }
    if (ev.startDate === dateStr) {
      firstdayNotices.push({ eventId: ev.id, kind: 'firstday', text: `🎪 『${ev.title}』はこの日から` });
    }
  });
  return lastdayNotices.concat(firstdayNotices);
}

// buildTodayReminderViews: 「今日の予定」カード内のお知らせを描画するための表示用データを作る純関数(v40。
// 本体index.htmlの同名関数と同一の考え方。あちらは state と eventId、こちらは公開データの
// events配列と domId(idが空なら idx:番号)を使う点だけが違う)。
// r.domId から元イベントを findEventByDomId で引き直し、見つかったものだけ tappable:true にする。
// 呼び出し側はこれを見て <button data-action="open-event"> にするか <div> のままにするかを決める。
// タップしても詳細が開かない「反応しないボタン」を作らないための振り分け。
// 引数は書き換えず新しい配列・新しいオブジェクトを返す。順序は元の配列のまま。
// reminders が null / 非配列 のときは空配列を返す
function buildTodayReminderViews(events, reminders) {
  if (!Array.isArray(reminders)) return [];
  const list = events || [];
  return reminders
    .filter((r) => r)
    .map((r) => {
      const ev = r.domId ? findEventByDomId(list, r.domId) : null;
      return { text: r.text || '', domId: ev ? r.domId : null, tappable: !!ev };
    });
}

/* ---------- 6. state(画面の一時状態のみ。永続化しない) ---------- */
let appState = {
  status: 'loading', // 'loading' | 'error' | 'ready'
  errorMessage: '',
  payload: null, // { oshiName, colors, events }
  year: 2000,
  month: 1,
  selectedDate: null,
  selectedEventId: null, // 'event'シートで表示中イベントのdata-id値(idまたは idx:形式)
  sheet: null, // null | 'day' | 'event'
  dayLongTermOpen: false, // 日詳細シート内の「期間中の長期予定」折りたたみの開閉
};

function setAppState(partial) {
  appState = { ...appState, ...partial };
  render();
}

/* ---------- 7. render ---------- */
function render() {
  const root = document.getElementById('app');
  root.innerHTML = renderApp();
}

function renderApp() {
  if (appState.status === 'loading') return renderStateBox('読み込み中です…');
  if (appState.status === 'error') return renderStateBox(appState.errorMessage, true);
  return `
    ${renderHeader()}
    ${renderNavBar()}
    ${renderTodaySection()}
    ${renderMonthlyEventSection()}
    ${renderLongTermSection()}
    ${renderCalendar()}
    ${renderSheetOverlay()}
    ${renderFooterNote()}
  `;
}

function renderStateBox(message, isError) {
  return `
    <div class="state-box">
      <h2>${isError ? '表示できません' : '推し活カレンダー'}</h2>
      <p>${escapeHtml(message)}</p>
    </div>
  `;
}

function renderHeader() {
  const oshiName = (appState.payload && appState.payload.oshiName) || '推し';
  return `
    <header class="app-header">
      <div class="header-top">
        <h1>${escapeHtml(oshiName)}カレンダー</h1>
        <span class="header-badge">公開ページ</span>
      </div>
    </header>
  `;
}

// renderNavBar: 月移動・今日ボタン・カテゴリの凡例をまとめた操作行(v35)。
// スクロールしても画面上部に貼り付くよう、ヘッダーの中ではなく#app直下の要素として描画する
// (position:stickyは親要素の範囲でしか効かないため、ヘッダー内に置くとヘッダーごと流れて消える)。
// 凡例は「初見の人がカレンダーを見た瞬間に色の意味が分かる」ように、
// ページ下部からこの位置(今日ボタンの右隣)へ移動した
function renderNavBar() {
  const monthLabel = formatMonthLabel(appState.year, appState.month);
  return `
    <div class="nav-bar">
      <div class="header-nav">
        <button type="button" class="nav-btn" data-action="prev-month" aria-label="前の月">◀</button>
        <span class="month-label">${escapeHtml(monthLabel)}</span>
        <button type="button" class="nav-btn" data-action="next-month" aria-label="次の月">▶</button>
        <button type="button" class="today-btn" data-action="go-today">今日</button>
        ${renderLegend()}
      </div>
    </div>
  `;
}

// renderTodaySection: ヘッダー直下に出す「今日の予定」専用カード(v24。v31でお知らせ(リマインド)を
// カード内に統合し、カード外の独立バナー(旧renderReminderBanner)は廃止した。v32でお知らせを
// 最終日系(lastday-eve/lastday)のみに絞り、配信開始・記念日などは今日の予定リスト側と重複するため
// 表示から外した)。
// 公開データにシフトは無いため予定一覧のみを表示する。今日固定(表示中の月に依存しない)。
// リマインドは見出しの下・予定リストの上に表示し、0件なら何も出さない。
// 予定が0件でもリマインドがあれば「今日の予定はありません」は出さずリマインドのみ表示する。
// カード自体は予定・リマインドとも0件でも常に表示する。合言葉の猫の顔文字はこのページには一切出さない。
// v40: お知らせも他の一覧アイテムと同じくタップで個別詳細シートを開けるようにした
// (本体index.htmlと同一仕様)。buildTodayReminderViews で「元の予定が公開データに今もあるか」を
// 判定し、あるものだけ <button data-action="open-event"> にする
function renderTodaySection() {
  const today = todayStr();
  const agenda = todayAgenda(appState.payload.events, today);
  const reminders = filterDeadlineReminders(computeSimpleReminders(appState.payload.events, today));
  const reminderViews = buildTodayReminderViews(appState.payload.events, reminders);
  const reminderHtml = reminderViews.length
    ? `<div class="today-reminder-list">${reminderViews.map((r) => (r.tappable
        ? `<button type="button" class="today-reminder is-tappable" data-action="open-event" data-id="${escapeHtml(r.domId)}">`
          + `<span class="today-reminder-text">${escapeHtml(r.text)}</span>`
          + `<span class="today-reminder-chevron" aria-hidden="true">›</span>`
          + `</button>`
        : `<div class="today-reminder"><span class="today-reminder-text">${escapeHtml(r.text)}</span></div>`)).join('')}</div>`
    : '';
  const body = agenda.events.length
    ? `<div class="longterm-list">${agenda.events.map((ev) => renderLongTermItem(ev)).join('')}</div>`
    : (reminderViews.length ? '' : `<p class="empty-hint">今日の予定はありません</p>`);
  return `
    <section class="longterm-section">
      <h2 class="longterm-title">📅 今日の予定<span class="today-date-label">${escapeHtml(formatDateLabel(agenda.dateStr))}</span></h2>
      ${reminderHtml}
      ${body}
    </section>
  `;
}

// renderMonthlyEventSection: 「📌 販売期間中 一覧」のすぐ上に出す「今月のイベント予定」枠。
// 表示中の月に重なる category==='event' の予定を表示する(longTermかどうかは問わない)。
// 該当0件の月はセクションごと非表示。タップでその予定の個別詳細シートを開く
// 公開ページでは合言葉の猫の顔文字は絶対に出さない(見出しは✨️で代用する)
function renderMonthlyEventSection() {
  const events = appState.payload.events;
  const items = listMonthlyEvents(events, appState.year, appState.month);
  if (!items.length) return '';
  const today = parseDateStr(todayStr());
  const isCurrentMonth = appState.year === today.y && appState.month === today.m;
  const heading = isCurrentMonth ? '今月のイベント予定✨️' : `${appState.month}月のイベント予定✨️`;
  return `
    <section class="longterm-section">
      <h2 class="longterm-title">${escapeHtml(heading)}</h2>
      <div class="longterm-list">
        ${items.map((ev) => renderLongTermItem(ev, { showFinished: true })).join('')}
      </div>
    </section>
  `;
}

// renderLongTermSection: カレンダー上部の長期予定一覧。全件表示(月による絞り込みなし)。
// ただし終了した予定(endDate < today)は一覧から除外する(最終日当日は表示する)。
// タップでその予定の個別詳細シートを開く
function renderLongTermSection() {
  const items = listLongTermEvents(appState.payload.events, todayStr());
  if (!items.length) return '';
  return `
    <section class="longterm-section">
      <h2 class="longterm-title">📌 販売期間中 一覧（締切日が近い順）</h2>
      <div class="longterm-list">
        ${items.map((ev) => renderLongTermItem(ev)).join('')}
      </div>
    </section>
  `;
}

// renderLongTermItem: 一覧アイテム。options.showFinished が true のとき(=「今月のイベント予定」からの
// 呼び出しのみ。v41)だけ、終了した予定に"イベント終了"のハンコ+薄色表示を付ける(本体index.htmlと同一仕様)。
// ハンコは pointer-events:none なので、アイテム全体のタップ(open-event)の邪魔をしない
function renderLongTermItem(ev, options) {
  const opts = options || {};
  const showFinished = opts.showFinished === true;
  const finished = showFinished && isEventFinished(ev, todayStr());
  const color = safeColor(appState.payload.colors[ev.category], DEFAULT_COLORS[ev.category] || '#b8b8b8');
  const catLabel = CATEGORY_LABELS[ev.category] || ev.category;
  const domId = eventDomId(ev, appState.payload.events);
  const stampHtml = finished ? `<span class="finished-stamp">イベント終了</span>` : '';
  return `
    <button type="button" class="longterm-item${finished ? ' is-finished' : ''}" data-action="open-event" data-id="${escapeHtml(domId)}">
      <span class="longterm-bar" style="background:${color}"></span>
      <span class="longterm-body">
        <span class="longterm-item-title">${escapeHtml(ev.title)}</span>
        <span class="longterm-item-schedule">${escapeHtml(catLabel)}・${escapeHtml(formatEventScheduleWithDate(ev))}</span>
      </span>
      ${stampHtml}
    </button>
  `;
}

function renderCalendar() {
  const weeks = monthGrid(appState.year, appState.month);
  const today = todayStr();
  const events = appState.payload.events;
  const monthEvents = events.filter((ev) => isEventInMonth(ev, appState.year, appState.month));
  return `
    <div class="calendar">
      <div class="weekday-row">
        ${WEEKDAY_LABELS.map((w, i) => `<div class="weekday${i === 0 ? ' sun' : ''}${i === 6 ? ' sat' : ''}">${w}</div>`).join('')}
      </div>
      <div class="month-grid">
        ${weeks.map((week) => week.map((cell) => renderDayCell(cell, today, events)).join('')).join('')}
      </div>
      ${monthEvents.length ? '' : '<p class="empty-state">この月には公開されている予定がありません🌸</p>'}
    </div>
  `;
}

function renderDayCell(cell, today, events) {
  const dayNum = parseDateStr(cell.dateStr).d;
  const dayEvents = eventsOnDay(events, cell.dateStr);
  // 長期予定はチップにせず、マス下部の細いラインだけで示す(本体アプリと同一仕様)
  const normalEvents = dayEvents.filter((ev) => ev.longTerm !== true);
  const longTermEvents = dayEvents.filter((ev) => ev.longTerm === true);
  const classes = ['day-cell'];
  if (!cell.inMonth) classes.push('outside');
  // 過ぎた日はひと目で分かるように薄く・彩度を落とす(v39。本体アプリと同一仕様)
  if (compareDates(cell.dateStr, today) < 0) classes.push('past');
  if (cell.dateStr === today) classes.push('today');
  const maxChips = 3;
  const shown = normalEvents.slice(0, maxChips);
  const extra = normalEvents.length - shown.length;
  return `
    <button type="button" class="${classes.join(' ')}" data-action="open-day" data-date="${cell.dateStr}">
      <span class="day-num">${dayNum}</span>
      <div class="chip-list">
        ${shown.map((ev) => renderChip(ev)).join('')}
        ${extra > 0 ? `<div class="chip chip-more">+${extra}</div>` : ''}
      </div>
      ${longTermEvents.length ? `<div class="period-lines">${longTermEvents.slice(0, 3).map((ev) => {
        const color = safeColor(appState.payload.colors[ev.category], DEFAULT_COLORS[ev.category] || '#b8b8b8');
        return `<span class="period-line" style="background:${color}"></span>`;
      }).join('')}</div>` : ''}
    </button>
  `;
}

function renderChip(ev) {
  const color = safeColor(appState.payload.colors[ev.category], DEFAULT_COLORS[ev.category] || '#b8b8b8');
  return `<div class="chip" style="background:${color}">${escapeHtml(ev.title)}</div>`;
}

// renderFooterNote: ページ末尾の注意書き(v38で全面的に書き換え)。
// 閲覧者に必ず伝えたいのは次の4点:
//  1. 公式ではなく、ファンが個人で作っている非公式のカレンダーであること
//  2. 出典は一般に公開されている情報のみであること
//  3. FANBOXなどの限定公開情報は載せていないこと
//  4. 限定配信はSNSや通常配信で言及があった分だけを記載し、原則として配信終了後に反映予定であること
// 文言はユーザー確定済み。**内容を勝手に変えない**(表現を変えるときは必ず確認を取る)。
// 固定文なのでエスケープ不要だが、将来ここに変数を差し込む場合は必ずescapeHtmlを通すこと
function renderFooterNote() {
  return `
    <div class="footer-note">
      <div class="footer-note-title">このカレンダーについて</div>
      <p>
        このカレンダーは、一般に公開されている情報のみをもとに、いちファンが個人で作成している
        <span class="note-strong">非公式</span>のものです。
      </p>
      <p>
        <span class="note-strong">FANBOXなどの限定公開情報は掲載していません。</span>
        限定配信については、SNSや通常配信で言及があった日程のみを記載し、
        <span class="note-strong">原則として配信終了後に反映を予定しています。</span>
      </p>
      <p>
        内容の正確性を保証するものではありません。お出かけやご購入の前に、
        <span class="note-strong">必ず公式の告知をご確認ください。</span>
      </p>
      <p>表示専用のページのため、編集はできません。</p>
    </div>
  `;
}

// renderLegend: カテゴリの色の凡例。v35で操作行(renderNavBar)の中へ移動し、
// 小さな色丸+カテゴリ名を折り返しで並べるコンパクトな見た目にした。
// 実際に表示する色は公開ペイロードのcolors、つまり作者が設定した色をsafeColorで検証して使う
function renderLegend() {
  const colors = (appState.payload && appState.payload.colors) || {};
  const items = ALLOWED_CATEGORIES.map((cat) => {
    const color = safeColor(colors[cat], DEFAULT_COLORS[cat]);
    return `<span class="legend-item"><span class="legend-swatch" style="background:${color}"></span>${escapeHtml(CATEGORY_LABELS[cat])}</span>`;
  }).join('');
  return `<div class="legend-inline" aria-label="カテゴリの色">${items}</div>`;
}

function renderSheetOverlay() {
  if (!appState.sheet) return '';
  let content = '';
  if (appState.sheet === 'day' && appState.selectedDate) content = renderDaySheetContent(appState.selectedDate);
  else if (appState.sheet === 'event') content = renderEventDetailSheetContent();
  if (!content) return '';
  return `
    <div class="sheet-backdrop">
      <div class="sheet">${content}</div>
    </div>
  `;
}

// renderDaySheetContent: カレンダーの日をタップして開く日詳細シート。
// v42: シートの一番上に「その日のお知らせ」(最終日・初日)を出す。文言は「この日が最終日」のように
// **開いている日そのもの**を基準にする(本体index.htmlと同一仕様)。0件なら何も出さない。表示専用
function renderDaySheetContent(dateStr) {
  const dayEvents = eventsOnDay(appState.payload.events, dateStr)
    .slice()
    .sort((a, b) => compareDates(a.startDate, b.startDate) || a.title.localeCompare(b.title));
  const normalEvents = dayEvents.filter((ev) => ev.longTerm !== true);
  const longTermEvents = dayEvents.filter((ev) => ev.longTerm === true);
  const hasNormal = normalEvents.length > 0;
  const hasLongTerm = longTermEvents.length > 0;
  const notices = computeDayNotices(appState.payload.events, dateStr);
  const noticeHtml = notices.length
    ? `<div class="day-notice-list">${notices.map((n) => `<div class="day-notice">${escapeHtml(n.text)}</div>`).join('')}</div>`
    : '';
  return `
    <div class="sheet-header">
      <h2>${escapeHtml(formatDateLabel(dateStr))}</h2>
      <button type="button" class="icon-btn" data-action="close-sheet" aria-label="閉じる">✕</button>
    </div>
    <div class="sheet-body">
      ${noticeHtml}
      ${hasNormal ? normalEvents.map((ev) => renderDayEventItem(ev)).join('') : ''}
      ${!hasNormal && !hasLongTerm ? '<p class="empty-hint">公開されている予定はありません</p>' : ''}
      ${hasLongTerm ? renderDayLongTermToggle(longTermEvents) : ''}
    </div>
  `;
}

// renderDayLongTermToggle: 日詳細シート内、通常予定の下に出す長期予定の折りたたみ行(本体アプリと同一仕様)
function renderDayLongTermToggle(longTermEvents) {
  const open = appState.dayLongTermOpen === true;
  return `
    <button type="button" class="longterm-collapse" data-action="toggle-day-longterm">📌 期間中の長期予定 ${longTermEvents.length}件 ${open ? '▾' : '▸'}</button>
    ${open ? longTermEvents.map((ev) => renderDayEventItem(ev)).join('') : ''}
  `;
}

// renderEventDetailSheetContent: 長期予定一覧タップで開く個別詳細シート
function renderEventDetailSheetContent() {
  const ev = findEventByDomId(appState.payload.events, appState.selectedEventId);
  return `
    <div class="sheet-header">
      <h2>予定の詳細</h2>
      <button type="button" class="icon-btn" data-action="close-sheet" aria-label="閉じる">✕</button>
    </div>
    <div class="sheet-body">
      ${ev ? renderDayEventItem(ev) : '<p class="empty-hint">この予定は見つかりませんでした</p>'}
    </div>
  `;
}

function renderDayEventItem(ev) {
  const color = safeColor(appState.payload.colors[ev.category], DEFAULT_COLORS[ev.category]);
  const catLabel = CATEGORY_LABELS[ev.category] || ev.category;
  return `
    <div class="event-item" style="border-left-color:${color}">
      <div class="event-item-title">${escapeHtml(ev.title)}</div>
      <div class="event-item-meta">${escapeHtml(catLabel)}${formatEventSchedule(ev) ? ' ・ ' + escapeHtml(formatEventSchedule(ev)) : ''}</div>
      ${ev.memo ? `<div class="event-item-memo">${linkifyText(ev.memo)}</div>` : ''}
    </div>
  `;
}

/* ---------- 8. イベント委譲 ---------- */
function handleAction(el) {
  const action = el.dataset.action;
  switch (action) {
    case 'prev-month': {
      const { y, m } = parseDateStr(addMonths(fmtDate(appState.year, appState.month, 1), -1));
      setAppState({ year: y, month: m });
      break;
    }
    case 'next-month': {
      const { y, m } = parseDateStr(addMonths(fmtDate(appState.year, appState.month, 1), 1));
      setAppState({ year: y, month: m });
      break;
    }
    case 'go-today': {
      const { y, m } = parseDateStr(todayStr());
      setAppState({ year: y, month: m });
      break;
    }
    case 'open-day':
      setAppState({ sheet: 'day', selectedDate: el.dataset.date, dayLongTermOpen: false });
      break;
    case 'open-event':
      setAppState({ sheet: 'event', selectedEventId: el.dataset.id });
      break;
    case 'toggle-day-longterm':
      setAppState({ dayLongTermOpen: !appState.dayLongTermOpen });
      break;
    case 'close-sheet':
      setAppState({ sheet: null, selectedDate: null, selectedEventId: null });
      break;
    default:
      break;
  }
}

function onAppClick(e) {
  const backdrop = e.target.closest('.sheet-backdrop');
  if (backdrop && e.target === backdrop) {
    setAppState({ sheet: null, selectedDate: null, selectedEventId: null });
    return;
  }
  const actionEl = e.target.closest('[data-action]');
  if (!actionEl) return;
  handleAction(actionEl);
}

function onAppKeydown(e) {
  if (e.key === 'Escape' && appState.sheet) {
    setAppState({ sheet: null, selectedDate: null, selectedEventId: null });
  }
}

/* ---------- 9. init ---------- */
function attachEventListeners() {
  const appEl = document.getElementById('app');
  appEl.addEventListener('click', onAppClick);
  document.addEventListener('keydown', onAppKeydown);
}

async function init() {
  attachEventListeners();
  const t = parseDateStr(todayStr());
  const gistId = getGistIdFromUrl();
  if (!gistId) {
    setAppState({ status: 'error', errorMessage: 'URLが正しくありません。公開カレンダーのリンクを確認してください', year: t.y, month: t.m });
    return;
  }
  setAppState({ year: t.y, month: t.m });
  try {
    const raw = await loadPublicData(gistId);
    const payload = sanitizePayload(raw);
    applyPublicTheme(payload);
    setAppState({ status: 'ready', payload });
  } catch (e) {
    console.error('公開カレンダーの取得に失敗しました', e);
    setAppState({ status: 'error', errorMessage: (e && e.message) || 'データの取得に失敗しました' });
  }
}

document.addEventListener('DOMContentLoaded', init);
</script>
