<style>

<body>
<div id="app" role="application" aria-label="推し活カレンダー(公開)"></div>
<script>
'use strict';

/* =========================================================
 * 推し活カレンダー 公開ページ(§12.7)
 * - 閲覧専用・単一ファイル・トークン不要
 * - 編集機能・localStorage・トークンは一切持たない
 * ========================================================= */

/* ---------- 1. CONSTANTS ---------- */
const PUBLIC_GIST_FILENAME = 'oshical-public.json';
const ALLOWED_CATEGORIES = ['event', 'goods', 'ticket', 'stream', 'other'];
const CATEGORY_LABELS = { event: 'イベント', goods: 'グッズ販売', ticket: 'チケット販売', stream: '配信', other: 'その他' };
const CATEGORY_PERIOD = { event: true, goods: true, ticket: true, stream: false, other: true };
const DEFAULT_COLORS = { event: '#e893ac', goods: '#f8b6c8', ticket: '#9ccc65', stream: '#a5d8e6', other: '#b8b8b8' };
const WEEKDAY_LABELS = ['日', '月', '火', '水', '木', '金', '土'];
const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
const TIME_RE = /^([01]\d|2[0-3]):[0-5]\d$/;
const COLOR_RE = /^#[0-9a-fA-F]{3,8}$/;

/* ---------- 2. date-utils(index.htmlのdate-utilsから公開ページに必要な分だけ複製) ---------- */
function pad2(n) {
  return String(n).padStart(2, '0');
}

function fmtDate(y, m, d) {
  return `${y}-${pad2(m)}-${pad2(d)}`;
}

function parseDateStr(s) {
  const parts = String(s).split('-').map(Number);
  return { y: parts[0], m: parts[1], d: parts[2] };
}

function dateStrToDate(s) {
  const { y, m, d } = parseDateStr(s);
  return new Date(y, m - 1, d);
}

function dateToDateStr(date) {
  return fmtDate(date.getFullYear(), date.getMonth() + 1, date.getDate());
}

function todayStr(now) {
  const d = now instanceof Date ? now : new Date();
  return dateToDateStr(d);
}

function addDays(dateStr, n) {
  const d = dateStrToDate(dateStr);
  d.setDate(d.getDate() + n);
  return dateToDateStr(d);
}

function addMonths(dateStr, n) {
  const { y, m, d } = parseDateStr(dateStr);
  const date = new Date(y, m - 1 + n, 1);
  const lastDay = daysInMonth(date.getFullYear(), date.getMonth() + 1);
  date.setDate(Math.min(d, lastDay));
  return dateToDateStr(date);
}

function daysInMonth(year, month) {
  return new Date(year, month, 0).getDate();
}

function compareDates(a, b) {
  if (a < b) return -1;
  if (a > b) return 1;
  return 0;
}

function isDateInRange(dateStr, start, end) {
  return compareDates(dateStr, start) >= 0 && compareDates(dateStr, end) <= 0;
}

function monthGrid(year, month) {
  const first = new Date(year, month - 1, 1);
  const startOffset = first.getDay();
  const gridStart = new Date(year, month - 1, 1 - startOffset);
  const cells = [];
  for (let i = 0; i < 42; i++) {
    const d = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate() + i);
    cells.push({ dateStr: dateToDateStr(d), inMonth: d.getMonth() === month - 1 });
  }
  const weeks = [];
  for (let i = 0; i < 6; i++) {
    weeks.push(cells.slice(i * 7, i * 7 + 7));
  }
  return weeks;
}

function formatMonthLabel(year, month) {
  return `${year}年${month}月`;
}

function formatDateLabel(dateStr) {
  const d = dateStrToDate(dateStr);
  const { m, d: day } = parseDateStr(dateStr);
  return `${m}月${day}日(${WEEKDAY_LABELS[d.getDay()]})`;
}

/* ---------- 3. misc / XSS対策 ---------- */
function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function safeColor(value, fallback) {
  return typeof value === 'string' && COLOR_RE.test(value) ? value : fallback;
}

// mixWithWhite: 色を白と混ぜて淡くする(t=0で元色、t=1で白)。背景グラデーション用
function mixWithWhite(hex, t) {
  const clean = String(hex).replace('#', '');
  const full = clean.length === 3 ? clean.split('').map((c) => c + c).join('') : clean;
  const n = parseInt(full, 16);
  const mix = (v) => Math.round(v + (255 - v) * t);
  const toHex = (v) => Math.max(0, Math.min(255, v)).toString(16).padStart(2, '0');
  return `#${toHex(mix((n >> 16) & 255))}${toHex(mix((n >> 8) & 255))}${toHex(mix(n & 255))}`;
}

// applyPublicTheme: 公開データのテーマ色(メイン/サブ)から背景グラデーションを設定
// 旧形式データ(themeなし)はカテゴリ色(goods/stream)にフォールバックする
function applyPublicTheme(payload) {
  const root = document.documentElement.style;
  const theme = (payload && payload.theme) || {};
  const colors = (payload && payload.colors) || {};
  const top = safeColor(theme.primary, safeColor(colors.goods, '#f8b6c8'));
  const bottom = safeColor(theme.secondary, safeColor(colors.stream, '#a5d8e6'));
  root.setProperty('--bg-top', mixWithWhite(top, 0.3));
  root.setProperty('--bg-bottom', mixWithWhite(bottom, 0.3));
  root.setProperty('--bg', mixWithWhite(top, 0.88));
}

// formatEventSchedule: 予定の日時表記を統一する純関数(index.htmlと同一仕様)
// 期間もの: 「6月20日(土)19:00〜8月9日(日) 23:59まで」 / 単日: 「21:00〜22:30」
function formatEventSchedule(ev) {
  if (!ev) return '';
  const multi = ev.startDate !== ev.endDate;
  if (multi) {
    const start = `${formatDateLabel(ev.startDate)}${ev.time ? ` ${ev.time}` : ''}`;
    const end = `${formatDateLabel(ev.endDate)}${ev.endTime ? ` ${ev.endTime}まで` : ''}`;
    return `${start}〜 ${end}`;
  }
  if (!ev.time && !ev.endTime) return '';
  if (!ev.time) return `${ev.endTime}まで`;
  return `${ev.time}〜${ev.endTime || ''}`;
}

// linkifyText: エスケープ済みテキスト中の https?:// のURLだけを安全な<a>に変換する
// 必ず先にescapeHtmlを通すこと。javascript:等は正規表現で最初から除外される
function linkifyText(str) {
  const escaped = escapeHtml(str);
  return escaped.replace(/(https?:\/\/[^\s<>&"']+(?:&amp;[^\s<>&"']+)*)/g,
    (url) => `<a href="${url}" target="_blank" rel="noopener noreferrer nofollow">${url}</a>`);
}

/* ---------- 4. データ取得・検証(Gist由来データは信頼しない) ---------- */
function getGistIdFromUrl() {
  const params = new URLSearchParams(location.search);
  const g = params.get('g');
  return g ? g.trim() : '';
}

// loadPublicData: 無認証でGistをGETし、公開ファイルのJSONを返す。エラーは日本語メッセージで投げる
async function loadPublicData(gistId) {
  let res;
  try {
    res = await fetch(`https://api.github.com/gists/${encodeURIComponent(gistId)}`, {
      headers: { Accept: 'application/vnd.github+json' },
    });
  } catch (e) {
    throw new Error('ネットワークに接続できません。通信環境を確認してください');
  }
  if (res.status === 404) throw new Error('指定された公開カレンダーが見つかりませんでした');
  if (res.status === 403) throw new Error('アクセスが集中しています。しばらくしてから開いてください');
  if (!res.ok) throw new Error(`データの取得に失敗しました(エラーコード ${res.status})`);
  let gist;
  try {
    gist = await res.json();
  } catch (e) {
    throw new Error('データの形式が正しくありません');
  }
  const file = gist && gist.files && gist.files[PUBLIC_GIST_FILENAME];
  if (!file || typeof file.content !== 'string') throw new Error('データの形式が正しくありません');
  let payload;
  try {
    payload = JSON.parse(file.content);
  } catch (e) {
    throw new Error('データの形式が正しくありません');
  }
  if (!payload || payload.v !== 1 || !Array.isArray(payload.events)) {
    throw new Error('データの形式が正しくありません');
  }
  return payload;
}

// sanitizeEvent: 公開Gist由来のイベント1件を検証する純関数。不正なものは null を返す
function sanitizeEvent(ev) {
  if (!ev || typeof ev !== 'object') return null;
  if (ALLOWED_CATEGORIES.indexOf(ev.category) === -1) return null;
  if (typeof ev.title !== 'string' || !ev.title.trim()) return null;
  if (typeof ev.startDate !== 'string' || !DATE_RE.test(ev.startDate)) return null;
  if (typeof ev.endDate !== 'string' || !DATE_RE.test(ev.endDate)) return null;
  const time = typeof ev.time === 'string' && TIME_RE.test(ev.time) ? ev.time : '';
  const endTime = typeof ev.endTime === 'string' && TIME_RE.test(ev.endTime) ? ev.endTime : '';
  const id = typeof ev.id === 'string' ? ev.id : '';
  const memo = typeof ev.memo === 'string' ? ev.memo.slice(0, 500) : '';
  const longTerm = ev.longTerm === true; // 旧形式データ(フィールド無し)は false 扱い
  return { id, category: ev.category, title: ev.title, startDate: ev.startDate, endDate: ev.endDate, time, endTime, memo, longTerm };
}

// sanitizePayload: 公開Gist由来データ全体を検証・無害化する純関数
function sanitizePayload(raw) {
  const source = raw && typeof raw === 'object' ? raw : {};
  const events = Array.isArray(source.events) ? source.events.map(sanitizeEvent).filter(Boolean) : [];
  const oshiName = typeof source.oshiName === 'string' ? source.oshiName : '';
  const colorsRaw = source.colors && typeof source.colors === 'object' ? source.colors : {};
  const colors = {};
  ALLOWED_CATEGORIES.forEach((cat) => { colors[cat] = safeColor(colorsRaw[cat], DEFAULT_COLORS[cat]); });
  const themeRaw = source.theme && typeof source.theme === 'object' ? source.theme : {};
  const theme = {
    primary: safeColor(themeRaw.primary, '#f8b6c8'),
    secondary: safeColor(themeRaw.secondary, '#a5d8e6'),
  };
  return { oshiName, theme, colors, events };
}

/* ---------- 5. logic(簡易版リマインド・当日抽出) ---------- */
function eventsOnDay(events, dateStr) {
  return (events || []).filter((ev) => ev && isDateInRange(dateStr, ev.startDate, ev.endDate));
}

function isEventInMonth(ev, year, month) {
  const monthStart = fmtDate(year, month, 1);
  const monthEnd = fmtDate(year, month, daysInMonth(year, month));
  return isDateInRange(ev.startDate, monthStart, monthEnd)
    || isDateInRange(ev.endDate, monthStart, monthEnd)
    || (compareDates(ev.startDate, monthStart) <= 0 && compareDates(ev.endDate, monthEnd) >= 0);
}

// listLongTermEvents: 上部一覧に出す長期予定を返す純関数。全件返す(月による絞り込みなし)
function listLongTermEvents(events) {
  return (events || [])
    .filter((ev) => ev && ev.longTerm === true)
    .slice()
    .sort((a, b) => compareDates(a.startDate, b.startDate) || compareDates(a.endDate, b.endDate));
}

// eventDomId / findEventByDomId: 公開データのidが空文字の可能性があるため、
// 空idのイベントは配列内インデックスをフォールバックのdata-idとして使う(open-event側で確実に同じイベントを引く)
function eventDomId(ev, events) {
  if (ev && ev.id) return ev.id;
  const idx = (events || []).indexOf(ev);
  return `idx:${idx}`;
}

function findEventByDomId(events, domId) {
  if (typeof domId !== 'string' || !domId) return null;
  if (domId.indexOf('idx:') === 0) {
    const idx = parseInt(domId.slice(4), 10);
    return Number.isInteger(idx) && events && events[idx] ? events[idx] : null;
  }
  return (events || []).find((ev) => ev && ev.id === domId) || null;
}

// computeSimpleReminders: computeReminders相当の簡易版。期間ものの最終日前日/当日のみ(§12.7)
function computeSimpleReminders(events, today) {
  const tomorrow = addDays(today, 1);
  const reminders = [];
  (events || []).forEach((ev) => {
    if (!ev || !ev.title || !ev.startDate || !ev.endDate) return;
    const isPeriod = !!CATEGORY_PERIOD[ev.category];
    const isMultiDay = ev.startDate !== ev.endDate;
    if (!isPeriod || !isMultiDay) return;
    if (ev.endDate === tomorrow) reminders.push({ milestone: 'lastday-eve', text: `⚠ 『${ev.title}』は明日が最終日!` });
    if (ev.endDate === today) reminders.push({ milestone: 'lastday', text: `🔔 『${ev.title}』は今日が最終日!` });
  });
  return reminders;
}

/* ---------- 6. state(画面の一時状態のみ。永続化しない) ---------- */
let appState = {
  status: 'loading', // 'loading' | 'error' | 'ready'
  errorMessage: '',
  payload: null, // { oshiName, colors, events }
  year: 2000,
  month: 1,
  selectedDate: null,
  selectedEventId: null, // 'event'シートで表示中イベントのdata-id値(idまたは idx:形式)
  sheet: null, // null | 'day' | 'event'
  dayLongTermOpen: false, // 日詳細シート内の「期間中の長期予定」折りたたみの開閉
};

function setAppState(partial) {
  appState = { ...appState, ...partial };
  render();
}

/* ---------- 7. render ---------- */
function render() {
  const root = document.getElementById('app');
  root.innerHTML = renderApp();
}

function renderApp() {
  if (appState.status === 'loading') return renderStateBox('読み込み中です…');
  if (appState.status === 'error') return renderStateBox(appState.errorMessage, true);
  return `
    ${renderHeader()}
    ${renderReminderBanner()}
    ${renderLongTermSection()}
    ${renderCalendar()}
    ${renderLegend()}
    ${renderSheetOverlay()}
    <p class="footer-note">この予定は公開設定されたものだけを表示しています。編集はできません。</p>
  `;
}

function renderStateBox(message, isError) {
  return `
    <div class="state-box">
      <h2>${isError ? '表示できません' : '推し活カレンダー'}</h2>
      <p>${escapeHtml(message)}</p>
    </div>
  `;
}

function renderHeader() {
  const oshiName = (appState.payload && appState.payload.oshiName) || '推し';
  const monthLabel = formatMonthLabel(appState.year, appState.month);
  return `
    <header class="app-header">
      <div class="header-top">
        <h1>${escapeHtml(oshiName)}カレンダー</h1>
        <span class="header-badge">公開ページ</span>
      </div>
      <div class="header-nav">
        <button type="button" class="nav-btn" data-action="prev-month" aria-label="前の月">◀</button>
        <span class="month-label">${escapeHtml(monthLabel)}</span>
        <button type="button" class="nav-btn" data-action="next-month" aria-label="次の月">▶</button>
        <button type="button" class="today-btn" data-action="go-today">今日</button>
      </div>
    </header>
  `;
}

function renderReminderBanner() {
  const events = appState.payload.events;
  const reminders = computeSimpleReminders(events, todayStr());
  if (!reminders.length) return '';
  return `
    <div class="reminder-banner">
      ${reminders.map((r) => `<div class="reminder-item">${escapeHtml(r.text)}</div>`).join('')}
    </div>
  `;
}

// renderLongTermSection: カレンダー上部の長期予定一覧。全件表示(月による絞り込みなし)。
// タップでその予定の個別詳細シートを開く
function renderLongTermSection() {
  const items = listLongTermEvents(appState.payload.events);
  if (!items.length) return '';
  return `
    <section class="longterm-section">
      <h2 class="longterm-title">📌 長期予定一覧</h2>
      <div class="longterm-list">
        ${items.map((ev) => renderLongTermItem(ev)).join('')}
      </div>
    </section>
  `;
}

function renderLongTermItem(ev) {
  const color = safeColor(appState.payload.colors[ev.category], DEFAULT_COLORS[ev.category] || '#b8b8b8');
  const catLabel = CATEGORY_LABELS[ev.category] || ev.category;
  const domId = eventDomId(ev, appState.payload.events);
  return `
    <button type="button" class="longterm-item" data-action="open-event" data-id="${escapeHtml(domId)}">
      <span class="longterm-bar" style="background:${color}"></span>
      <span class="longterm-body">
        <span class="longterm-item-title">${escapeHtml(ev.title)}</span>
        <span class="longterm-item-schedule">${escapeHtml(catLabel)}・${escapeHtml(formatEventSchedule(ev))}</span>
      </span>
    </button>
  `;
}

function renderCalendar() {
  const weeks = monthGrid(appState.year, appState.month);
  const today = todayStr();
  const events = appState.payload.events;
  const monthEvents = events.filter((ev) => isEventInMonth(ev, appState.year, appState.month));
  return `
    <div class="calendar">
      <div class="weekday-row">
        ${WEEKDAY_LABELS.map((w, i) => `<div class="weekday${i === 0 ? ' sun' : ''}${i === 6 ? ' sat' : ''}">${w}</div>`).join('')}
      </div>
      <div class="month-grid">
        ${weeks.map((week) => week.map((cell) => renderDayCell(cell, today, events)).join('')).join('')}
      </div>
      ${monthEvents.length ? '' : '<p class="empty-state">この月には公開されている予定がありません🌸</p>'}
    </div>
  `;
}

function renderDayCell(cell, today, events) {
  const dayNum = parseDateStr(cell.dateStr).d;
  const dayEvents = eventsOnDay(events, cell.dateStr);
  // 長期予定はチップにせず、マス下部の細いラインだけで示す(本体アプリと同一仕様)
  const normalEvents = dayEvents.filter((ev) => ev.longTerm !== true);
  const longTermEvents = dayEvents.filter((ev) => ev.longTerm === true);
  const classes = ['day-cell'];
  if (!cell.inMonth) classes.push('outside');
  if (cell.dateStr === today) classes.push('today');
  const maxChips = 3;
  const shown = normalEvents.slice(0, maxChips);
  const extra = normalEvents.length - shown.length;
  return `
    <button type="button" class="${classes.join(' ')}" data-action="open-day" data-date="${cell.dateStr}">
      <span class="day-num">${dayNum}</span>
      <div class="chip-list">
        ${shown.map((ev) => renderChip(ev)).join('')}
        ${extra > 0 ? `<div class="chip chip-more">+${extra}</div>` : ''}
      </div>
      ${longTermEvents.length ? `<div class="period-lines">${longTermEvents.slice(0, 3).map((ev) => {
        const color = safeColor(appState.payload.colors[ev.category], DEFAULT_COLORS[ev.category] || '#b8b8b8');
        return `<span class="period-line" style="background:${color}"></span>`;
      }).join('')}</div>` : ''}
    </button>
  `;
}

function renderChip(ev) {
  const color = safeColor(appState.payload.colors[ev.category], DEFAULT_COLORS[ev.category] || '#b8b8b8');
  return `<div class="chip" style="background:${color}">${escapeHtml(ev.title)}</div>`;
}

function renderLegend() {
  const colors = appState.payload.colors;
  const items = ALLOWED_CATEGORIES.map((cat) => {
    const color = safeColor(colors[cat], DEFAULT_COLORS[cat]);
    return `<span class="legend-item"><span class="legend-swatch" style="background:${color}"></span>${escapeHtml(CATEGORY_LABELS[cat])}</span>`;
  }).join('');
  return `
    <div class="legend">
      <h3>カテゴリ</h3>
      <div class="legend-items">${items}</div>
    </div>
  `;
}

function renderSheetOverlay() {
  if (!appState.sheet) return '';
  let content = '';
  if (appState.sheet === 'day' && appState.selectedDate) content = renderDaySheetContent(appState.selectedDate);
  else if (appState.sheet === 'event') content = renderEventDetailSheetContent();
  if (!content) return '';
  return `
    <div class="sheet-backdrop">
      <div class="sheet">${content}</div>
    </div>
  `;
}

function renderDaySheetContent(dateStr) {
  const dayEvents = eventsOnDay(appState.payload.events, dateStr)
    .slice()
    .sort((a, b) => compareDates(a.startDate, b.startDate) || a.title.localeCompare(b.title));
  const normalEvents = dayEvents.filter((ev) => ev.longTerm !== true);
  const longTermEvents = dayEvents.filter((ev) => ev.longTerm === true);
  const hasNormal = normalEvents.length > 0;
  const hasLongTerm = longTermEvents.length > 0;
  return `
    <div class="sheet-header">
      <h2>${escapeHtml(formatDateLabel(dateStr))}</h2>
      <button type="button" class="icon-btn" data-action="close-sheet" aria-label="閉じる">✕</button>
    </div>
    <div class="sheet-body">
      ${hasNormal ? normalEvents.map((ev) => renderDayEventItem(ev)).join('') : ''}
      ${!hasNormal && !hasLongTerm ? '<p class="empty-hint">公開されている予定はありません</p>' : ''}
      ${hasLongTerm ? renderDayLongTermToggle(longTermEvents) : ''}
    </div>
  `;
}

// renderDayLongTermToggle: 日詳細シート内、通常予定の下に出す長期予定の折りたたみ行(本体アプリと同一仕様)
function renderDayLongTermToggle(longTermEvents) {
  const open = appState.dayLongTermOpen === true;
  return `
    <button type="button" class="longterm-collapse" data-action="toggle-day-longterm">📌 期間中の長期予定 ${longTermEvents.length}件 ${open ? '▾' : '▸'}</button>
    ${open ? longTermEvents.map((ev) => renderDayEventItem(ev)).join('') : ''}
  `;
}

// renderEventDetailSheetContent: 長期予定一覧タップで開く個別詳細シート
function renderEventDetailSheetContent() {
  const ev = findEventByDomId(appState.payload.events, appState.selectedEventId);
  return `
    <div class="sheet-header">
      <h2>予定の詳細</h2>
      <button type="button" class="icon-btn" data-action="close-sheet" aria-label="閉じる">✕</button>
    </div>
    <div class="sheet-body">
      ${ev ? renderDayEventItem(ev) : '<p class="empty-hint">この予定は見つかりませんでした</p>'}
    </div>
  `;
}

function renderDayEventItem(ev) {
  const color = safeColor(appState.payload.colors[ev.category], DEFAULT_COLORS[ev.category]);
  const catLabel = CATEGORY_LABELS[ev.category] || ev.category;
  return `
    <div class="event-item" style="border-left-color:${color}">
      <div class="event-item-title">${escapeHtml(ev.title)}</div>
      <div class="event-item-meta">${escapeHtml(catLabel)}${formatEventSchedule(ev) ? ' ・ ' + escapeHtml(formatEventSchedule(ev)) : ''}</div>
      ${ev.memo ? `<div class="event-item-memo">${linkifyText(ev.memo)}</div>` : ''}
    </div>
  `;
}

/* ---------- 8. イベント委譲 ---------- */
function handleAction(el) {
  const action = el.dataset.action;
  switch (action) {
    case 'prev-month': {
      const { y, m } = parseDateStr(addMonths(fmtDate(appState.year, appState.month, 1), -1));
      setAppState({ year: y, month: m });
      break;
    }
    case 'next-month': {
      const { y, m } = parseDateStr(addMonths(fmtDate(appState.year, appState.month, 1), 1));
      setAppState({ year: y, month: m });
      break;
    }
    case 'go-today': {
      const { y, m } = parseDateStr(todayStr());
      setAppState({ year: y, month: m });
      break;
    }
    case 'open-day':
      setAppState({ sheet: 'day', selectedDate: el.dataset.date, dayLongTermOpen: false });
      break;
    case 'open-event':
      setAppState({ sheet: 'event', selectedEventId: el.dataset.id });
      break;
    case 'toggle-day-longterm':
      setAppState({ dayLongTermOpen: !appState.dayLongTermOpen });
      break;
    case 'close-sheet':
      setAppState({ sheet: null, selectedDate: null, selectedEventId: null });
      break;
    default:
      break;
  }
}

function onAppClick(e) {
  const backdrop = e.target.closest('.sheet-backdrop');
  if (backdrop && e.target === backdrop) {
    setAppState({ sheet: null, selectedDate: null, selectedEventId: null });
    return;
  }
  const actionEl = e.target.closest('[data-action]');
  if (!actionEl) return;
  handleAction(actionEl);
}

function onAppKeydown(e) {
  if (e.key === 'Escape' && appState.sheet) {
    setAppState({ sheet: null, selectedDate: null, selectedEventId: null });
  }
}

/* ---------- 9. init ---------- */
function attachEventListeners() {
  const appEl = document.getElementById('app');
  appEl.addEventListener('click', onAppClick);
  document.addEventListener('keydown', onAppKeydown);
}

async function init() {
  attachEventListeners();
  const t = parseDateStr(todayStr());
  const gistId = getGistIdFromUrl();
  if (!gistId) {
    setAppState({ status: 'error', errorMessage: 'URLが正しくありません。公開カレンダーのリンクを確認してください', year: t.y, month: t.m });
    return;
  }
  setAppState({ year: t.y, month: t.m });
  try {
    const raw = await loadPublicData(gistId);
    const payload = sanitizePayload(raw);
    applyPublicTheme(payload);
    setAppState({ status: 'ready', payload });
  } catch (e) {
    console.error('公開カレンダーの取得に失敗しました', e);
    setAppState({ status: 'error', errorMessage: (e && e.message) || 'データの取得に失敗しました' });
  }
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
