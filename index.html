// renderHourSelect: 0〜23時+「送らない」の時刻セレクトを描画する
function renderHourSelect(settingKey, value, defaultHour) {
  const current = Number.isInteger(value) ? value : defaultHour;
  const options = [`<option value="-1"${current === -1 ? ' selected' : ''}>送らない</option>`];
  for (let h = 0; h < 24; h++) {
    options.push(`<option value="${h}"${current === h ? ' selected' : ''}>${h}時</option>`);
  }
  return `<select data-setting="${settingKey}">${options.join('')}</select>`;
}

/* --- イベントハンドラ(データ更新系) --- */
function updateSettings(partial) {
  setState((prev) => ({
    settings: { ...prev.settings, ...partial, updatedAt: Date.now() },
  }));
}

// updateSettingsQuiet: 再描画なしで設定を保存する(色変更中にカラーピッカーを閉じさせないため)
// テーマ反映はCSS変数の書き換えのみで行うので、画面の再構築は不要
function updateSettingsQuiet(partial) {
  state = { ...state, settings: { ...state.settings, ...partial, updatedAt: Date.now() } };
  saveState(state);
  applyTheme(state.settings);
  scheduleSync();
}

function handleSettingChange(key, inputEl) {
  if (key === 'notifyEnabled') {
    const checked = inputEl.checked;
    if (checked) {
      requestNotificationPermission().then((granted) => {
        updateSettings({ notifyEnabled: granted });
        if (!granted) showToast('通知の許可が得られませんでした');
      });
    } else {
      updateSettings({ notifyEnabled: false });
    }
    return;
  }
  if (key === 'oshiName') {
    updateSettings({ oshiName: inputEl.value });
    return;
  }
  if (key === 'notifyMorningHour' || key === 'notifyNoonHour' || key === 'notifyEveningHour') {
    const hour = parseInt(inputEl.value, 10);
    if (Number.isInteger(hour) && hour >= -1 && hour <= 23) {
      updateSettings({ [key]: hour });
    }
    return;
  }
  if (key === 'themePrimary' || key === 'themeSecondary') {
    updateSettingsQuiet({ [key]: inputEl.value });
    return;
  }
  if (key === 'publicEnabled') {
    if (inputEl.checked) {
      updateSettings({ publicEnabled: true });
    } else {
      disablePublicCalendar().catch((e) => console.error('公開カレンダーの停止に失敗しました', e));
    }
  }
}

// handleCopyPublicLink: 公開ページURLをクリップボードにコピーする(§12.5)
function handleCopyPublicLink(url) {
  if (!url) return;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url)
      .then(() => showToast('リンクをコピーしました'))
      .catch((e) => {
        console.error('クリップボードへのコピーに失敗しました', e);
        showToast('コピーに失敗しました。手動で選択してコピーしてください');
      });
  } else {
    console.info('このブラウザはクリップボードAPIに対応していません');
    showToast('コピーに失敗しました。手動で選択してコピーしてください');
  }
}

function handleShiftColorChange(code, value) {

function handleSaveEvent() {
  const draft = fixDraftPublic(fixDraftLongTerm(fixDraftEndDate(uiState.editingEvent)));
  const validation = validateEventInput(draft);
  if (!validation.valid) {
    setUiState({ formErrors: validation.errors });
    return;
  }
  const now = Date.now();
  if (draft.id) {
    setState((prev) => ({
      events: prev.events.map((ev) => (ev.id === draft.id
        ? { ...ev, ...draft, title: draft.title.trim(), updatedAt: now }
        : ev)),
    }));
  } else {
    const newEvent = {
      id: crypto.randomUUID(),
      kind: draft.kind,
      category: draft.category,
      title: draft.title.trim(),
      startDate: draft.startDate,
      endDate: draft.endDate,
      time: draft.time || '',
      memo: draft.memo || '',
      publicMemo: draft.publicMemo || '',
      endTime: draft.endTime || '',
      public: !!draft.public,
      longTerm: !!draft.longTerm,
      purchased: false,
      updatedAt: now,
      deleted: false,
    };
    setState((prev) => ({ events: [...prev.events, newEvent] }));
  }
  setUiState({ sheet: 'day', editingEvent: null, formOriginal: null, formErrors: {}, selectedEventId: null });
}

function handleDeleteEvent(id) {
  const ev = state.events.find((x) => x.id === id);
  if (!ev) return;
  const ok = confirm(`『${ev.title}』を削除しますか?`);
  if (!ok) return;
  setState((prev) => ({
    events: prev.events.map((e2) => (e2.id === id ? { ...e2, deleted: true, updatedAt: Date.now() } : e2)),
  }));
  // 予定の個別詳細シートから削除した場合は、削除済みイベントを表示し続けないようシートを閉じる
  if (uiState.sheet === 'event') {
    setUiState({ sheet: null, selectedEventId: null });
  }
}

// setState経由の不変更新(同期にも反映される)。対象が見つからなければ何もしない
function handlePurchasedToggle(id, checked) {
  const ev = state.events.find((x) => x.id === id);
  if (!ev) return;
  setState((prev) => ({
    events: prev.events.map((e2) => (e2.id === id ? { ...e2, purchased: checked, updatedAt: Date.now() } : e2)),
  }));

function handleSetShift(code) {
  const dateStr = uiState.selectedDate;
  if (!dateStr) return;
  const now = Date.now();
  setState((prev) => {
    const nextShifts = { ...prev.shifts };
    if (code === 'none') {
      if (nextShifts[dateStr]) {
        nextShifts[dateStr] = { ...nextShifts[dateStr], deleted: true, updatedAt: now };
      }
    } else {
      nextShifts[dateStr] = { code, updatedAt: now, deleted: false };
    }
    return { shifts: nextShifts };
  });
}

// handleToggleBlockedDay: FB通話の申請不可日を入り切りする(v39)。
// シフトと同じく「削除は物理削除せず deleted:true の印を残す」方式なので、
// 2台で使っていても「片方で外したのに復活する」ことが起きない
function handleToggleBlockedDay(dateStr) {
  const target = dateStr || uiState.selectedDate;
  if (!target) return;
  const now = Date.now();
  const nextBlocked = !isBlockedDay(state, target);
  setState((prev) => ({
    blockedDays: { ...(prev.blockedDays || {}), [target]: { updatedAt: now, deleted: !nextBlocked } },
  }));
  showToast(nextBlocked ? '申請不可日にしました' : '申請不可日を解除しました');
}

// drawRoundedRect: canvasに角丸矩形のパスを作る補助関数(fill/strokeは呼び出し側で行う)
function drawRoundedRect(ctx, x, y, w, h, radius) {
  const r = Math.min(radius, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// SHARE_KEEP_SYMBOLS: 絵文字の範囲に入っているが、日本語のタイトルで普通に使われるので
// 画像から消してはいけない記号(v34)。「★限定★」が「限定」に、「8/1→8/10」が「8/1 8/10」に
// 化けるのを防ぐためのホワイトリスト。ここに無い絵文字はstripEmojiで除去される
const SHARE_KEEP_SYMBOLS = ['★', '☆', '♪', '♫', '♬', '♡', '♥', '♢', '♦', '←', '→', '↑', '↓', '✓', '✔', '☑'];

// stripEmoji: 文字列中の絵文字・絵文字修飾子をすべて除去する汎用関数。
// Canvasでの絵文字描画は環境(OS/ブラウザのフォント)によって豆腐(□)になり得るため、
// 「今日の予定」共有画像に描く全テキストに適用し、絵文字を一切使わない方針にする
// (バナー表示など画像以外の用途では絵文字付きのテキストをそのまま使い続ける)。
// 除去対象のUnicode範囲: 絵文字全般・記号装飾・矢印・時計記号・異体字セレクタ・ZWJ・囲み記号の合成用マーカー。
// v34で開始位置を U+1F300 から U+1F000 に広げ(🈳🈵などの囲み漢字の絵文字)、⏰⌚のU+2300台も追加した。
// 丸数字(①②③ = U+2460〜)や〜・・などの日本語で使う記号、漢字(U+4E00〜)はこれらの範囲に
// 含まれないため除去されない。範囲内でもタイトルによく使う ★☆♪♡←→✓ などは
// SHARE_KEEP_SYMBOLS に入れて残す(v34。ユーザーが付けた装飾を勝手に消さないため)。
// 除去後は連続する空白を1つにまとめ前後をtrimする。null/undefined安全(空文字を返す)
function stripEmoji(text) {
  const str = text === null || text === undefined ? '' : String(text);
  // 1文字ずつ(サロゲートペアを壊さないようArray.fromで)見て、ホワイトリストの記号だけ残す
  const emojiRe = /[\u{1F000}-\u{1FAFF}\u{2190}-\u{21FF}\u{2300}-\u{23FF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE00}-\u{FE0F}\u{200D}\u{20E3}]/u;
  const stripped = Array.from(str)
    .filter((ch) => SHARE_KEEP_SYMBOLS.indexOf(ch) !== -1 || !emojiRe.test(ch))
    .join('');
  return stripped.replace(/\s+/g, ' ').trim();
}

// truncateToWidth: ctx.measureTextで幅を測り、収まらない文字列を「…」付きで切り詰める補助関数
function truncateToWidth(ctx, text, maxWidth) {
  const str = text === null || text === undefined ? '' : String(text);
  if (ctx.measureText(str).width <= maxWidth) return str;
  let low = 0;
  let high = str.length;
  while (low < high) {
    const mid = Math.ceil((low + high) / 2);
    const candidate = `${str.slice(0, mid)}…`;
    if (ctx.measureText(candidate).width <= maxWidth) {
      low = mid;
    } else {
      high = mid - 1;
    }
  }
  return `${str.slice(0, low)}…`;
}

// renderShareCanvas: 「今日の予定」共有画像の高さ計算と実描画を1つの関数に統合したもの。
// measureOnly=true(通常はctx=nullと併用)のときはY座標を進めるだけでctxへの描画命令を一切実行せず、
// measureOnly=falseのときは同じY座標の積み上げロジックで実際に描画する。
// 「高さ計算パス」と「実描画パス」を別々に書くとズレが生じるため、この関数を2回呼ぶことで
// 両者が常に同じコードパスを通るようにし、ズレを構造的に防止する。
// 全テキストはctx.textBaseline='top'(呼び出し側で設定済み)を前提に、Y座標は要素の上端で統一する。
// 戻り値: { height, cardHeight, boxes }
//   height     = 署名まで含めた画像全体の必要高さ(px)
//   cardHeight = 白い角丸カードの必要高さ(px)
//   boxes      = 各要素の { label, y, height } のダンプ(レイアウト検証用。重なり確認に使う)
function renderShareCanvas(ctx, lines, layout, measureOnly) {
  const { title, dateLabel, noticeRows, items } = lines;
  // heading / emptyMessage は「今日の予定」画像と「販売期間まとめ」画像で文言を差し替えるための項目(v34)。
  // 未指定なら従来通り「今日の予定」用の文言になる(既存の呼び出し・テストとの互換のため)
  const heading = lines.heading || '今日の予定';
  const emptyMessage = lines.emptyMessage || '今日の予定はありません';
  const { width, margin, innerX, innerWidth, primary } = layout;

  const boxes = [];
  const draw = (fn) => { if (!measureOnly) fn(); };
  const recordBox = (label, boxY, boxHeight) => { boxes.push({ label, y: boxY, height: boxHeight }); };

  // --- レイアウト定数(textBaseline='top'前提。すべて要素の上端を基準にしたY座標で計算する) ---
  const CARD_PADDING_TOP = 32;
  const CARD_PADDING_BOTTOM = 32;
  const CARD_MIN_HEIGHT = 280;
  const TITLE_HEIGHT = 20;
  const GAP_TITLE_TO_HEADING = 8;
  const HEADING_HEIGHT = 34;
  const GAP_HEADING_TO_DATE = 6;
  const DATE_HEIGHT = 22;
  const GAP_DATE_TO_NEXT = 20;
  const NOTICE_LABEL_HEIGHT = 20;
  const GAP_LABEL_TO_PILLS = 14; // 「お知らせ」ラベルと最初の帯の間隔(最低12pxの要件に対し余裕を持たせる)
  const PILL_TEXT_HEIGHT = 18;
  const PILL_PADDING_Y = 10;
  const PILL_HEIGHT = PILL_TEXT_HEIGHT + PILL_PADDING_Y * 2; // テキスト行の高さ+上下パディング
  const GAP_BETWEEN_PILLS = 8;
  const GAP_NOTICES_TO_NEXT = 20;
  const ITEM_TITLE_HEIGHT = 22;
  const GAP_ITEM_TITLE_META = 4;
  const ITEM_META_HEIGHT = 16;
  const ITEM_BLOCK_HEIGHT = ITEM_TITLE_HEIGHT + GAP_ITEM_TITLE_META + ITEM_META_HEIGHT;
  const GAP_BETWEEN_ITEMS = 16;
  const EMPTY_MESSAGE_HEIGHT = 22;
  const CARD_TO_SIGNATURE_GAP = 24;
  const SIGNATURE_HEIGHT = 16;

  let y = margin + CARD_PADDING_TOP;
  const cardContentTop = y;

  // --- タイトル(推しの名前) ---
  draw(() => {
    ctx.fillStyle = '#999999';
    ctx.font = '400 15px sans-serif';
    ctx.fillText(truncateToWidth(ctx, title, innerWidth), innerX, y);
  });
  recordBox('title', y, TITLE_HEIGHT);
  y += TITLE_HEIGHT + GAP_TITLE_TO_HEADING;

  // --- 見出し(絵文字は使わない方針) ---
  draw(() => {
    ctx.fillStyle = '#333333';
    ctx.font = '700 26px sans-serif';
    ctx.fillText(truncateToWidth(ctx, heading, innerWidth), innerX, y);
  });
  recordBox('heading', y, HEADING_HEIGHT);
  y += HEADING_HEIGHT + GAP_HEADING_TO_DATE;

  // --- 日付 ---
  draw(() => {
    ctx.fillStyle = '#666666';
    ctx.font = '400 16px sans-serif';
    ctx.fillText(dateLabel, innerX, y);
  });
  recordBox('date', y, DATE_HEIGHT);
  y += DATE_HEIGHT + GAP_DATE_TO_NEXT;

  // --- お知らせ(リマインド)セクション: 日付の下・予定リストの上。
  // shift-tomorrow(自分のシフト)・自分の予定・非公開カテゴリ由来のリマインドはbuildShareLinesの
  // 時点で既に除外済みなのでここには出てこない ---
  if (noticeRows.length) {
    draw(() => {
      ctx.fillStyle = '#777777';
      ctx.font = '700 14px sans-serif';
      ctx.fillText('お知らせ', innerX, y);
    });
    recordBox('notice-label', y, NOTICE_LABEL_HEIGHT);
    y += NOTICE_LABEL_HEIGHT + GAP_LABEL_TO_PILLS;

    const noticeAccent = adjustLightness(primary, -15);
    const noticeBg = mixWithWhite(primary, 0.85);
    noticeRows.forEach((text, index) => {
      const pillY = y;
      draw(() => {
        drawRoundedRect(ctx, innerX, pillY, innerWidth, PILL_HEIGHT, 8);
        ctx.fillStyle = noticeBg;
        ctx.fill();
        ctx.fillStyle = noticeAccent;
        drawRoundedRect(ctx, innerX + 8, pillY + (PILL_HEIGHT - PILL_TEXT_HEIGHT) / 2, 4, PILL_TEXT_HEIGHT, 2);
        ctx.fill();
        ctx.fillStyle = '#444444';
        ctx.font = '600 14px sans-serif';
        ctx.fillText(truncateToWidth(ctx, text, innerWidth - 40), innerX + 22, pillY + PILL_PADDING_Y);
      });
      recordBox(`notice-pill-${index}`, pillY, PILL_HEIGHT);
      y += PILL_HEIGHT + GAP_BETWEEN_PILLS;
    });
    y += GAP_NOTICES_TO_NEXT - GAP_BETWEEN_PILLS;
  }

  // --- 予定リスト(公開用メモ・自分用メモ・自分の予定・非公開カテゴリは描画しない) ---
  if (!items.length) {
    const messageY = y;
    draw(() => {
      ctx.fillStyle = '#999999';
      ctx.font = '400 16px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(emptyMessage, width / 2, messageY);
      ctx.textAlign = 'left';
    });
    recordBox('empty-message', messageY, EMPTY_MESSAGE_HEIGHT);
    y += EMPTY_MESSAGE_HEIGHT;
  } else {
    items.forEach((item, index) => {
      const itemY = y;
      draw(() => {
        ctx.fillStyle = item.color;
        drawRoundedRect(ctx, innerX, itemY, 5, ITEM_BLOCK_HEIGHT, 4);
        ctx.fill();
        ctx.fillStyle = '#333333';
        ctx.font = '700 17px sans-serif';
        ctx.fillText(truncateToWidth(ctx, item.title, innerWidth - 20), innerX + 16, itemY);
        ctx.fillStyle = '#888888';
        ctx.font = '400 13px sans-serif';
        ctx.fillText(
          truncateToWidth(ctx, item.meta, innerWidth - 20),
          innerX + 16,
          itemY + ITEM_TITLE_HEIGHT + GAP_ITEM_TITLE_META
        );
      });
      recordBox(`item-${index}`, itemY, ITEM_BLOCK_HEIGHT);
      y += ITEM_BLOCK_HEIGHT + GAP_BETWEEN_ITEMS;
    });
    y -= GAP_BETWEEN_ITEMS;
  }

  const cardContentBottom = y;
  const cardContentHeight = cardContentBottom - cardContentTop;
  const cardHeight = Math.max(CARD_PADDING_TOP + cardContentHeight + CARD_PADDING_BOTTOM, CARD_MIN_HEIGHT);
  const cardBottom = margin + cardHeight;

  // --- 署名(URLは入れない・カードの外側の下に配置) ---
  const signatureY = cardBottom + CARD_TO_SIGNATURE_GAP;
  draw(() => {
    ctx.fillStyle = '#bbbbbb';
    ctx.font = '400 12px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('ルアジュール', width / 2, signatureY);
    ctx.textAlign = 'left';
  });
  recordBox('signature', signatureY, SIGNATURE_HEIGHT);

  const height = signatureY + SIGNATURE_HEIGHT + margin;

  return { height, cardHeight, boxes };
}

// sanitizeShareLines: renderShareCanvasに渡す直前に、描画する全テキストから絵文字を除去する。
// Canvasの絵文字描画は環境によって豆腐(□)になり得るため、画像に載る文字列は必ずここを通す。
// 除去後に空文字になった行は描画も高さ計算も対象外にする
function sanitizeShareLines(rawLines) {
  return {
    title: stripEmoji(rawLines.title),
    dateLabel: stripEmoji(rawLines.dateLabel),
    heading: stripEmoji(rawLines.heading || '今日の予定'),
    emptyMessage: stripEmoji(rawLines.emptyMessage || '今日の予定はありません'),
    noticeRows: (rawLines.reminders || [])
      .map((text) => stripEmoji(text))
      .filter((text) => text.length > 0),
    // タイトルが絵文字だけだった予定は、タイトル空の行になってしまうので画像から落とす
    items: (rawLines.items || [])
      .map((item) => ({ ...item, title: stripEmoji(item.title), meta: stripEmoji(item.meta) }))
      .filter((item) => item.title.length > 0),
  };
}

// renderShareImageBlob: 行データからPNGのBlobを作る。Canvas APIのみで自前描画
// (外部ライブラリ禁止・HTML要素のキャプチャもしない)。描画中に全画面render()は呼ばない。
// 高さ計算(1パス目)と実描画(2パス目)は共通のrenderShareCanvas()を通すため、
// 両者のY座標がズレることは構造的に起こらない
async function renderShareImageBlob(lines) {
  const width = 900;
  const margin = 40;
  const innerX = margin + 28;
  const innerWidth = width - margin * 2 - 56;
  const primary = (state.settings && state.settings.themePrimary) || '#f8b6c8';
  const secondary = (state.settings && state.settings.themeSecondary) || '#a5d8e6';
  const layout = { width, margin, innerX, innerWidth, primary, secondary };

  // --- 1パス目: ctxなしで内容量から高さを計算する(描画命令は一切実行されない) ---
  const measured = renderShareCanvas(null, lines, layout, true);
  const height = measured.height;

  // --- 2パス目: 1パス目で決まった高さで実サイズのcanvasを作り、同じ関数で実描画する ---
  const canvas = document.createElement('canvas');
  canvas.width = width * 2;
  canvas.height = height * 2;
  const ctx = canvas.getContext('2d');
  ctx.scale(2, 2);
  // 全描画をY=上端基準に統一する(既定のalphabeticのままだとラベルの下端と帯の開始位置がズレる)
  ctx.textBaseline = 'top';

  // --- 背景グラデーション(テーマ色を薄めた既存の流儀と同じ) ---
  const gradient = ctx.createLinearGradient(0, 0, 0, height);
  gradient.addColorStop(0, mixWithWhite(primary, 0.3));
  gradient.addColorStop(1, mixWithWhite(secondary, 0.3));
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, width, height);

  // --- 白い角丸カード(高さはコンテンツ量に応じてrenderShareCanvasが決めたcardHeightを使う) ---
  drawRoundedRect(ctx, margin, margin, width - margin * 2, measured.cardHeight, 24);
  ctx.fillStyle = '#ffffff';
  ctx.fill();

  renderShareCanvas(ctx, lines, layout, false);

  const blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/png'));
  if (!blob) throw new Error('canvas.toBlobが空を返しました');
  return blob;
}

// canUseShareSheet: 端末の共有シート経由でXに渡すべきかどうか(v34)。
// navigator.share の有無だけで判定すると、Windows版のChrome/Edgeも「共有できる」と答えてしまい、
// PCでWindowsの共有パネルが開いてXに辿り着けない。そのため
// 「スマホ・タブレットらしい端末」であることを併せて確認する
function canUseShareSheet() {
  if (typeof navigator === 'undefined') return false;
  if (typeof navigator.share !== 'function' || typeof navigator.canShare !== 'function') return false;
  const ua = String(navigator.userAgent || '');
  const isMobileUa = /Android|iPhone|iPad|iPod/i.test(ua);
  // iPadOSはUAがMacintoshになるため、タッチ対応の有無で拾う
  const isTouchMac = /Macintosh/.test(ua) && Number(navigator.maxTouchPoints || 0) > 1;
  return isMobileUa || isTouchMac;
}

// copyImageToClipboard: PNGをクリップボードにコピーする(PCでX投稿欄に貼り付けるため)。
// 対応していない・許可されない環境では false を返すだけでエラーにはしない(保存で代替する)
async function copyImageToClipboard(blob) {
  try {
    if (!navigator.clipboard || typeof navigator.clipboard.write !== 'function') return false;
    if (typeof ClipboardItem === 'undefined') return false;
    await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
    return true;
  } catch (e) {
    console.error('画像のクリップボードへのコピーに失敗しました(保存で代替します)', e);
    return false;
  }
}

function downloadBlob(blob, fileName) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  // クリック直後に開放するとブラウザによってはダウンロードが中断されるため、少し待ってから開放する
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}

// buildXIntentUrl: Xの投稿画面のURLを作る純関数。本文だけを載せる
// (Xの仕様上、URLで画像を添付することはできないため、画像はコピー/保存して貼り付けてもらう)
function buildXIntentUrl(text) {
  return `https://x.com/intent/post?text=${encodeURIComponent(text || '')}`;
}

// shareImageToX: 画像を作ってXへの共有まで面倒を見る共通処理(v34)。
//  - スマホ(共有シートあり): 画像+本文をそのまま共有シートに渡す。ユーザーはXを選ぶだけ
//  - PC: 画像をクリップボードにコピーしつつ保存し、Xの投稿画面を新しいタブで開く。
//    投稿欄に貼り付ける(Ctrl+V)だけで画像付きの下書きになる
// ポップアップブロック対策として、投稿画面用のタブは画像を作る前(=クリック直後)に確保する。
// すべてtry/catchで囲み、失敗時は日本語トースト+console.errorにする
async function shareImagesToX(shareItems, postText) {
  const items = Array.isArray(shareItems) ? shareItems : [];
  if (!items.length) { showToast('画像にするものがありません'); return; }

  const useSheet = canUseShareSheet();
  let intentWindow = null;
  if (!useSheet) {
    try {
      intentWindow = window.open('about:blank', '_blank');
      if (intentWindow) intentWindow.opener = null;
    } catch (openErr) {
      console.error('投稿画面のタブを開けませんでした', openErr);
      intentWindow = null;
    }
  }

  let files = [];
  try {
    for (const item of items) {
      const blob = await renderShareImageBlob(sanitizeShareLines(item.lines));
      files.push({ blob, file: new File([blob], item.fileName, { type: 'image/png' }) });
    }
  } catch (e) {
    if (intentWindow && !intentWindow.closed) intentWindow.close();
    console.error('画像の作成に失敗しました', e);
    showToast('画像の作成に失敗しました');
    return;
  }

  // Xの1投稿に添付できるのは4枚まで。超える分は保存だけして枚数を伝える
  const shareFiles = files.slice(0, X_MAX_IMAGES).map((f) => f.file);
  const overflow = files.length - shareFiles.length;

  // --- スマホ: 共有シートに画像+本文をそのまま渡す ---
  if (useSheet) {
    try {
      if (navigator.canShare({ files: shareFiles })) {
        await navigator.share({ files: shareFiles, text: postText });
        if (overflow > 0) showToast(`Xに添付できるのは4枚までです。残り${overflow}枚は共有していません`);
        return;
      }
    } catch (shareErr) {
      // ユーザーが共有シートをキャンセルした場合はエラー扱いにせず静かに終了する
      if (shareErr && shareErr.name === 'AbortError') return;
      // それ以外の失敗(共有非対応・時間切れなど)は、画像を失わないよう下の保存経路へ進む
      console.error('共有シートでの共有に失敗しました。保存に切り替えます', shareErr);
    }
  }

  // --- PC(および共有シートが使えなかった場合): 画像を保存してX投稿画面を開く ---
  // 画像が1枚のときだけクリップボードにもコピーする(クリップボードには1枚しか入らないため)
  try {
    // クリップボードへの書き込みは「このページに焦点がある」ことが条件。
    // 先に確保した投稿用タブへ焦点が移っていることがあるので、書き込む前に取り戻しておく
    // (取り戻せなくてもcopyImageToClipboardがfalseを返すだけで、保存には影響しない)
    try { window.focus(); } catch (focusErr) { console.error('画面の焦点を戻せませんでした', focusErr); }
    const copied = files.length === 1 ? await copyImageToClipboard(files[0].blob) : false;
    files.forEach((f, index) => {
      // 連続してダウンロードするとブラウザが後続を無視することがあるので少しずつずらす
      setTimeout(() => downloadBlob(f.blob, items[index].fileName), index * 300);
    });
    const intentUrl = buildXIntentUrl(postText);
    let opened = false;
    if (intentWindow && !intentWindow.closed) {
      intentWindow.location.href = intentUrl;
      opened = true;
    } else {
      opened = !!window.open(intentUrl, '_blank', 'noopener');
    }
    if (!opened) showToast(`画像を${files.length}枚保存しました。投稿画面が開けないときはポップアップを許可してください`);
    else if (copied) showToast('画像をコピーしました。Xの投稿欄に貼り付けてください');
    else if (files.length === 1) showToast('画像を保存しました。Xの投稿欄に添付してください');
    else showToast(`画像を${files.length}枚保存しました。Xの投稿欄に添付してください${overflow > 0 ? '(添付は4枚まで)' : ''}`);
  } catch (e) {
    if (intentWindow && !intentWindow.closed) intentWindow.close();
    console.error('画像の共有に失敗しました', e);
    showToast('画像は作れましたが共有に失敗しました');
  }
}

// shareImageToX: 1枚だけ共有する場合の入口(「今日の予定」から使う)
function shareImageToX(rawLines, fileName, postText) {
  return shareImagesToX([{ lines: rawLines, fileName }], postText);
}

// handleShareTodayImage: 「今日の予定」をPNG画像にしてXへ共有する。
// 画像には「公開して差し支えない情報」のみを描く:
//  - 自分のシフト(勤務予定)は一切描画しない(buildShareLinesの戻り値にshiftLine自体が無い)
//  - 自分の予定(kind==='personal')・非公開カテゴリ(限定配信members・FB通話call)はbuildShareLines側で
//    itemsから除外済み。公開用メモ(publicMemo)・自分用メモ(memo)はうっかり公開防止のため一切含めない
function handleShareTodayImage() {
  const today = todayStr();
  const agenda = todayAgenda(state, today);
  const rawLines = buildShareLines(agenda, state.settings, computeReminders(state, today), state.events);
  const postText = `今日の予定 ${formatDateLabel(today)}`;
  return shareImageToX(rawLines, `今日の予定_${today}.png`, postText);
}

// buildOnSaleSharePlan: チェックされたカテゴリから「作る画像の一覧」を組み立てる純関数(v37)。
// カテゴリ1つにつき画像1枚。中身が0件になるものは作らない。
// 並び順は listOnSaleShareCategories の順(すべて → カテゴリ定義順)に揃える。
// 戻り値: { items: [{ category, heading, fileName, lines }], postText }
function buildOnSaleSharePlan(targetState, today, selection) {
  const selected = Array.isArray(selection) ? selection : [];
  const items = listOnSaleShareCategories(targetState, today)
    .filter((opt) => selected.indexOf(opt.key) !== -1)
    .map((opt) => {
      const lines = buildOnSaleShareLines(targetState, today, opt.key);
      return { category: opt.key, heading: lines.heading, fileName: `${lines.heading}_${today}.png`, lines };
    })
    .filter((item) => item.lines.items.length > 0);
  const dateLabel = today ? formatDateLabel(today) : '';
  const postText = items.length === 1
    ? `${items[0].heading}(${dateLabel}時点)`
    : `販売期間・イベント期間まとめ(${dateLabel}時点)`;
  return { items, postText };
}

// handleShareOnSaleImages: 「📌 販売期間中 一覧」をチェックした分だけ画像にしてXへ共有する
// (v34。v37でチェック式・複数枚対応に変更)
function handleShareOnSaleImages(selection) {
  const today = todayStr();
  const plan = buildOnSaleSharePlan(state, today, selection);
  if (!plan.items.length) { showToast('画像にするものを選んでください'); return; }
  setUiState({ sheet: null });
  return shareImagesToX(
    plan.items.map((item) => ({ lines: item.lines, fileName: item.fileName })),
    plan.postText
  );
}

function handleExportData() {
  try {
    const json = JSON.stringify(state, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `oshical-backup-${todayStr()}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch (e) {
    console.error('書き出しに失敗しました', e);
    showToast('書き出しに失敗しました');
  }
}

function handleImportFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(String(reader.result));
      const migrated = migrateData(parsed);
      const merged = mergeData(state, migrated);
      state = merged;
      saveState(state);
      fullRender();
      scheduleSync();
      showToast('データを読み込みました');
    } catch (e) {
      console.error('読み込みに失敗しました', e);
      showToast('ファイルの読み込みに失敗しました。形式を確認してください');
    }
  };
  reader.onerror = () => {
    console.error('ファイル読み込みエラー', reader.error);
    showToast('ファイルの読み込みに失敗しました');
  };
  reader.readAsText(file);
}

async function handleStartSync() {
  const tokenEl = document.getElementById('sync-token');
  const passEl = document.getElementById('sync-passphrase');
  const token = tokenEl ? tokenEl.value.trim() : '';
  const passphrase = passEl ? passEl.value : '';
  if (!token || !passphrase) {
    setUiState({ syncMessage: 'トークンと合言葉を入力してください' });
    return;
  }
  setUiState({ syncMessage: '同期を開始しています…' });
  const result = await startSync(token, passphrase);
  setUiState({ syncMessage: result.ok ? '' : result.message });
}

function handleStopSync() {
  stopSync();
  render();
}

function handleManualSync() {
  const sync = loadSyncSettings();
  if (!sync || !sync.token || !sync.gistId) {
    showToast('同期が設定されていません。設定から同期を開始してください');
    return;
  }
  pullSync().catch((e) => console.error('手動同期に失敗しました', e));
}

/* --- イベント委譲(クリック/入力/変更/送信) --- */
function handleAction(el) {
  const action = el.dataset.action;
  switch (action) {
    case 'open-settings':
      setUiState({ sheet: 'settings', syncMessage: '' });
      break;
    case 'close-sheet':
      requestCloseSheet();
      break;
    case 'cancel-form':
      // キャンセルボタンは入力中でも常に閉じられる唯一の出口
      setUiState({ sheet: null, editingEvent: null, formOriginal: null, formErrors: {}, selectedEventId: null });
      break;
    case 'prev-month': {
      const { y, m } = parseDateStr(addMonths(fmtDate(uiState.year, uiState.month, 1), -1));
      setUiState({ year: y, month: m });
      break;
    }
    case 'next-month': {
      const { y, m } = parseDateStr(addMonths(fmtDate(uiState.year, uiState.month, 1), 1));
      setUiState({ year: y, month: m });
      break;
    }
    case 'go-today': {
      const { y, m } = parseDateStr(todayStr());
      setUiState({ year: y, month: m });
      break;
    }
    case 'manual-sync':
      handleManualSync();
      break;
    case 'open-day':
      setUiState({ sheet: 'day', selectedDate: el.dataset.date, dayLongTermOpen: false });
      break;
    case 'open-event': {
      const ev = state.events.find((x) => x.id === el.dataset.id);
      if (ev) setUiState({ sheet: 'event', selectedEventId: ev.id, selectedDate: ev.startDate });
      break;
    }
    case 'toggle-day-longterm':
      setUiState({ dayLongTermOpen: !uiState.dayLongTermOpen });
      break;
    case 'add-event': {
      const dateStr = el.dataset.date || uiState.selectedDate || todayStr();
      const draft = createDraftEvent(dateStr);
      setUiState({ sheet: 'form', editingEvent: draft, formOriginal: { ...draft }, formErrors: {} });
      break;
    }
    case 'edit-event': {
      const ev = state.events.find((x) => x.id === el.dataset.id);
      if (ev) setUiState({ sheet: 'form', editingEvent: { ...ev }, formOriginal: { ...ev }, formErrors: {} });
      break;
    }
    case 'delete-event':
      handleDeleteEvent(el.dataset.id);
      break;
    case 'set-shift':
      handleSetShift(el.dataset.code);
      break;
    case 'toggle-blocked':
      handleToggleBlockedDay(el.dataset.date);
      break;
    case 'set-kind': {
      const kind = el.dataset.value;
      // kind は必ず 'oshi' か 'personal' の完全一致で探す(kind:'both' の記念日は既定選択にしない)
      const firstCategory = Object.keys(CATEGORIES).find((k) => CATEGORIES[k].kind === kind);
      const draft = fixDraftPublic(fixDraftLongTerm(fixDraftEndDate({ ...uiState.editingEvent, kind, category: firstCategory })));
      setUiState({ editingEvent: draft });
      break;
    }
    case 'set-category': {
      const draft = fixDraftPublic(fixDraftLongTerm(fixDraftEndDate({ ...uiState.editingEvent, category: el.dataset.value })));
      setUiState({ editingEvent: draft });
      break;
    }
    case 'reset-colors':
      handleResetColors();
      break;
    case 'export-data':
      handleExportData();
      break;
    case 'import-data': {
      const input = document.getElementById('import-file-input');
      if (input) input.click();
      break;
    }
    case 'start-sync':
      handleStartSync();
      break;
    case 'stop-sync':
      handleStopSync();
      break;
    case 'copy-public-link':
      handleCopyPublicLink(el.dataset.url);
      break;
    case 'share-today-image':
      handleShareTodayImage();
      break;
    case 'share-onsale-image': {
      // 一覧の共有ボタン。選択肢が2つ以上あればチェック式の選択シートを出す。
      // 1種類しかなければ選ばせる意味がないのでそのまま画像を作る
      const options = listOnSaleShareCategories(state, todayStr());
      if (options.length > 1) setUiState({ sheet: 'share-onsale', shareOnSaleSelection: defaultShareOnSaleSelection(options) });
      else if (options.length === 1) handleShareOnSaleImages([options[0].key]);
      else showToast('画像にできる販売期間の予定がありません');
      break;
    }
    case 'share-onsale-run':
      handleShareOnSaleImages(uiState.shareOnSaleSelection);
      break;
    default:
      break;
  }
}

function onAppClick(e) {
  const backdrop = e.target.closest('.sheet-backdrop');
  if (backdrop && e.target === backdrop) {
    requestCloseSheet();
    return;
  }
  // 購入済みチェックボックス(とそのラベル)のクリックは、アイテム全体のタップ(open-event)に
  // 吸われないようにここでガードする
  if (e.target.closest('[data-purchase-toggle]')) return;
  const actionEl = e.target.closest('[data-action]');
  if (!actionEl) return;
  handleAction(actionEl);
}

function onAppInput(e) {
  const field = e.target.dataset.field;
  if (!field || !uiState.editingEvent) return;
  const draft = fixDraftLongTerm(fixDraftEndDate({ ...uiState.editingEvent, [field]: e.target.value }));
  setUiStateSilent({ editingEvent: draft });
  // 日付が変わったら「長期予定」チェック欄の表示だけを直接更新する(全画面再描画はしない)
  if (field === 'startDate' || field === 'endDate') {
    const lt = document.getElementById('longterm-field');
    if (lt) {
      const visible = !!(draft.startDate && draft.endDate && draft.startDate !== draft.endDate);
      lt.style.display = visible ? '' : 'none';
      const cb = lt.querySelector('input[data-draft-toggle="longTerm"]');
      if (cb) cb.checked = draft.longTerm === true;
    }
  }
}

function onAppChange(e) {
  if (e.target.id === 'import-file-input') {
    const file = e.target.files && e.target.files[0];
    if (file) handleImportFile(file);
    return;
  }
  if (e.target.dataset.purchaseToggle) {
    handlePurchasedToggle(e.target.dataset.purchaseToggle, e.target.checked);
    return;
  }
  if (e.target.dataset.shareCategory) {
    // 共有シート内のチェック操作。再描画するとシートが作り直されてフォーカスが飛ぶため、
    // uiStateだけを静かに更新する(チェックの見た目はブラウザ側が保持する)
    setUiStateSilent({
      shareOnSaleSelection: toggleShareCategory(uiState.shareOnSaleSelection, e.target.dataset.shareCategory, e.target.checked),
    });
    return;
  }
  if (e.target.dataset.colorCat) {
    handleCategoryColorChange(e.target.dataset.colorCat, e.target.value);
    return;
  }
  if (e.target.dataset.colorShift) {
    handleShiftColorChange(e.target.dataset.colorShift, e.target.value);
    return;
  }
  if (e.target.dataset.colorMemo) {
    updateSettingsQuiet({ memoColor: e.target.value });
    return;
  }
  if (e.target.dataset.colorToday) {
    updateSettingsQuiet({ todayColor: e.target.value });
    return;
  }
  if (e.target.dataset.draftToggle === 'public' && uiState.editingEvent) {
    const draft = fixDraftPublic({ ...uiState.editingEvent, public: e.target.checked });
    setUiState({ editingEvent: draft });
    return;
  }
  if (e.target.dataset.draftToggle === 'longTerm' && uiState.editingEvent) {
    const draft = fixDraftLongTerm({ ...uiState.editingEvent, longTerm: e.target.checked });
    setUiState({ editingEvent: draft });
    return;
  }
  const key = e.target.dataset.setting;
  if (key) handleSettingChange(key, e.target);
}

function onAppSubmit(e) {
  e.preventDefault();
  if (e.target.dataset.form === 'event') handleSaveEvent();
}

function onAppKeydown(e) {
  if (e.key === 'Escape' && uiState.sheet) {
    requestCloseSheet();
  }
}

/* =========================================================
 * 9. init
 * ========================================================= */
function attachEventListeners() {
  const appEl = document.getElementById('app');
  appEl.addEventListener('click', onAppClick);
  appEl.addEventListener('input', onAppInput);
  appEl.addEventListener('change', onAppChange);
  appEl.addEventListener('submit', onAppSubmit);
  document.addEventListener('keydown', onAppKeydown);
}

function setupSyncListeners() {
  window.addEventListener('online', () => {
    pullSync().catch((e) => console.error('オンライン復帰時の同期に失敗しました', e));
  });
  window.addEventListener('offline', () => {
    const sync = loadSyncSettings();
    if (sync && sync.gistId) setSyncIndicator('offline');
  });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      pullSync().catch((e) => console.error('画面復帰時の同期に失敗しました', e));
    }
  });
}

function registerServiceWorker() {
  if (!('serviceWorker' in navigator)) {
    console.info('このブラウザはService Workerに対応していません');
    return;
  }
  if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
    console.info('Service Workerはhttps環境でのみ登録します(file://ではスキップ)');
    return;
  }
  navigator.serviceWorker.register('./sw.js').catch((e) => {
    console.error('Service Workerの登録に失敗しました', e);
  });
}

// --- アプリロック(§玄関の目隠し) ---
async function sha256Hex(text) {
  const normalized = String(text).normalize('NFC');
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(normalized));
  return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, '0')).join('');
}

function isUnlocked() {
  if (!LOCK_HASH) return true;
  try {
    return localStorage.getItem(STORAGE_KEYS.UNLOCK) === LOCK_HASH;
  } catch (e) {
    return false;
  }
}

function renderLockScreen(errorMsg) {
  const root = document.getElementById('app');
  root.innerHTML = `
    <div class="lock-screen">
      <div class="lock-card">
        <div class="lock-icon">🌸🔒</div>
        <h1>合言葉を入力してください</h1>
        <form id="lock-form">
          <div class="lock-input-row">
            <input type="password" id="lock-input" autocomplete="off" aria-label="合言葉">
            <button type="button" class="icon-btn" id="lock-show" aria-label="表示切替">👁</button>
          </div>
          ${errorMsg ? `<p class="field-error">${escapeHtml(errorMsg)}</p>` : ''}
          <button type="submit" class="btn-primary lock-submit">ひらく</button>
        </form>
      </div>
    </div>
  `;
  const input = document.getElementById('lock-input');
  document.getElementById('lock-show').addEventListener('click', () => {
    input.type = input.type === 'password' ? 'text' : 'password';
    input.focus();
  });
  document.getElementById('lock-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    try {
      const hash = await sha256Hex((input.value || '').trim());
      if (hash === LOCK_HASH) {
        try { localStorage.setItem(STORAGE_KEYS.UNLOCK, LOCK_HASH); } catch (e2) { console.error(e2); }
        startApp();
      } else {
        renderLockScreen('合言葉が違います');
      }
    } catch (e3) {
      console.error('ロック解除処理でエラー', e3);
      renderLockScreen('エラーが発生しました。再読み込みしてお試しください');
    }
  });
  input.focus();
}

function init() {
  if (isUnlocked()) {
    startApp();
  } else {
    renderLockScreen('');
  }
}

function startApp() {
  state = loadState();
  const t = parseDateStr(todayStr());
  uiState = {
    year: t.y,
    month: t.m,
    selectedDate: null,
    selectedEventId: null,
    sheet: null,
    editingEvent: null,
    formOriginal: null,
    formErrors: {},
    syncMessage: '',
    toast: null,
    dayLongTermOpen: false,
  };
  attachEventListeners();
  fullRender();
  registerServiceWorker();
  setupSyncListeners();
  setInterval(() => {
    // シート表示中(入力中の可能性あり)は再描画でフォーカスを奪わない。通知処理のみ行う
    if (uiState.sheet) {
      processReminders(todayStr());
    } else {
      fullRender();
    }
  }, NOTIFY_TICK_MS);
  pullSync().catch((e) => console.error('初回同期(pull)に失敗しました', e));
}

document.addEventListener('DOMContentLoaded', init);
