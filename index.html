<style>
:root{
  --primary:#f8b6c8;
  --secondary:#a5d8e6;
  --primary-dark:#e893ac;
  --primary-light:#fcdce6;
  --secondary-dark:#7cc3d8;
  --secondary-light:#cdeaf3;
  --cat-event:#e893ac;
  --cat-goods:#f8b6c8;
  --cat-ticket:#9ccc65;
  --cat-stream:#a5d8e6;
  --cat-members:#7cc3d8;
  --cat-call:#c9a8e0;
  --cat-other:#b8b8b8;
  --cat-anniversary:#e8b04f;
  --cat-personal:#a8d5ba;
  --shift-1:#e893ac;
  --shift-2:#7cc3d8;
  --shift-3:#c9a8e0;
  --shift-off:#8fbf9f;
  --shift-paid:#bcd9c5; /* 有給。休みの緑を白と混ぜて淡くした色(v35) */
  --shift-hw:#f0a860;   /* 旧「休出」。細分化前のデータ用に残している */
  --shift-hw1:#f0a860;
  --shift-hw2:#f0a860;
  --shift-hw3:#f0a860;
  --memo-color:#d9578a;
  --today-border:#e08aa0;
  --bg:#fef6f8;
  --bg-top:#fcdee6;
  --bg-bottom:#d6edf4;
  --text:#3a2e2e;
  --text-muted:#8a7a7a;
  --border:#f0e0e2;
  --radius-lg:16px;
  --radius-md:12px;
  --radius-sm:8px;
  --shadow-sm:0 2px 8px rgba(0,0,0,0.06);
  --shadow-md:0 4px 16px rgba(0,0,0,0.10);
  --font: system-ui, -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font);
  color:var(--text);
  min-height:100vh;
  background:linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%) fixed;
  min-height:100vh;
  -webkit-tap-highlight-color:transparent;
}
button, input, textarea, select{ font-family:inherit; font-size:1rem; }
button{ cursor:pointer; }
h1,h2,h3{ margin:0; }
#app{ max-width:920px; margin:0 auto; padding-bottom:48px; }

/* header */
.app-header{ padding:16px 16px 4px; }
.header-top{ display:flex; align-items:center; justify-content:space-between; }
.header-top h1{ font-size:1.25rem; font-weight:700; }
.icon-btn{
  min-width:44px; min-height:44px; border:none; background:#fff; border-radius:var(--radius-md);
  box-shadow:var(--shadow-sm); font-size:1.1rem; display:flex; align-items:center; justify-content:center;
}
/* 操作行(月移動・今日・同期)はスクロールしても画面上部に貼り付く(v37)。
   #app直下に置いてあるのでページ全体でstickyが効く。
   bodyの背景グラデーションはfixed指定=画面基準なので、画面上端の色である
   --bg-top を敷けば背景と自然につながる。シート(z-index:50)・トースト(z-index:100)より下にする */
.nav-bar{
  position:sticky; top:0; z-index:5; background:var(--bg-top);
  padding:8px 16px 10px; box-shadow:0 2px 6px rgba(120,90,90,0.10);
}
.header-nav{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.nav-btn{
  min-width:44px; min-height:44px; border:none; background:#fff; border-radius:var(--radius-md);
  box-shadow:var(--shadow-sm); font-size:1rem;
}
.month-label{ font-size:1.1rem; font-weight:700; min-width:110px; text-align:center; }
.today-btn{
  min-height:44px; padding:0 14px; border:none; border-radius:var(--radius-md);
  background:var(--secondary-light); color:var(--text); box-shadow:var(--shadow-sm);
}
.sync-indicator{
  margin-left:auto; min-height:44px; padding:0 12px; border:none; border-radius:var(--radius-md);
  background:#fff; box-shadow:var(--shadow-sm); font-size:0.9rem; white-space:nowrap;
}

/* today reminder(今日の予定カード内・最終日系のお知らせのみ。v32) */
.today-reminder-list{ display:flex; flex-direction:column; gap:6px; margin-bottom:6px; }
.today-reminder{
  display:flex; align-items:center; gap:8px; width:100%; box-sizing:border-box;
  background:var(--primary-light); border-left:4px solid var(--primary-dark); padding:8px 10px;
  border-radius:var(--radius-sm); font-size:0.88rem; overflow-wrap:anywhere;
}
.today-reminder-text{ flex:1; min-width:0; }
/* タップで予定の詳細を開けるお知らせ(v40)。見た目は従来のお知らせのまま、
   ボタン既定の枠線・書体・中央寄せだけ打ち消し、右端の「›」でタップできることを示す */
button.today-reminder{
  min-height:44px; border-top:none; border-right:none; border-bottom:none;
  text-align:left; font:inherit; font-size:0.88rem; color:inherit; cursor:pointer;
}
button.today-reminder:active{ filter:brightness(0.96); }
.today-reminder-chevron{ flex:none; color:var(--text-muted); font-size:1.1rem; line-height:1; }

/* calendar */
.calendar{ margin:16px; background:#fff; border-radius:var(--radius-lg); box-shadow:var(--shadow-md); padding:12px; }
.weekday-row{ display:grid; grid-template-columns:repeat(7,1fr); text-align:center; color:var(--text-muted); font-size:0.82rem; margin-bottom:4px; }
.weekday.sun{ color:#e08a9a; }
.weekday.sat{ color:#6fa8c9; }
.month-grid{ display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:4px; }
.day-cell{
  min-height:64px; border:1px solid var(--border); border-radius:var(--radius-sm);
  background:#fff; padding:4px; display:flex; flex-direction:column; align-items:stretch;
  text-align:left; position:relative; min-width:0; overflow:hidden;
}
/* 過ぎた日(v39)。薄くしたうえで彩度も落とし、これから先の日と見分けやすくする。
   .outside(前後月の日)の指定を後ろに置いて、そちらの透明度を優先させている */
.day-cell.past{ opacity:0.55; filter:saturate(0.3); }
.day-cell.outside{ opacity:0.4; }
.day-cell.today{ border:2px solid var(--today-border); }
.day-cell-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:2px; }
/* マス右上のバッジ置き場(v39)。シフトと申請不可が両方ある日は縦に積んで横にはみ出さないようにする */
.day-badges{ display:flex; flex-direction:column; align-items:flex-end; gap:2px; min-width:0; }
.blocked-badge{
  font-size:0.58rem; font-weight:700; padding:1px 4px; border-radius:8px;
  color:#5f5550; background:#e0dcd9; border:1px solid #c9c3bf; white-space:nowrap;
}
.day-num{ font-size:0.85rem; font-weight:600; }
.shift-badge{
  font-size:0.62rem; font-weight:700; padding:1px 5px; border-radius:8px; color:#fff; background:var(--secondary-dark);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; min-width:0;
}
.shift-badge.shift-1{ background:var(--shift-1); }
.shift-badge.shift-2{ background:var(--shift-2); }
.shift-badge.shift-3{ background:var(--shift-3); }
.shift-badge.shift-off{ background:var(--shift-off); }
.shift-badge.shift-paid{ background:var(--shift-paid); color:#3a2e2e; }
.shift-badge.shift-hw{ background:var(--shift-hw); }
.shift-badge.shift-hw1{ background:var(--shift-hw1); }
.shift-badge.shift-hw2{ background:var(--shift-hw2); }
.shift-badge.shift-hw3{ background:var(--shift-hw3); }
.chip-list{ margin-top:2px; display:flex; flex-direction:column; gap:2px; overflow:hidden; }
.chip{
  font-size:0.62rem; color:#fff; padding:1px 4px; border-radius:5px; white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis; max-width:100%; min-width:0;
}
.chip-more{ background:var(--text-muted); }
.period-lines{ margin-top:auto; display:flex; flex-direction:column; gap:2px; padding-top:2px; }
.period-line{ height:3px; border-radius:2px; width:100%; opacity:0.85; }
.empty-state{ text-align:center; color:var(--text-muted); padding:24px 12px; }

/* 長期予定の一覧(カレンダー上部) */
.longterm-section{ margin:8px 16px 0; background:#fff; border-radius:var(--radius-lg); box-shadow:var(--shadow-sm); padding:10px 12px; }
.longterm-title{ font-size:0.95rem; font-weight:700; margin-bottom:6px; display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
.longterm-list{ display:flex; flex-direction:column; gap:6px; }
.today-date-label{ font-size:0.78rem; font-weight:400; color:var(--text-muted); white-space:nowrap; }
.today-shift-row{ font-size:0.88rem; margin-bottom:6px; }
.longterm-item{
  position:relative; display:flex; align-items:center; gap:8px; width:100%; min-height:44px;
  background:var(--bg); border-radius:var(--radius-sm); padding:6px 8px;
}
.longterm-item.is-purchased{ opacity:0.55; }
.longterm-item-tap{
  display:flex; align-items:stretch; gap:8px; flex:1; min-width:0; min-height:44px; border:none;
  text-align:left; background:transparent; padding:0; margin:0; font:inherit; color:inherit;
}
.longterm-bar{ width:5px; border-radius:3px; flex-shrink:0; }
.longterm-body{ display:flex; flex-direction:column; gap:2px; min-width:0; }
.longterm-item-title{ font-size:0.92rem; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.longterm-item-schedule{ font-size:0.78rem; color:var(--text-muted); overflow-wrap:anywhere; }
.longterm-purchase{ flex-shrink:0; display:flex; align-items:center; }
.longterm-purchase-label{
  display:flex; align-items:center; gap:4px; min-height:44px; padding:0 4px; font-size:0.78rem;
  color:var(--text-muted); white-space:nowrap; cursor:pointer;
}
.longterm-purchase-label input[type="checkbox"]{ width:18px; height:18px; cursor:pointer; }
.purchased-stamp{
  position:absolute; top:-8px; right:6px; border:2px solid #c94f4f; color:#c94f4f;
  background:rgba(255,255,255,0.8); padding:1px 8px; border-radius:6px; font-weight:700;
  font-size:0.72rem; letter-spacing:1px; transform:rotate(-12deg); pointer-events:none;
}

/* sheet */
.sheet-backdrop{
  position:fixed; inset:0; background:rgba(60,40,40,0.35); display:flex; align-items:flex-end;
  justify-content:center; z-index:50;
}
.sheet{
  background:#fff; width:100%; max-height:88vh; overflow-y:auto; border-radius:var(--radius-lg) var(--radius-lg) 0 0;
  box-shadow:var(--shadow-md); padding:16px;
}
@media (min-width:768px){
  .sheet-backdrop{ align-items:center; }
  .sheet{ width:520px; max-width:92vw; border-radius:var(--radius-lg); max-height:84vh; }
}
.sheet-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
.sheet-body{ display:flex; flex-direction:column; gap:16px; }

/* shift picker */
.shift-buttons{ display:flex; flex-wrap:wrap; gap:8px; }
.shift-btn{
  min-height:44px; min-width:52px; padding:0 12px; border:2px solid var(--border); border-radius:var(--radius-md);
  background:#fff;
}
.shift-btn.active{ border-color:var(--primary-dark); background:var(--primary-light); font-weight:700; }
/* FB通話の申請不可日トグル(v39)。自分専用の印なので、テーマ色ではなく落ち着いたグレー系にする */
.blocked-picker{ margin-top:12px; }
.blocked-btn{
  width:100%; min-height:44px; padding:0 12px; border:2px solid var(--border); border-radius:var(--radius-md);
  background:#fff; color:var(--text-muted);
}
.blocked-btn.active{ border-color:#c9c3bf; background:#efebe8; color:var(--text); font-weight:700; }

/* event list */
.day-events h3, .shift-picker h3{ margin-bottom:8px; font-size:0.95rem; color:var(--text-muted); }
.event-item{
  display:flex; justify-content:space-between; gap:8px; align-items:flex-start;
  border-left:4px solid var(--primary); background:var(--bg); border-radius:var(--radius-sm);
  padding:10px; margin-bottom:8px;
}
.event-item-title{ font-weight:700; overflow-wrap:anywhere; }
.event-item-meta{ font-size:0.8rem; color:var(--text-muted); margin-top:2px; overflow-wrap:anywhere; }
.event-item-memo{ font-size:0.82rem; margin-top:4px; white-space:pre-wrap; overflow-wrap:anywhere; }
.event-item-memo a{ color:var(--secondary-dark); word-break:break-all; }
.event-item-public-memo{ color:var(--text-muted); }
.event-item-private-memo{ color:var(--memo-color); font-weight:600; }
.event-item-actions{ display:flex; gap:4px; flex-shrink:0; }
.event-item-actions .icon-btn{ min-width:36px; min-height:36px; box-shadow:none; background:#fff; }
.empty-hint{ color:var(--text-muted); font-size:0.9rem; }
.add-event-btn{
  width:100%; min-height:44px; border:2px dashed var(--primary); border-radius:var(--radius-md);
  background:#fff; color:var(--primary-dark); font-weight:700; margin-top:4px;
}
.longterm-collapse{
  width:100%; min-height:44px; border:none; background:var(--bg); border-radius:var(--radius-sm);
  padding:10px 12px; text-align:left; font-size:0.9rem; font-weight:700; color:var(--text);
  margin-bottom:8px;
}

/* form */
.field{ display:flex; flex-direction:column; gap:4px; }
.field label{ font-size:0.85rem; color:var(--text-muted); }
.field input, .field textarea{
  min-height:44px; padding:8px 10px; border:1px solid var(--border); border-radius:var(--radius-sm);
}
.field textarea{ min-height:70px; resize:vertical; }
.field-row{ display:flex; gap:12px; }
.field-row .field{ flex:1; }
.field-error{ color:#c94f4f; font-size:0.8rem; margin:0; }
.chip-select{ display:flex; flex-wrap:wrap; gap:8px; }
.chip-option{
  min-height:40px; padding:0 14px; border:2px solid var(--border); border-radius:20px; background:#fff;
}
.chip-option.selected{ border-color:var(--primary-dark); background:var(--primary-light); font-weight:700; }
.form-actions{ display:flex; gap:12px; justify-content:flex-end; }
.btn-primary, .btn-secondary{
  min-height:44px; padding:0 20px; border-radius:var(--radius-md); border:none; font-weight:700;
}
.btn-primary{ background:var(--primary-dark); color:#fff; }
.btn-secondary{ background:#fff; border:1px solid var(--border); color:var(--text); }
.today-share-btn{ width:100%; margin-top:10px; }

<body>
<div id="app" role="application" aria-label="推し活カレンダー"></div>
<script>
'use strict';

/* =========================================================
 * 1. CONSTANTS
 * ========================================================= */
const STORAGE_KEYS = {
  DATA: 'oshical.data.v1',
  SYNC: 'oshical.sync.v1',
  NOTIFIED: 'oshical.notified.v1',
  UNLOCK: 'oshical.unlock.v1',
};

// アプリのロック(玄関の目隠し)。合言葉のSHA-256ハッシュのみ埋め込む。
// 空文字にするとロックなしで起動する。データ保護そのものは同期の暗号化が担う
const LOCK_HASH = '713d843e7ce6696676256ece9a8d22c26d1debbc9275309601732f9537452a48';

// EVENT_SECTION_SUFFIX: 「今月のイベント予定」見出しに付ける猫の顔文字。
// バッククォートを含むためテンプレートリテラル内には直接書けない → シングルクォート文字列の定数にして${...}で埋め込む
const EVENT_SECTION_SUFFIX = 'ฅ( *`꒳´ * ฅ)';

const CATEGORIES = {
  event:    { kind: 'oshi',     label: 'イベント',   colorVar: '--cat-event',    period: true },
  goods:    { kind: 'oshi',     label: 'グッズ販売', colorVar: '--cat-goods',    period: true },
  ticket:   { kind: 'oshi',     label: 'チケット販売', colorVar: '--cat-ticket', period: true },
  stream:   { kind: 'oshi',     label: '配信',       colorVar: '--cat-stream',   period: false },
  members:  { kind: 'oshi',     label: '限定配信',   colorVar: '--cat-members',  period: false },
  call:     { kind: 'oshi',     label: 'FB通話',     colorVar: '--cat-call',     period: false },
  other:    { kind: 'oshi',     label: 'その他',     colorVar: '--cat-other',    period: true },
  anniversary: { kind: 'both', label: '記念日', colorVar: '--cat-anniversary', period: false },
  personal: { kind: 'personal', label: '自分の予定', colorVar: '--cat-personal', period: true },
};

// SHIFT_DEFS: シフトの定義。badgeはカレンダーのマスに出す短縮表記(未指定ならlabelをそのまま使う)。
// v35で「有給(paid)」と「休出①②③(hw1/hw2/hw3)」を追加した。
// **旧コード 'hw'(細分化前の休出)は消さずに残す**。既に登録済みの日がどのシフトだったかは
// 復元できないため、過去のデータは「休出」のまま表示し、選択ボタン(SHIFT_CODE_ORDER)からのみ外す。
const SHIFT_DEFS = {
  '1':  { label: '①', time: '7:00–15:00' },
  '2':  { label: '②', time: '15:00–22:15' },
  '3':  { label: '③', time: '22:15–翌7:00' },
  off:  { label: '休み', time: '' },
  paid: { label: '有給', time: '' },
  hw:   { label: '休出', time: '' },
  hw1:  { label: '休出①', time: '7:00–15:00',   badge: '出①' },
  hw2:  { label: '休出②', time: '15:00–22:15',  badge: '出②' },
  hw3:  { label: '休出③', time: '22:15–翌7:00', badge: '出③' },
};

// SHIFT_CODE_ORDER: 日詳細のシフト選択ボタンと、設定画面の色カスタマイズに出す順番。
// 旧コード 'hw' は含めない(新規に選ばせない。既存データの表示には SHIFT_DEFS 側で対応する)
const SHIFT_CODE_ORDER = ['1', '2', '3', 'off', 'paid', 'hw1', 'hw2', 'hw3'];
// 休出①②③は3つとも従来の休出色(オレンジ)を既定にする。有給は休みの緑を淡くした色
const SHIFT_COLOR_DEFAULTS = {
  '1': '#e893ac', '2': '#7cc3d8', '3': '#c9a8e0',
  off: '#8fbf9f', paid: '#bcd9c5',
  hw: '#f0a860', hw1: '#f0a860', hw2: '#f0a860', hw3: '#f0a860',
};
const WEEKDAY_LABELS = ['日', '月', '火', '水', '木', '金', '土'];
const MILESTONE_PRIORITY = { 'lastday-eve': 0, lastday: 1, firstday: 2, anniversary: 2.5, 'today-time': 3, 'shift-tomorrow': 4 };
const GIST_DESCRIPTION = 'oshical-sync-v1';
const GIST_FILENAME = 'oshical.enc.json';
// 公開カレンダー(§12): 公開できるのは推しカテゴリ(FB通話callを除く)+記念日。
// 限定配信(members)はv31でPUBLIC_CATEGORIESに追加したが、実際に公開されるのは従来通り
// ユーザーが予定ごとに「公開カレンダーに載せる」チェックを入れたもの(ev.public===true)のみ
// (buildPublicPayload/fixDraftPublicのkind==='oshi'+public===true判定は変更していない)。
// callは絶対にここへ追加しないこと
const PUBLIC_CATEGORIES = ['event', 'goods', 'ticket', 'stream', 'members', 'other', 'anniversary'];
// 共有画像1枚に載せる予定の最大件数(v34)。これを超えると「ほか◯件」にまとめる。
// 画像が縦に長くなりすぎると、端末によってはCanvasのPNG化(toBlob)が失敗するため
const SHARE_MAX_ITEMS = 24;
// Xの1投稿に添付できる画像の枚数(v37)。これを超えた分は保存だけして枚数を知らせる
const X_MAX_IMAGES = 4;
const GIST_PUBLIC_DESCRIPTION = 'oshical-public-v1';
const GIST_PUBLIC_FILENAME = 'oshical-public.json';
const GITHUB_API = 'https://api.github.com';
const SYNC_DEBOUNCE_MS = 3000;
const NOTIFY_TICK_MS = 60000;
const PBKDF2_ITERATIONS = 310000;
const TOMBSTONE_TTL_MS = 90 * 24 * 60 * 60 * 1000; // 論理削除データの保持期間(90日)

/* =========================================================
 * 2. date-utils (すべて純関数)
 * ========================================================= */
function pad2(n) {
  return String(n).padStart(2, '0');
}

function fmtDate(y, m, d) {
  return `${y}-${pad2(m)}-${pad2(d)}`;
}

function parseDateStr(s) {
  const parts = String(s).split('-').map(Number);
  return { y: parts[0], m: parts[1], d: parts[2] };
}

function dateStrToDate(s) {
  const { y, m, d } = parseDateStr(s);
  return new Date(y, m - 1, d);
}

function dateToDateStr(date) {
  return fmtDate(date.getFullYear(), date.getMonth() + 1, date.getDate());
}

function todayStr(now) {
  const d = now instanceof Date ? now : new Date();
  return dateToDateStr(d);
}

function addDays(dateStr, n) {
  const d = dateStrToDate(dateStr);
  d.setDate(d.getDate() + n);
  return dateToDateStr(d);
}

function addMonths(dateStr, n) {
  const { y, m, d } = parseDateStr(dateStr);
  const date = new Date(y, m - 1 + n, 1);
  const lastDay = daysInMonth(date.getFullYear(), date.getMonth() + 1);
  date.setDate(Math.min(d, lastDay));
  return dateToDateStr(date);
}

function daysInMonth(year, month) {
  return new Date(year, month, 0).getDate();
}

function compareDates(a, b) {
  if (a < b) return -1;
  if (a > b) return 1;
  return 0;
}

function isDateInRange(dateStr, start, end) {
  return compareDates(dateStr, start) >= 0 && compareDates(dateStr, end) <= 0;
}

function startOfMonthStr(year, month) {
  return fmtDate(year, month, 1);
}

function endOfMonthStr(year, month) {
  return fmtDate(year, month, daysInMonth(year, month));
}

function monthGrid(year, month) {
  const first = new Date(year, month - 1, 1);
  const startOffset = first.getDay();
  const gridStart = new Date(year, month - 1, 1 - startOffset);
  const cells = [];
  for (let i = 0; i < 42; i++) {
    const d = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate() + i);
    cells.push({ dateStr: dateToDateStr(d), inMonth: d.getMonth() === month - 1 });
  }
  const weeks = [];
  for (let i = 0; i < 6; i++) {
    weeks.push(cells.slice(i * 7, i * 7 + 7));
  }
  return weeks;
}

function formatMonthLabel(year, month) {
  return `${year}年${month}月`;
}

function formatDateLabel(dateStr) {
  const d = dateStrToDate(dateStr);
  const { m, d: day } = parseDateStr(dateStr);
  return `${m}月${day}日(${WEEKDAY_LABELS[d.getDay()]})`;
}

// formatEventSchedule: 予定の日時表記を統一する純関数
// 期間もの: 「6月20日(土)19:00〜8月9日(日) 23:59まで」 / 単日: 「21:00〜22:30」
// anniversary(記念日): 「毎年5月10日」+ time/endTimeがあれば単日と同じ流儀で付ける
// この関数はアプリ/公開ページ/通知の3実装で同一仕様に保つこと
function formatEventSchedule(ev) {
  if (!ev) return '';
  if (ev.category === 'anniversary') {
    if (!ev.startDate) return '';
    const { m, d } = parseDateStr(ev.startDate);
    const base = `毎年${m}月${d}日`;
    if (!ev.time && !ev.endTime) return base;
    if (!ev.time) return `${base} ${ev.endTime}まで`;
    return `${base} ${ev.time}〜${ev.endTime || ''}`;
  }
  const multi = ev.startDate !== ev.endDate;
  if (multi) {
    const start = `${formatDateLabel(ev.startDate)}${ev.time ? ` ${ev.time}` : ''}`;
    const end = `${formatDateLabel(ev.endDate)}${ev.endTime ? ` ${ev.endTime}まで` : ''}`;
    return `${start}〜 ${end}`;
  }
  if (!ev.time && !ev.endTime) return '';
  if (!ev.time) return `${ev.endTime}まで`;
  return `${ev.time}〜${ev.endTime || ''}`;
}

// formatEventScheduleWithDate: 一覧アイテム(今月のイベント予定/販売期間中一覧/今日の予定)専用の日時表記。
// 期間もの・anniversaryは formatEventSchedule と同じ結果を返す(既に日付が入っているため)。
// 単日(startDate === endDate)のみ formatDateLabel の日付を先頭に付ける。
// formatEventSchedule 自体は変更しない(詳細シート/通知/公開ページの詳細表示は従来通り)
function formatEventScheduleWithDate(ev) {
  if (!ev) return '';
  if (ev.category === 'anniversary') return formatEventSchedule(ev);
  const multi = ev.startDate !== ev.endDate;
  if (multi) return formatEventSchedule(ev);
  const timePart = formatEventSchedule(ev);
  return `${formatDateLabel(ev.startDate)}${timePart ? ` ${timePart}` : ''}`;
}

/* =========================================================
 * 3. store (load/save/setState、マイグレーション枠)
 * ========================================================= */
function getDefaultState() {
  return {
    version: 1,
    settings: {
      oshiName: '',
      themePrimary: '#f8b6c8',
      themeSecondary: '#a5d8e6',
      notifyEnabled: false,
      notifyMorningHour: 7,   // Discord朝通知の時刻(0〜23、-1=送らない)。GitHub Actions側が参照
      notifyNoonHour: 12,     // Discord昼通知の時刻(内容は朝と同じ「今日のダイジェスト」)
      notifyEveningHour: 20,  // Discord夜通知の時刻(0〜23、-1=送らない)
      publicEnabled: false, // 公開カレンダー(§12)のON/OFF。設定ごと同期され全端末で揃う
      categoryColors: {}, // カテゴリごとの色の上書き。空文字/未設定=テーマから自動導出
      shiftColors: {},    // シフトごとの色の上書き。空文字/未設定=標準色
      memoColor: '',      // 自分用メモの文字色。空文字=テーマから自動導出
      todayColor: '',     // 今日の枠の色。空文字=テーマから自動導出
      membersPublicMigrated: false, // v31: 限定配信(members)公開解禁の安全マイグレーション実施済みフラグ
      updatedAt: 0,
    },
    events: [],
    shifts: {},
    // blockedDays: FB通話の申請ができない日(v39)。{ "YYYY-MM-DD": { updatedAt, deleted } }。
    // shiftsと同じ「日付をキーにしたマップ」形式で、同期・マージ・90日パージも同じ扱いをする。
    // **完全に自分専用**。公開ペイロード・共有画像・Discord通知のいずれにも出さない
    blockedDays: {},
  };
}

// normalizeEvent: 旧データ互換。public フィールドが無いイベントには既定値 false を補う
function normalizeEvent(ev) {
  if (!ev || typeof ev !== 'object') return ev;
  return {
    ...ev,
    public: typeof ev.public === 'boolean' ? ev.public : false,
    publicMemo: typeof ev.publicMemo === 'string' ? ev.publicMemo : '',
    endTime: typeof ev.endTime === 'string' ? ev.endTime : '',
    longTerm: typeof ev.longTerm === 'boolean' ? ev.longTerm : false,
    purchased: typeof ev.purchased === 'boolean' ? ev.purchased : false,
  };
}

// 将来のバージョンアップ時はここに version ごとの変換を追加していく
// v31安全マイグレーション: 限定配信(members)をPUBLIC_CATEGORIESに追加した際、過去に
// (通常は起こり得ないはずだが)不正に public:true のまま保存されていたmembersイベントが
// 突然公開されてしまわないよう、settings.membersPublicMigrated!==trueのときだけ一度だけ
// membersカテゴリの public を強制的に false へ落とす。ユーザーが自分でチェックを入れ直した
// 後(=既にmembersPublicMigrated:trueになった後)のデータは触らない。updatedAtは一切変更しない
function migrateData(raw) {
  if (!raw || typeof raw !== 'object') return getDefaultState();
  const base = getDefaultState();
  const settings = { ...base.settings, ...(raw.settings || {}) };
  const events = Array.isArray(raw.events) ? raw.events.map(normalizeEvent) : [];
  const shifts = raw.shifts && typeof raw.shifts === 'object' ? raw.shifts : {};
  // blockedDaysを持たない旧データは空のマップを補う(v39)
  const blockedDays = raw.blockedDays && typeof raw.blockedDays === 'object' ? raw.blockedDays : {};
  if (settings.membersPublicMigrated !== true) {
    const migratedEvents = events.map((ev) => {
      if (ev && ev.category === 'members' && ev.public === true) {
        return { ...ev, public: false };
      }
      return ev;
    });
    return {
      version: 1,
      settings: { ...settings, membersPublicMigrated: true },
      events: migratedEvents,
      shifts,
      blockedDays,
    };
  }
  return { version: 1, settings, events, shifts, blockedDays };
}

// purgeOldTombstones: 論理削除から90日を過ぎたデータを物理削除する純関数
function purgeOldTombstones(data, now) {
  const cutoff = (typeof now === 'number' ? now : Date.now()) - TOMBSTONE_TTL_MS;
  const events = (data.events || []).filter((ev) => !(ev && ev.deleted && (ev.updatedAt || 0) < cutoff));
  const shifts = {};
  Object.keys(data.shifts || {}).forEach((key) => {
    const s = data.shifts[key];
    if (!(s && s.deleted && (s.updatedAt || 0) < cutoff)) shifts[key] = s;
  });
  const blockedDays = {};
  Object.keys(data.blockedDays || {}).forEach((key) => {
    const b = data.blockedDays[key];
    if (!(b && b.deleted && (b.updatedAt || 0) < cutoff)) blockedDays[key] = b;
  });
  return { ...data, events, shifts, blockedDays };
}

function loadState() {
  try {
    const json = localStorage.getItem(STORAGE_KEYS.DATA);
    if (!json) return getDefaultState();
    return purgeOldTombstones(migrateData(JSON.parse(json)));
  } catch (e) {
    console.error('データの読み込みに失敗しました', e);
    return getDefaultState();
  }
}

function saveState(next) {
  try {
    localStorage.setItem(STORAGE_KEYS.DATA, JSON.stringify(next));
    return true;
  } catch (e) {
    console.error('データの保存に失敗しました', e);
    showToast('データの保存に失敗しました。空き容量を確認してください');
    return false;
  }
}

let state = null;

// setState: 不変スタイルで state を置換 -> 保存 -> 再描画 -> 同期スケジュール
function setState(updater) {
  const partial = typeof updater === 'function' ? updater(state) : updater;
  state = { ...state, ...partial };
  saveState(state);
  fullRender();
  scheduleSync();
  return state;
}

/* =========================================================
 * 4. logic — 純関数のみ。window.__oshicalTest__ で公開する
 * ========================================================= */

// isLeapYear: うるう年(2月29日が存在する年)かどうかを判定する純関数
function isLeapYear(year) {
  return (year % 4 === 0 && year % 100 !== 0) || year % 400 === 0;
}

// occursOnDay: 指定した日にその予定が表示されるかを判定する純関数。
// anniversary(記念日)以外は従来通り isDateInRange による期間内判定。
// anniversary は startDate の月日が dateStr の月日と一致すれば年を問わず毎年表示する。
// 例外: startDate が 02-29(うるう日)の記念日は、2月29日が存在しない平年では 02-28 に表示する
// (うるう年はその年の02-29のみに表示され、平年の02-28と二重表示にはならない)
function occursOnDay(ev, dateStr) {
  if (!ev || !dateStr) return false;
  if (ev.category !== 'anniversary') {
    return isDateInRange(dateStr, ev.startDate, ev.endDate);
  }
  if (!ev.startDate) return false;
  const start = parseDateStr(ev.startDate);
  const target = parseDateStr(dateStr);
  if (start.m === target.m && start.d === target.d) return true;
  if (start.m === 2 && start.d === 29 && target.m === 2 && target.d === 28) {
    return !isLeapYear(target.y);
  }
  return false;
}

function eventsOnDay(targetState, dateStr) {
  const events = (targetState && targetState.events) || [];
  return events.filter((ev) => ev && !ev.deleted && occursOnDay(ev, dateStr));
}

// todayAgenda: ヘッダー直下の「今日の予定」カードに出す当日情報を返す純関数(v25)。
// events は eventsOnDay(occursOnDayベース。記念日も含む)と同じ抽出結果から
// 長期予定(longTerm===true)を除外したものを、
// 時刻順(timeがある予定を先にtime昇順、無い予定は後ろに回す)→タイトル昇順(localeCompare)でソートする。
// 長期予定(longTerm)は「📌 販売期間中 一覧」に出るため、このカードには含めない
// shift は targetState.shifts[today] が存在し削除されていなければそのオブジェクト、無ければ null。
// null安全: targetState が null/undefined でも { dateStr: today, events: [], shift: null } を返す
function todayAgenda(targetState, today) {
  if (!targetState) return { dateStr: today, events: [], shift: null };
  const events = eventsOnDay(targetState, today)
    .filter((ev) => ev.longTerm !== true)
    .sort((a, b) => {
      if (a.time && b.time) {
        if (a.time !== b.time) return a.time < b.time ? -1 : 1;
        return String(a.title).localeCompare(String(b.title));
      }
      if (a.time && !b.time) return -1;
      if (!a.time && b.time) return 1;
      return String(a.title).localeCompare(String(b.title));
    });
  const shiftRaw = (targetState.shifts || {})[today];
  const shift = (shiftRaw && !shiftRaw.deleted) ? shiftRaw : null;
  return { dateStr: today, events, shift };
}

// isBlockedDay: その日がFB通話の申請不可日かどうかを判定する純関数(v39)。
// 削除済み(deleted)は不可日ではないものとして扱う。null/未定義安全
function isBlockedDay(targetState, dateStr) {
  const map = (targetState && targetState.blockedDays) || {};
  const entry = map[dateStr];
  return !!(entry && !entry.deleted);
}

// isSharableEvent: 共有画像に載せてよい予定かどうかを判定する純関数(v34で共通化)。
// 「今日の予定」画像・「販売期間まとめ」画像の両方がこの1箇所の判定を使う。
//  - 推し種別(kind==='oshi')かつ公開可カテゴリ(PUBLIC_CATEGORIES)のみ許可する。
//    自分の予定(personal)・FB通話(call)はこの時点で落ちる
//  - 限定配信(members)だけは ev.public===true(ユーザーが公開チェックを入れたもの)に限る
// null/undefined安全(falseを返す)
function isSharableEvent(ev) {
  if (!ev || ev.kind !== 'oshi' || PUBLIC_CATEGORIES.indexOf(ev.category) === -1) return false;
  if (ev.category === 'members' && ev.public !== true) return false;
  return true;
}

// buildShareLines: 「今日の予定」画像(Twitter添付用)に載せる行データを組み立てる純関数。
// 画像は「公開して差し支えない情報」のみで構成する(v29→v30で仕様変更、v31で限定配信の扱いを追加変更):
//  - 自分のシフト(勤務予定)は一切含めない(戻り値に shiftLine キー自体を持たない)
//  - 自分の予定(kind==='personal')・FB通話(call)は items から除外する。
//    非members・非call・非personalのカテゴリは ev.public フラグ(公開カレンダー掲載チェック)を
//    条件にしない(カテゴリ的に見せて良いかどうかのみで絞る)。
//  - 限定配信(members)のみ、ev.public===trueのとき(=ユーザーが公開チェックを入れた予定)だけ
//    itemsに含める。公開チェックしていないメン限は画像にも一切出さない(v31)
//  - 自分用メモ(memo)・公開用メモ(publicMemo)はうっかり公開防止のため絶対に含めない。null安全
// 第3引数 reminders は computeReminders() の戻り値({ id, eventId, milestone, text }[])。
// 第4引数 allEvents(state.events)は、リマインドの元イベントが上記の「公開して良い予定」の条件を
// 満たすかどうかを判定するために使う(r.eventId から元イベントを引く)。まず filterDeadlineReminders
// で最終日系(lastday-eve/lastday)のみに絞り(v32、画面表示のお知らせと同じ基準に統一)、
// milestone==='shift-tomorrow'(自分のシフト。最終日系絞り込み後は原理上含まれないが安全のため
// 引き続き明示除外)を除いた上で、元イベントが引けて公開条件を満たすものだけを残す。
// allEvents が渡されない(判定できない)場合は安全側に倒してリマインドを空配列にする。最大6件まで含める
function buildShareLines(agenda, settings, reminders, allEvents) {
  const s = settings || {};
  const a = agenda || { dateStr: '', events: [], shift: null };
  const title = `${s.oshiName || '推し'}カレンダー`;
  const dateLabel = a.dateStr ? formatDateLabel(a.dateStr) : '';
  const effective = computeEffectiveColors(s);
  const items = (a.events || [])
    .filter(isSharableEvent)
    .map((ev) => {
      const cat = CATEGORIES[ev.category] || CATEGORIES.other;
      const schedule = formatEventScheduleWithDate(ev);
      const meta = schedule ? `${cat.label}・${schedule}` : cat.label;
      const color = effective.cat[ev.category] || effective.cat.other;
      return { title: ev.title, meta, color };
    });
  const remindersSource = filterDeadlineReminders(reminders);
  const eventsSource = Array.isArray(allEvents) ? allEvents : null;
  const publicReminders = remindersSource
    .filter((r) => r && r.milestone !== 'shift-tomorrow')
    .filter((r) => {
      if (!eventsSource) return false;
      const sourceEvent = eventsSource.find((ev) => ev && ev.id === r.eventId);
      return isSharableEvent(sourceEvent);
    })
    .map((r) => r.text)
    .slice(0, 6);
  return { title, dateLabel, items, reminders: publicReminders };
}

// listOnSaleShareEvents: 「販売期間まとめ」画像に載せる予定を返す純関数(v34)。
// 「📌 販売期間中 一覧」と同じ母集団(longTerm===true・endDateが今日以降)から、
// さらに isSharableEvent を通したものだけを締切日(endDate)昇順・同日ならstartDate昇順で返す。
// category に 'all' 以外を渡すとそのカテゴリだけに絞る。
// 購入済みフラグ(ev.purchased)は自分専用の情報なので、絞り込みにも表示にも一切使わない
function listOnSaleShareEvents(targetState, today, category) {
  const events = (targetState && Array.isArray(targetState.events)) ? targetState.events : [];
  return events
    .filter((ev) => ev && !ev.deleted && ev.longTerm === true)
    .filter((ev) => !today || compareDates(ev.endDate, today) >= 0)
    .filter(isSharableEvent)
    .filter((ev) => !category || category === 'all' || ev.category === category)
    .slice()
    .sort((a, b) => compareDates(a.endDate, b.endDate) || compareDates(a.startDate, b.startDate));
}

// listOnSaleShareCategories: 画像にできるカテゴリの選択肢を返す純関数(v34)。
// いま共有できる販売期間の予定に実際に含まれるカテゴリだけを CATEGORIES の定義順で返し、
// 2種類以上あるときだけ先頭に 'all'(すべてまとめて1枚)を足す。
// 戻り値: [{ key, label, count }]。0件のときは空配列
function listOnSaleShareCategories(targetState, today) {
  const events = listOnSaleShareEvents(targetState, today, 'all');
  if (!events.length) return [];
  const order = Object.keys(CATEGORIES);
  const options = order
    .filter((key) => events.some((ev) => ev.category === key))
    .map((key) => ({
      key,
      label: CATEGORIES[key].label,
      count: events.filter((ev) => ev.category === key).length,
    }));
  if (options.length > 1) {
    return [{ key: 'all', label: 'すべて', count: events.length }].concat(options);
  }
  return options;
}

// buildOnSaleShareLines: 「販売期間まとめ」画像に載せる行データを組み立てる純関数(v34)。
// buildShareLines と同じ形({ title, dateLabel, heading, emptyMessage, items, reminders })を返すので、
// 描画は renderShareCanvas をそのまま流用できる。
// 見出しはカテゴリ名から作る(イベント→「イベント期間」/ グッズ販売→「グッズ販売期間」/
// チケット販売→「チケット販売期間」/ すべて→「販売期間まとめ」)。
// items の meta は期間表記。'all' のときだけカテゴリ名を頭に付ける。
// 自分用メモ・公開用メモ・購入済みフラグは「今日の予定」画像と同じく一切含めない
function buildOnSaleShareLines(targetState, today, category) {
  const s = (targetState && targetState.settings) || {};
  const cat = category && category !== 'all' ? CATEGORIES[category] : null;
  const title = `${s.oshiName || '推し'}カレンダー`;
  const dateLabel = today ? `${formatDateLabel(today)} 時点` : '';
  const heading = cat ? `${cat.label}期間` : '販売期間・イベント期間まとめ';
  const effective = computeEffectiveColors(s);
  const all = listOnSaleShareEvents(targetState, today, category);
  const items = all.slice(0, SHARE_MAX_ITEMS).map((ev) => {
    const evCat = CATEGORIES[ev.category] || CATEGORIES.other;
    const schedule = formatEventScheduleWithDate(ev);
    return {
      title: ev.title,
      meta: cat ? schedule : (schedule ? `${evCat.label}・${schedule}` : evCat.label),
      color: effective.cat[ev.category] || effective.cat.other,
    };
  });
  // 画像が縦に長くなりすぎると端末によってはPNG化に失敗するため件数を打ち切り、残りは件数だけ伝える
  if (all.length > SHARE_MAX_ITEMS) {
    items.push({ title: `ほか${all.length - SHARE_MAX_ITEMS}件`, meta: '', color: effective.cat.other });
  }
  return { title, dateLabel, heading, emptyMessage: '販売中のものはありません', items, reminders: [] };
}

// isEventInMonth: 予定が指定した年月に重なるかを判定する純関数。
// anniversary(記念日)は年を問わず「startDateの月 === 対象月」で判定する
// (02-29登録の記念日は平年でも02-28に表示されるため、この月判定で正しい)
function isEventInMonth(ev, year, month) {
  if (ev && ev.category === 'anniversary') {
    if (!ev.startDate) return false;
    return parseDateStr(ev.startDate).m === month;
  }
  const monthStart = startOfMonthStr(year, month);
  const monthEnd = endOfMonthStr(year, month);
  return isDateInRange(ev.startDate, monthStart, monthEnd)
    || isDateInRange(ev.endDate, monthStart, monthEnd)
    || (compareDates(ev.startDate, monthStart) <= 0 && compareDates(ev.endDate, monthEnd) >= 0);
}

function fixDraftEndDate(draft) {
  const cat = CATEGORIES[draft.category];
  if (cat && !cat.period) {
    return { ...draft, endDate: draft.startDate };
  }
  return draft;
}

// fixDraftPublic: 公開不可(自分の予定 / call カテゴリなどPUBLIC_CATEGORIES外)へ変更したら
// public を自動でfalseに戻す純関数。v31以降、members(限定配信)はkind==='oshi'であれば
// PUBLIC_CATEGORIESに含まれるためここでは矯正されない(ユーザーが個別に公開チェックを入れる)
function fixDraftPublic(draft) {
  if (!draft) return draft;
  const canPublish = draft.kind === 'oshi' && PUBLIC_CATEGORIES.indexOf(draft.category) !== -1;
  if (canPublish) return draft;
  return { ...draft, public: false };
}

// fixDraftLongTerm: 単日になった下書きの「長期予定」フラグを自動で外す純関数
function fixDraftLongTerm(draft) {
  if (!draft) return draft;
  if (draft.startDate && draft.endDate && draft.startDate !== draft.endDate) return draft;
  if (draft.longTerm !== true) return draft;
  return { ...draft, longTerm: false };
}

// listLongTermEvents: 上部一覧に出す長期予定を返す純関数。
// 削除済みでない longTerm===true の全イベントを、締切日(endDate)が近い順(同じなら startDate 昇順)で返す。
// 表示中の月による絞り込みは行わない。
// today(YYYY-MM-DD)を渡すと、終了した予定(endDate < today)は一覧に出さない(最終日当日は表示する)。
// 日マスの細ライン(period-lines)や日詳細の折りたたみ(期間中の長期予定)のロジックは対象外(過去の月でも見られる)。
// today が falsy の場合は日付フィルタをスキップして従来通り全件返す(null安全・テスト互換のため)
function listLongTermEvents(targetState, today) {
  const events = (targetState && Array.isArray(targetState.events)) ? targetState.events : [];
  return events
    .filter((ev) => ev && !ev.deleted && ev.longTerm === true)
    .filter((ev) => !today || compareDates(ev.endDate, today) >= 0)
    .slice()
    .sort((a, b) => compareDates(a.endDate, b.endDate) || compareDates(a.startDate, b.startDate));
}

// listMonthlyEvents: 「今月のイベント予定」枠に出すイベントカテゴリの予定を返す純関数。
// 削除済みでない category==='event' の予定のうち、指定した year/month と期間が重なるものを
// startDate 昇順(同じなら endDate 昇順)で返す。longTermかどうかは問わない(longTermのイベントも対象に含む)。
function listMonthlyEvents(targetState, year, month) {
  const events = (targetState && Array.isArray(targetState.events)) ? targetState.events : [];
  return events
    .filter((ev) => ev && !ev.deleted && ev.category === 'event' && isEventInMonth(ev, year, month))
    .slice()
    .sort((a, b) => compareDates(a.startDate, b.startDate) || compareDates(a.endDate, b.endDate));
}

// buildPublicPayload: 公開Gistに書き出す平文ペイロードを組み立てる純関数(§12.3)
// public===true かつ公開可カテゴリのイベントのみ・memoは含めない
function buildPublicPayload(targetState, now) {
  const settings = (targetState && targetState.settings) || {};
  const events = (targetState && Array.isArray(targetState.events)) ? targetState.events : [];
  const effective = computeEffectiveColors(settings);
  const colors = {};
  PUBLIC_CATEGORIES.forEach((key) => { colors[key] = effective.cat[key]; });
  const publicEvents = events
    .filter((ev) => ev && !ev.deleted && ev.public === true && ev.kind === 'oshi' && PUBLIC_CATEGORIES.indexOf(ev.category) !== -1)
    .map((ev) => ({
      id: ev.id,
      category: ev.category,
      title: ev.title,
      startDate: ev.startDate,
      endDate: ev.endDate,
      time: ev.time || '',
      endTime: ev.endTime || '',
      memo: ev.publicMemo || '', // 公開されるのは「公開用メモ」のみ。自分用メモ(ev.memo)は絶対に含めない
      longTerm: ev.longTerm === true, // 公開ページでも長期予定は上部一覧+細ライン表示にする
    }));
  return {
    v: 1,
    updatedAt: typeof now === 'number' ? now : Date.now(),
    oshiName: settings.oshiName || '',
    theme: {
      primary: settings.themePrimary || '#f8b6c8',
      secondary: settings.themeSecondary || '#a5d8e6',
      today: settings.todayColor || adjustLightness(settings.themePrimary || '#f8b6c8', -25),
    },
    colors,
    events: publicEvents,
  };
}

function validateEventInput(input) {
  const errors = {};
  const title = input && input.title ? String(input.title).trim() : '';
  if (!title) {
    errors.title = 'タイトルを入力してください';
  }
  if (!input || !input.startDate) {
    errors.startDate = '開始日を入力してください';
  }
  const endDate = (input && (input.endDate || input.startDate)) || '';
  if (input && input.startDate && endDate && compareDates(endDate, input.startDate) < 0) {
    errors.endDate = '終了日が開始日より前です';
  }
  return { valid: Object.keys(errors).length === 0, errors };
}

// computeReminders: リマインドバナー & 通知の元になる純関数
function computeReminders(targetState, today) {
  const events = (targetState && targetState.events) || [];
  const shifts = (targetState && targetState.shifts) || {};
  const tomorrow = addDays(today, 1);
  const reminders = [];

  const addReminder = (eventId, milestone, text) => {
    reminders.push({ id: `${eventId}:${milestone}:${today}`, eventId, milestone, text });
  };

  events.forEach((ev) => {
    if (!ev || ev.deleted || !ev.title || !ev.startDate || !ev.endDate) return;
    const catDef = CATEGORIES[ev.category];
    const isPeriod = !!(catDef && catDef.period);
    const isMultiDay = ev.startDate !== ev.endDate;
    const isTimedKind = ev.category === 'stream' || ev.category === 'members' || ev.category === 'call';

    if (isPeriod && isMultiDay && ev.endDate === tomorrow) {
      addReminder(ev.id, 'lastday-eve', `⚠ 『${ev.title}』は明日が最終日!`);
    }
    if (isPeriod && isMultiDay && ev.endDate === today) {
      addReminder(ev.id, 'lastday', `🔔 『${ev.title}』は今日が最終日!`);
    }
    if (isPeriod && isMultiDay && ev.startDate === today) {
      addReminder(ev.id, 'firstday', `🎪 『${ev.title}』今日から!`);
    }
    if (isTimedKind && ev.startDate === today) {
      const range = ev.time ? ` ${ev.time}〜${ev.endTime || ''}` : '';
      addReminder(ev.id, 'today-time', `📺 『${ev.title}』今日${range}`);
    }
    // anniversary(記念日): 単日予定なので既存の期間系リマインド(lastday等)は適用されない。
    // occursOnDay で毎年の同月日判定を行い、一致した日にだけ🎉リマインドを出す
    if (ev.category === 'anniversary' && occursOnDay(ev, today)) {
      addReminder(ev.id, 'anniversary', `🎉 今日は『${ev.title}』!`);
    }
  });

  const tomorrowShift = shifts[tomorrow];
  if (tomorrowShift && !tomorrowShift.deleted && SHIFT_DEFS[tomorrowShift.code]) {
    reminders.push({
      id: `shift:shift-tomorrow:${today}`,
      eventId: null,
      milestone: 'shift-tomorrow',
      text: `💼 明日は${SHIFT_DEFS[tomorrowShift.code].label}`,
    });
  }

  return reminders.sort((a, b) => MILESTONE_PRIORITY[a.milestone] - MILESTONE_PRIORITY[b.milestone]);
}

// filterDeadlineReminders: 画面表示用に、computeReminders() の結果から「最終日系」
// (lastday-eve: 明日が最終日 / lastday: 今日が最終日)のみを残す純関数。
// firstday・today-time・anniversary・shift-tomorrow は表示から除外する(お知らせと今日の予定
// リストの重複表示を避けるため、v32)。ブラウザ通知(processReminders)はこの関数を使わず
// computeReminders の全件をそのまま使い続ける(通知内容は変更しない)。
// 元の配列の順序を維持する(computeReminders が既に優先度順にソート済みのため)。
// null / 非配列 の場合は空配列を返す
function filterDeadlineReminders(reminders) {
  if (!Array.isArray(reminders)) return [];
  return reminders.filter((r) => r && (r.milestone === 'lastday-eve' || r.milestone === 'lastday'));
}

// buildTodayReminderViews: 「今日の予定」カード内のお知らせを描画するための表示用データを作る純関数(v40)。
// 各お知らせについて、元になった予定が今も state に存在する(削除されていない)かを確認し、
// 存在するときだけ tappable:true + eventId を持たせる。呼び出し側はこれを見て、タップで
// 個別詳細シートを開ける <button data-action="open-event"> にするか、従来どおり文言だけの
// <div> にするかを決める。元イベントが無い場合(削除済み・シフト由来の shift-tomorrow など)に
// タップさせると詳細が開かず無反応になるため、ここで確実に振り分ける。
// 引数は書き換えず新しい配列・新しいオブジェクトを返す。順序は元の配列のまま。
// reminders が null / 非配列 のときは空配列を返す
function buildTodayReminderViews(targetState, reminders) {
  if (!Array.isArray(reminders)) return [];
  const events = (targetState && targetState.events) || [];
  return reminders
    .filter((r) => r)
    .map((r) => {
      const ev = r.eventId ? events.find((x) => x && x.id === r.eventId && !x.deleted) : null;
      return { text: r.text || '', eventId: ev ? ev.id : null, tappable: !!ev };
    });
}

function mergeEventArrays(localEvents, remoteEvents) {
  const map = new Map();
  (localEvents || []).forEach((ev) => { if (ev && ev.id) map.set(ev.id, ev); });
  (remoteEvents || []).forEach((ev) => {
    if (!ev || !ev.id) return;
    const existing = map.get(ev.id);
    if (!existing || (ev.updatedAt || 0) > (existing.updatedAt || 0)) {
      map.set(ev.id, ev);
    }
  });
  return Array.from(map.values());
}

function mergeShiftMaps(localShifts, remoteShifts) {
  const result = { ...(localShifts || {}) };
  Object.keys(remoteShifts || {}).forEach((key) => {
    const localShift = result[key];
    const remoteShift = remoteShifts[key];
    if (!localShift || (remoteShift.updatedAt || 0) > (localShift.updatedAt || 0)) {
      result[key] = remoteShift;
    }
  });
  return result;
}

// mergeData: ローカルとリモートを updatedAt ベースで統合する純関数
function mergeData(local, remote) {
  if (!remote) return local || getDefaultState();
  if (!local) return remote;

  const events = mergeEventArrays(local.events, remote.events);
  const shifts = mergeShiftMaps(local.shifts, remote.shifts);
  // 申請不可日もシフトと同じ「updatedAtが新しい方が勝つ」規則で統合する(v39)
  const blockedDays = mergeShiftMaps(local.blockedDays, remote.blockedDays);
  let settings;
  if (remote.settings && local.settings) {
    settings = (remote.settings.updatedAt || 0) > (local.settings.updatedAt || 0) ? remote.settings : local.settings;
  } else {
    settings = remote.settings || local.settings || getDefaultState().settings;
  }

  return { version: 1, settings, events, shifts, blockedDays };
}

function cleanupNotifiedSet(notifiedSet, today) {
  const cleaned = new Set();
  notifiedSet.forEach((key) => {
    const parts = key.split(':');
    const date = parts[parts.length - 1];
    if (date >= today) cleaned.add(key);
  });
  return cleaned;
}

/* =========================================================
 * 5. crypto (PBKDF2 + AES-GCM)
 * ========================================================= */
function bufToBase64(buf) {
  const bytes = new Uint8Array(buf);
  let binary = '';
  for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
  return btoa(binary);
}

function base64ToBuf(b64) {
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes.buffer;
}

async function deriveAesKey(passphrase, saltBytes) {
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(passphrase), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: saltBytes, iterations: PBKDF2_ITERATIONS, hash: 'SHA-256' },
    keyMaterial,
    { name: 'AES-GCM', length: 256 },
    false,
    ['encrypt', 'decrypt']
  );
}

// encryptData: 平文オブジェクトを { v, salt, iv, data } 形式(base64)に暗号化する
async function encryptData(plainObj, passphrase) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveAesKey(passphrase, salt);
  const enc = new TextEncoder();
  const plaintext = enc.encode(JSON.stringify(plainObj));
  const ciphertext = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, plaintext);
  return {
    v: 1,
    salt: bufToBase64(salt.buffer),
    iv: bufToBase64(iv.buffer),
    data: bufToBase64(ciphertext),
  };
}

// decryptData: 合言葉が違う・データ破損時は例外を投げる(呼び出し側でローカルを上書きしないこと)
async function decryptData(payload, passphrase) {
  if (!payload || payload.v !== 1 || !payload.salt || !payload.iv || !payload.data) {
    throw new Error('不正なデータ形式です');
  }
  const salt = new Uint8Array(base64ToBuf(payload.salt));
  const iv = new Uint8Array(base64ToBuf(payload.iv));
  const key = await deriveAesKey(passphrase, salt);
  const ciphertext = base64ToBuf(payload.data);
  try {
    const plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ciphertext);
    const dec = new TextDecoder();
    return JSON.parse(dec.decode(plainBuf));
  } catch (e) {
    throw new Error('合言葉が違います');
  }
}

class SyncError extends Error {
  constructor(code, message) {
    super(message);
    this.name = 'SyncError';
    this.code = code;
  }
}

async function githubRequest(token, path, options) {
  const opts = options || {};
  let res;
  try {
    res = await fetch(`${GITHUB_API}${path}`, {
      method: opts.method || 'GET',
      headers: {
        Authorization: `Bearer ${token}`,
        Accept: 'application/vnd.github+json',
        ...(opts.body ? { 'Content-Type': 'application/json' } : {}),
      },
      body: opts.body ? JSON.stringify(opts.body) : undefined,
    });
  } catch (e) {
    throw new SyncError('network', 'ネットワークに接続できません');
  }
  if (res.status === 401) {
    throw new SyncError('auth', 'トークンが無効です。設定を確認してください');
  }
  if (res.status === 403) {
    throw new SyncError('rate-limit', 'しばらくしてから同期します');
  }
  if (!res.ok) {
    throw new SyncError('unknown', `通信エラーが発生しました(${res.status})`);
  }
  return res.json();
}

async function findExistingGistId(token) {
  const gists = await githubRequest(token, '/gists?per_page=100');
  const found = (gists || []).find((g) => g.description === GIST_DESCRIPTION);
  return found ? found.id : null;
}

async function createGist(token, payload) {
  const body = {
    description: GIST_DESCRIPTION,
    public: false,
    files: { [GIST_FILENAME]: { content: JSON.stringify(payload) } },
  };
  const gist = await githubRequest(token, '/gists', { method: 'POST', body });
  return gist.id;
}

async function fetchGistPayload(token, gistId) {
  const gist = await githubRequest(token, `/gists/${gistId}`);
  const file = gist.files && gist.files[GIST_FILENAME];
  if (!file) throw new SyncError('unknown', 'Gistのデータ形式が不正です');
  return JSON.parse(file.content);
}

async function updateGist(token, gistId, payload) {
  const body = { files: { [GIST_FILENAME]: { content: JSON.stringify(payload) } } };
  await githubRequest(token, `/gists/${gistId}`, { method: 'PATCH', body });
}

/* --- 公開カレンダー用Gist(平文・トークン不要で閲覧可能) §12.2/§12.4 --- */
async function findExistingPublicGistId(token) {
  const gists = await githubRequest(token, '/gists?per_page=100');
  const found = (gists || []).find((g) => g.description === GIST_PUBLIC_DESCRIPTION);
  return found ? found.id : null;
}

async function createPublicGist(token, payload) {
  const body = {
    description: GIST_PUBLIC_DESCRIPTION,
    public: false, // secret gist。URLを知っている人だけが閲覧できる
    files: { [GIST_PUBLIC_FILENAME]: { content: JSON.stringify(payload) } },
  };
  const gist = await githubRequest(token, '/gists', { method: 'POST', body });
  return gist.id;
}

async function updatePublicGist(token, gistId, payload) {
  const body = { files: { [GIST_PUBLIC_FILENAME]: { content: JSON.stringify(payload) } } };
  await githubRequest(token, `/gists/${gistId}`, { method: 'PATCH', body });
}

// syncPublicCalendar: publicEnabled が true のとき、公開Gistを確保(キャッシュ→検索→作成)してPATCHする
// 失敗しても例外を投げるのみ。呼び出し側(pushSync)でメイン同期の失敗扱いにしないこと
async function syncPublicCalendar() {
  const sync = loadSyncSettings();
  if (!sync || !sync.token || !sync.gistId) return;
  if (!state.settings.publicEnabled) return;
  const payload = buildPublicPayload(state, Date.now());
  let gistId = sync.publicGistId;
  if (!gistId) gistId = await findExistingPublicGistId(sync.token);
  if (!gistId) {
    gistId = await createPublicGist(sync.token, payload);
  } else {
    await updatePublicGist(sync.token, gistId, payload);
  }
  if (gistId !== sync.publicGistId) {
    saveSyncSettings({ ...loadSyncSettings(), publicGistId: gistId });
  }
}

// disablePublicCalendar: 公開OFF操作。先に公開Gistを空にしてから publicEnabled=false にする(§12.4)
async function disablePublicCalendar() {
  const sync = loadSyncSettings();
  if (sync && sync.token && sync.publicGistId) {
    try {
      await updatePublicGist(sync.token, sync.publicGistId, { v: 1, events: [] });
    } catch (e) {
      console.error('公開カレンダーの停止処理(Gist更新)に失敗しました', e);
      showToast('公開カレンダーの停止処理に失敗しました。時間をおいて再度お試しください');
    }
  }
  updateSettings({ publicEnabled: false });
}

let syncIndicator = 'unset'; // 'synced' | 'syncing' | 'offline' | 'unset' | 'error'
let syncIndicatorMessage = '';
let syncDebounceTimer = null;
let syncInProgress = false;

function setSyncIndicator(status, message) {
  syncIndicator = status;
  syncIndicatorMessage = message || '';
  // 編集中(シート表示中)は再描画しない: 入力欄やカラーピッカーからフォーカスを奪わないため
  if (!uiState.sheet) render();
}

function scheduleSync() {
  const sync = loadSyncSettings();
  if (!sync || !sync.token || !sync.gistId) return;
  if (syncDebounceTimer) clearTimeout(syncDebounceTimer);
  syncDebounceTimer = setTimeout(function tick() {
    // 編集中(シート表示中)は同期を延期し、閉じられてから実行する
    if (uiState.sheet) {
      syncDebounceTimer = setTimeout(tick, SYNC_DEBOUNCE_MS);
      return;
    }
    syncDebounceTimer = null;
    pushSync().catch((e) => console.error('同期(push)に失敗しました', e));
  }, SYNC_DEBOUNCE_MS);
}

function handleSyncError(e) {
  console.error('同期エラー', e);
  if (e instanceof SyncError) {
    if (e.code === 'network') {
      setSyncIndicator('offline', e.message);
    } else {
      setSyncIndicator('error', e.message);
    }
  } else {
    setSyncIndicator('error', 'エラーが発生しました');
  }
}

async function pushSync() {
  const sync = loadSyncSettings();
  if (!sync || !sync.token || !sync.gistId) return;
  if (!navigator.onLine) {
    setSyncIndicator('offline');
    return;
  }
  if (syncInProgress) return;
  syncInProgress = true;
  setSyncIndicator('syncing');
  try {
    const payload = await encryptData(state, sync.passphrase);
    await updateGist(sync.token, sync.gistId, payload);
    saveSyncSettings({ ...sync, lastSyncAt: Date.now() });
    setSyncIndicator('synced');
    // 公開カレンダーの更新: 失敗してもメイン同期は成功扱いのまま(§12.4)
    try {
      await syncPublicCalendar();
    } catch (e) {
      console.error('公開カレンダーの同期に失敗しました', e);
      setSyncIndicator('synced', '公開カレンダーの更新に失敗しました(次回同期時に再試行します)');
    }
  } catch (e) {
    handleSyncError(e);
  } finally {
    syncInProgress = false;
  }
}

async function pullSync() {
  const sync = loadSyncSettings();
  if (!sync || !sync.token || !sync.gistId) return;
  // 編集中(シート表示中)は取り込みをスキップ: 編集内容の巻き戻りや再描画を防ぐ
  if (uiState.sheet) {
    console.info('編集中のため自動同期(pull)をスキップしました');
    return;
  }
  if (!navigator.onLine) {
    setSyncIndicator('offline');
    return;
  }
  if (syncInProgress) return;
  syncInProgress = true;
  setSyncIndicator('syncing');
  try {
    const payload = await fetchGistPayload(sync.token, sync.gistId);
    let remoteData;
    try {
      remoteData = await decryptData(payload, sync.passphrase);
    } catch (e) {
      // 合言葉違い・破損: ローカルデータは絶対に上書きしない
      console.error('復号に失敗しました', e);
      setSyncIndicator('error', '合言葉が違うため同期できません');
      return;
    }
    const merged = mergeData(state, remoteData);
    const localChanged = JSON.stringify(merged) !== JSON.stringify(state);
    const remoteChanged = JSON.stringify(merged) !== JSON.stringify(remoteData);
    if (localChanged) {
      state = merged;
      saveState(state);
      render();
    }
    saveSyncSettings({ ...sync, lastSyncAt: Date.now() });
    setSyncIndicator('synced');
    if (remoteChanged) {
      syncInProgress = false; // pushSync の再入ガードで弾かれないよう先に解除する
      await pushSync(); // この中で公開カレンダーも更新される
    } else {
      // データ変更がなくても、公開カレンダー(テーマ色や表示仕様の変更分)は開くたびに最新化する
      syncPublicCalendar().catch((e2) => console.error('公開カレンダーの更新に失敗しました', e2));
    }
  } catch (e) {
    handleSyncError(e);
  } finally {
    syncInProgress = false;
  }
}

// startSync: 「同期を開始」ボタンの処理。既存Gistがあればpullしてマージ、なければ新規作成
async function startSync(token, passphrase) {
  setSyncIndicator('syncing');
  try {
    let gistId = await findExistingGistId(token);
    if (gistId) {
      const payload = await fetchGistPayload(token, gistId);
      let remoteData;
      try {
        remoteData = await decryptData(payload, passphrase);
      } catch (e) {
        throw new SyncError('decrypt', '合言葉が違います');
      }
      const merged = mergeData(state, remoteData);
      state = merged;
      saveState(state);
      render();
      saveSyncSettings({ token, passphrase, gistId, lastSyncAt: Date.now() });
      const encrypted = await encryptData(state, passphrase);
      await updateGist(token, gistId, encrypted);
    } else {
      const encrypted = await encryptData(state, passphrase);
      gistId = await createGist(token, encrypted);
      saveSyncSettings({ token, passphrase, gistId, lastSyncAt: Date.now() });
    }
    setSyncIndicator('synced');
    return { ok: true };
  } catch (e) {
    console.error('同期開始に失敗しました', e);
    const message = e && e.message ? e.message : '同期の開始に失敗しました';
    setSyncIndicator('error', message);
    return { ok: false, message };
  }
}

function stopSync() {
  clearSyncSettings();
  setSyncIndicator('unset');
}

async function requestNotificationPermission() {
  if (typeof Notification === 'undefined') {
    console.info('このブラウザは通知に対応していません');
    return false;
  }
  if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
    console.info('通知はhttps環境でのみ利用できます(file://等ではスキップ)');
    return false;
  }
  try {
    const result = await Notification.requestPermission();
    return result === 'granted';
  } catch (e) {

    return false;
  }
}

// processReminders: computeReminders の結果をもとに未通知分だけ Notification を発火する(副作用あり)
function processReminders(today) {
  if (!state.settings.notifyEnabled) return;
  if (typeof Notification === 'undefined' || Notification.permission !== 'granted') return;

  const reminders = computeReminders(state, today);
  const notified = cleanupNotifiedSet(loadNotifiedSet(), today);
  const oshiLabel = state.settings.oshiName || '推し';

  reminders.forEach((r) => {
    if (notified.has(r.id)) return;
    try {
      new Notification(`${oshiLabel}カレンダー`, { body: r.text });
    } catch (e) {
      console.error('通知の表示に失敗しました', e);
    }
    notified.add(r.id);
  });

  saveNotifiedSet(notified);
}

/* =========================================================
 * 8. render (テーマ導出 / 月グリッド / バナー / シート群)
 * ========================================================= */
function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// linkifyText: エスケープ済みテキスト中の https?:// のURLだけを安全な<a>に変換する
// 必ず先にescapeHtmlを通すこと。javascript:等は正規表現で最初から除外される
function linkifyText(str) {
  const escaped = escapeHtml(str);
  return escaped.replace(/(https?:\/\/[^\s<>&"']+(?:&amp;[^\s<>&"']+)*)/g,
    (url) => `<a href="${url}" target="_blank" rel="noopener noreferrer nofollow">${url}</a>`);
}

/* --- テーマ色導出(HSL操作) --- */
function hexToRgb(hex) {
  const clean = String(hex).replace('#', '');
  const full = clean.length === 3 ? clean.split('').map((c) => c + c).join('') : clean;
  const bigint = parseInt(full, 16);
  return { r: (bigint >> 16) & 255, g: (bigint >> 8) & 255, b: bigint & 255 };
}

function rgbToHex(r, g, b) {
  const toHex = (v) => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0');
  return `#${toHex(r)}${toHex(g)}${toHex(b)}`;
}

function rgbToHsl(r, g, b) {
  const rn = r / 255, gn = g / 255, bn = b / 255;
  const max = Math.max(rn, gn, bn), min = Math.min(rn, gn, bn);
  let h = 0, s = 0;
  const l = (max + min) / 2;
  if (max !== min) {
    const d = max - min;
    s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
    switch (max) {
      case rn: h = (gn - bn) / d + (gn < bn ? 6 : 0); break;
      case gn: h = (bn - rn) / d + 2; break;
      default: h = (rn - gn) / d + 4; break;
    }
    h /= 6;
  }
  return { h: h * 360, s: s * 100, l: l * 100 };
}

function hslToRgb(h, s, l) {
  const hn = ((h % 360) + 360) % 360 / 360;
  const sn = s / 100;
  const ln = l / 100;
  if (sn === 0) {
    const v = ln * 255;
    return { r: v, g: v, b: v };
  }
  const hue2rgb = (p, q, t) => {
    let tt = t;
    if (tt < 0) tt += 1;
    if (tt > 1) tt -= 1;
    if (tt < 1 / 6) return p + (q - p) * 6 * tt;
    if (tt < 1 / 2) return q;
    if (tt < 2 / 3) return p + (q - p) * (2 / 3 - tt) * 6;
    return p;
  };
  const q = ln < 0.5 ? ln * (1 + sn) : ln + sn - ln * sn;
  const p = 2 * ln - q;
  return {
    r: hue2rgb(p, q, hn + 1 / 3) * 255,
    g: hue2rgb(p, q, hn) * 255,
    b: hue2rgb(p, q, hn - 1 / 3) * 255,
  };
}

// mixWithWhite: 色を白と混ぜて淡くする(t=0で元色、t=1で白)。
// 明るい色でも白に振り切れず色味が残るため、淡色の導出はこちらを使う
function mixWithWhite(hex, t) {
  const { r, g, b } = hexToRgb(hex);
  return rgbToHex(r + (255 - r) * t, g + (255 - g) * t, b + (255 - b) * t);
}

function adjustLightness(hex, deltaPercent) {
  try {
    const { r, g, b } = hexToRgb(hex);
    const hsl = rgbToHsl(r, g, b);
    const newL = Math.max(0, Math.min(100, hsl.l + deltaPercent));
    const rgb = hslToRgb(hsl.h, hsl.s, newL);
    return rgbToHex(rgb.r, rgb.g, rgb.b);
  } catch (e) {
    console.error('色の計算に失敗しました', e);
    return hex;
  }
}

function mixHue(hexA, hexB) {
  try {
    const rgbA = hexToRgb(hexA);
    const rgbB = hexToRgb(hexB);
    const hslA = rgbToHsl(rgbA.r, rgbA.g, rgbA.b);
    const hslB = rgbToHsl(rgbB.r, rgbB.g, rgbB.b);
    const h = (hslA.h + hslB.h) / 2 + 30;
    const rgb = hslToRgb(h, 55, 72);
    return rgbToHex(rgb.r, rgb.g, rgb.b);
  } catch (e) {
    console.error('色の計算に失敗しました', e);
    return hexA;
  }
}

// defaultCategoryColors: テーマ2色から各カテゴリの標準色を導出する純関数
function defaultCategoryColors(primary, secondary) {
  return {
    event: adjustLightness(primary, -12),
    goods: primary,
    ticket: '#9ccc65', // 黄緑(テーマに依存しない固定既定色)
    stream: secondary,
    members: adjustLightness(secondary, -12),
    call: mixHue(primary, secondary),
    other: '#b8b8b8',
    anniversary: '#e8b04f', // 金色(テーマに依存しない固定既定色)
    personal: '#a8d5ba',
  };
}

// computeEffectiveColors: 設定の上書きを反映した実効色(カテゴリ/シフト)を返す純関数
function computeEffectiveColors(settings) {
  const s = settings || {};
  const catDefaults = defaultCategoryColors(s.themePrimary || '#f8b6c8', s.themeSecondary || '#a5d8e6');
  const catOverrides = s.categoryColors || {};
  const shiftOverrides = s.shiftColors || {};
  const cat = {};
  Object.keys(catDefaults).forEach((key) => { cat[key] = catOverrides[key] || catDefaults[key]; });
  const shift = {};
  Object.keys(SHIFT_COLOR_DEFAULTS).forEach((code) => { shift[code] = shiftOverrides[code] || SHIFT_COLOR_DEFAULTS[code]; });
  return { cat, shift };
}

function applyTheme(settings) {
  const root = document.documentElement.style;
  const primary = (settings && settings.themePrimary) || '#f8b6c8';
  const secondary = (settings && settings.themeSecondary) || '#a5d8e6';
  root.setProperty('--primary', primary);
  root.setProperty('--secondary', secondary);
  root.setProperty('--primary-dark', adjustLightness(primary, -15));
  root.setProperty('--primary-light', mixWithWhite(primary, 0.55));
  root.setProperty('--secondary-dark', adjustLightness(secondary, -15));
  root.setProperty('--secondary-light', mixWithWhite(secondary, 0.55));
  root.setProperty('--bg', mixWithWhite(primary, 0.88));
  root.setProperty('--bg-top', mixWithWhite(primary, 0.3));
  root.setProperty('--bg-bottom', mixWithWhite(secondary, 0.3));
  const effective = computeEffectiveColors(settings);
  Object.keys(effective.cat).forEach((key) => {
    root.setProperty(CATEGORIES[key].colorVar, effective.cat[key]);
  });
  Object.keys(effective.shift).forEach((code) => {
    root.setProperty(`--shift-${code}`, effective.shift[code]);
  });
  root.setProperty('--memo-color', (settings && settings.memoColor) || adjustLightness(primary, -30));
  root.setProperty('--today-border', (settings && settings.todayColor) || adjustLightness(primary, -25));
}

  toast: null,
  dayLongTermOpen: false, // 日詳細シート内の「期間中の長期予定」折りたたみの開閉
  shareOnSaleSelection: [], // 販売期間の共有シートでチェック中のカテゴリ(v37)
};
let toastTimer = null;

function setUiState(partial) {
  uiState = { ...uiState, ...partial };
  render();
}

function setUiStateSilent(partial) {
  uiState = { ...uiState, ...partial };
}

function showToast(message) {
  uiState = { ...uiState, toast: message };
  render();
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    uiState = { ...uiState, toast: null };
    render();
  }, 3500);
}

// isDraftDirty: 予定フォームの下書きが「開いた時点」から変更されているかを返す純関数。
// 変更がある間は外側タップ/✕/Escで閉じず、キャンセルボタンでのみ閉じられる(誤タップによる入力消失防止)
function isDraftDirty(draft, original) {
  if (!draft || !original) return false;
  const fields = ['kind', 'category', 'title', 'startDate', 'endDate', 'time', 'endTime', 'memo', 'public', 'publicMemo', 'longTerm'];
  return fields.some((f) => draft[f] !== original[f]);
}

// requestCloseSheet: シートを閉じる要求。入力中の予定フォームだけはブロックして案内を出す
function requestCloseSheet() {
  if (uiState.sheet === 'form' && isDraftDirty(uiState.editingEvent, uiState.formOriginal)) {
    showToast('入力中です。閉じるには「キャンセル」を押してください');
    return;
  }
  setUiState({ sheet: null, editingEvent: null, formOriginal: null, formErrors: {}, selectedEventId: null });
}

function createDraftEvent(dateStr) {
  return {
    id: null,
    kind: 'oshi',
    category: 'event',
    title: '',
    startDate: dateStr,
    endDate: dateStr,
    time: '',
    endTime: '',
    memo: '',
    public: false,
    publicMemo: '',
    longTerm: false,
  };
}

/* --- render本体 --- */
function render() {
  applyTheme(state.settings);
  const root = document.getElementById('app');
  root.innerHTML = renderApp();
}

function fullRender() {
  render();
  processReminders(todayStr());
}

function renderApp() {
  return `
    ${renderHeader()}
    ${renderNavBar()}
    ${renderTodaySection()}
    ${renderMonthlyEventSection()}
    ${renderLongTermSection()}
    ${renderCalendar()}
    ${renderSheetOverlay()}
    ${renderToast()}
  `;
}

function renderSyncIndicatorLabel() {
  const map = {
    synced: '● 同期済み',
    syncing: '↻ 同期中',
    offline: '⚠ オフライン',
    unset: '− 未設定',
    error: '⚠ エラー',
  };
  return map[syncIndicator] || map.unset;
}

function renderHeader() {
  const oshiName = state.settings.oshiName || '推し';
  return `
    <header class="app-header">
      <div class="header-top">
        <h1>${escapeHtml(oshiName)}カレンダー</h1>
        <button type="button" class="icon-btn" data-action="open-settings" aria-label="設定" title="設定">⚙</button>
      </div>
    </header>
  `;
}

// renderNavBar: 月移動・今日ボタン・同期インジケータをまとめた操作行(v37。公開ページのv36と同じ考え方)。
// カレンダーを見ながら月を移動できるよう、スクロールしても画面上部に貼り付く。
// **`<header>`の中に置いてはいけない**: position:stickyは親要素の範囲でしか効かないため、
// ヘッダー内に置くとヘッダーがスクロールアウトした時点で一緒に消える。#app直下(ヘッダーの兄弟)に置く
function renderNavBar() {
  const monthLabel = formatMonthLabel(uiState.year, uiState.month);
  const syncTitle = syncIndicatorMessage || 'タップで手動同期';
  return `
    <div class="nav-bar">
      <div class="header-nav">
        <button type="button" class="nav-btn" data-action="prev-month" aria-label="前の月">◀</button>
        <span class="month-label">${escapeHtml(monthLabel)}</span>
        <button type="button" class="nav-btn" data-action="next-month" aria-label="次の月">▶</button>
        <button type="button" class="today-btn" data-action="go-today">今日</button>
        <button type="button" class="sync-indicator" data-action="manual-sync" title="${escapeHtml(syncTitle)}">${renderSyncIndicatorLabel()}</button>
      </div>
    </div>
  `;
}

// renderTodaySection: ヘッダー直下に出す「今日の予定」専用カード(v24。v32でお知らせ(最終日系
// リマインドのみ)をカード内に統合し、カード外の独立バナー(旧renderReminderBanner)は廃止した)。
// 今日固定(表示中の月=uiState.year/monthに依存しない)。今日のシフトと今日の予定(記念日含む)を表示する。
// お知らせは見出し行の下・シフト行の下・予定リストの上に表示し、filterDeadlineReminders で
// 最終日系(lastday-eve/lastday)のみに絞る(配信開始・記念日などは今日の予定リスト側と重複するため
// 表示しない。ブラウザ通知processRemindersは従来通り全種類を通知する)。お知らせが0件なら何も出さず
// 高さも取らない。予定・シフト・お知らせが全て0件のときだけ「今日の予定はありません」を表示する。
// v40: お知らせも他の一覧アイテムと同じくタップで個別詳細シートを開けるようにした。
// buildTodayReminderViews で「元の予定が今も存在するか」を判定し、存在するものだけ
// <button data-action="open-event"> にする(存在しないものは従来どおり<div>のまま。
// タップしても何も起きない見た目を作らないため)
function renderTodaySection() {
  const today = todayStr();
  const agenda = todayAgenda(state, today);
  const shiftDef = agenda.shift ? SHIFT_DEFS[agenda.shift.code] : null;
  const shiftRow = shiftDef
    ? `<div class="today-shift-row">💼 ${escapeHtml(shiftDef.label)}${shiftDef.time ? `(${escapeHtml(shiftDef.time)})` : ''}</div>`
    : '';
  const reminders = filterDeadlineReminders(computeReminders(state, today));
  const reminderViews = buildTodayReminderViews(state, reminders);
  const reminderHtml = reminderViews.length
    ? `<div class="today-reminder-list">${reminderViews.map((r) => (r.tappable
        ? `<button type="button" class="today-reminder is-tappable" data-action="open-event" data-id="${escapeHtml(r.eventId)}">`
          + `<span class="today-reminder-text">${escapeHtml(r.text)}</span>`
          + `<span class="today-reminder-chevron" aria-hidden="true">›</span>`
          + `</button>`
        : `<div class="today-reminder"><span class="today-reminder-text">${escapeHtml(r.text)}</span></div>`)).join('')}</div>`
    : '';
  const body = agenda.events.length
    ? `<div class="longterm-list">${agenda.events.map((ev) => renderLongTermItem(ev)).join('')}</div>`
    : (shiftDef || reminderViews.length ? '' : `<p class="empty-hint">今日の予定はありません</p>`);
  return `
    <section class="longterm-section">
      <h2 class="longterm-title">📅 今日の予定<span class="today-date-label">${escapeHtml(formatDateLabel(agenda.dateStr))}</span></h2>
      ${shiftRow}
      ${reminderHtml}
      ${body}
      <button type="button" class="btn-secondary today-share-btn" data-action="share-today-image">今日の予定をXで共有</button>
    </section>
  `;
}

// renderMonthlyEventSection: 「📌 販売期間中 一覧」のすぐ上に出す「今月のイベント予定」枠。
// 表示中の月に重なる category==='event' の予定を表示する(longTermかどうかは問わない)。
// 該当0件の月はセクションごと非表示。タップでその予定の個別詳細シートを開く
function renderMonthlyEventSection() {
  const items = listMonthlyEvents(state, uiState.year, uiState.month);
  if (!items.length) return '';
  const today = parseDateStr(todayStr());
  const isCurrentMonth = uiState.year === today.y && uiState.month === today.m;
  const heading = isCurrentMonth
    ? `今月のイベント予定${EVENT_SECTION_SUFFIX}`
    : `${uiState.month}月のイベント予定${EVENT_SECTION_SUFFIX}`;
  return `
    <section class="longterm-section">
      <h2 class="longterm-title">${escapeHtml(heading)}</h2>
      <div class="longterm-list">
        ${items.map((ev) => renderLongTermItem(ev)).join('')}
      </div>
    </section>
  `;
}

// renderLongTermSection: カレンダー上部の長期予定一覧。全件表示(月による絞り込みなし)。
// ただし終了した予定(endDate < today)は一覧から除外する(最終日当日は表示する)。
// タップでその予定の個別詳細シートを開く。この一覧のみ showPurchased:true を渡し、
// 購入済みチェック・赤いハンコ・薄色表示を有効にする(他2箇所の一覧では表示しない)
function renderLongTermSection() {
  const items = listLongTermEvents(state, todayStr());
  if (!items.length) return '';
  // 共有ボタンは「画像にできる予定」が1件以上あるときだけ出す
  // (自分の予定・FB通話・公開チェックなしの限定配信しか無い場合は出さない)
  const shareOptions = listOnSaleShareCategories(state, todayStr());
  const shareBtn = shareOptions.length
    ? `<button type="button" class="btn-secondary today-share-btn" data-action="share-onsale-image">販売期間をXで共有</button>`
    : '';
  return `
    <section class="longterm-section">
      <h2 class="longterm-title">📌 販売期間中 一覧（締切日が近い順）</h2>
      <div class="longterm-list">
        ${items.map((ev) => renderLongTermItem(ev, { showPurchased: true })).join('')}
      </div>
      ${shareBtn}
    </section>
  `;
}

// renderLongTermItem: 「今月のイベント予定」「📌 販売期間中 一覧」「📅 今日の予定」の3箇所で共用する一覧アイテム。
// options.showPurchased が true のとき(=「📌 販売期間中 一覧」からの呼び出しのみ)だけ、
// 購入済みチェックボックス・赤いハンコ・薄色表示を追加する。タップ領域は内側の
// <button class="longterm-item-tap"> に限定し(外側はHTML的に正しい<div>)、チェックボックスは
// その外の<span>に置くことで、チェック操作がアイテム全体のタップ(open-event)に吸われないようにする
function renderLongTermItem(ev, options) {
  const opts = options || {};
  const showPurchased = opts.showPurchased === true;
  const cat = CATEGORIES[ev.category] || CATEGORIES.other;
  const purchased = showPurchased && ev.purchased === true;
  const purchaseHtml = showPurchased
    ? `
      <span class="longterm-purchase">
        <label class="longterm-purchase-label">
          <input type="checkbox" data-purchase-toggle="${escapeHtml(ev.id)}" ${ev.purchased === true ? 'checked' : ''}>
          購入済み
        </label>
      </span>
    `
    : '';
  const stampHtml = purchased ? `<span class="purchased-stamp">購入済</span>` : '';
  return `
    <div class="longterm-item${purchased ? ' is-purchased' : ''}">
      <button type="button" class="longterm-item-tap" data-action="open-event" data-id="${escapeHtml(ev.id)}">
        <span class="longterm-bar" style="background:var(${cat.colorVar})"></span>
        <span class="longterm-body">
          <span class="longterm-item-title">${escapeHtml(ev.title)}</span>
          <span class="longterm-item-schedule">${escapeHtml(cat.label)}・${escapeHtml(formatEventScheduleWithDate(ev))}</span>
        </span>
      </button>
      ${purchaseHtml}${stampHtml}
    </div>
  `;
}

function renderCalendar() {
  const weeks = monthGrid(uiState.year, uiState.month);
  const today = todayStr();
  return `
    <div class="calendar">
      <div class="weekday-row">
        ${WEEKDAY_LABELS.map((w, i) => `<div class="weekday${i === 0 ? ' sun' : ''}${i === 6 ? ' sat' : ''}">${w}</div>`).join('')}
      </div>
      <div class="month-grid">
        ${weeks.map((week) => week.map((cell) => renderDayCell(cell, today)).join('')).join('')}
      </div>
      ${renderEmptyState()}
    </div>
  `;
}

function renderEmptyState() {
  const monthEvents = state.events.filter((ev) => !ev.deleted && isEventInMonth(ev, uiState.year, uiState.month));
  if (monthEvents.length > 0) return '';
  return `<p class="empty-state">予定はまだありません。日付をタップして追加してください🌸</p>`;
}

function renderDayCell(cell, today) {
  const dayNum = parseDateStr(cell.dateStr).d;
  const dayEvents = eventsOnDay(state, cell.dateStr);
  // 長期予定はチップにせず、マス下部の細いラインだけで示す(視認性のため。詳細は日タップか上部一覧から)
  const normalEvents = dayEvents.filter((ev) => ev.longTerm !== true);
  const longTermEvents = dayEvents.filter((ev) => ev.longTerm === true);
  const shift = state.shifts[cell.dateStr];
  const classes = ['day-cell'];
  if (!cell.inMonth) classes.push('outside');
  // 過ぎた日はひと目で分かるように薄く・彩度を落とす(v39。表示だけの変更でデータには触れない)
  if (compareDates(cell.dateStr, today) < 0) classes.push('past');
  if (cell.dateStr === today) classes.push('today');
  const maxChips = 3;
  const shown = normalEvents.slice(0, maxChips);
  const extra = normalEvents.length - shown.length;
  return `
    <button type="button" class="${classes.join(' ')}" data-action="open-day" data-date="${cell.dateStr}">
      <div class="day-cell-top">
        <span class="day-num">${dayNum}</span>
        <span class="day-badges">
          ${shift && !shift.deleted ? renderShiftBadge(shift) : ''}
          ${isBlockedDay(state, cell.dateStr) ? '<span class="blocked-badge">申不可</span>' : ''}
        </span>
      </div>
      <div class="chip-list">
        ${shown.map((ev) => renderChip(ev)).join('')}
        ${extra > 0 ? `<div class="chip chip-more">+${extra}</div>` : ''}
      </div>
      ${longTermEvents.length ? `<div class="period-lines">${longTermEvents.slice(0, 3).map((ev) => {
        const cat = CATEGORIES[ev.category] || CATEGORIES.other;
        return `<span class="period-line" style="background:var(${cat.colorVar})"></span>`;
      }).join('')}</div>` : ''}
    </button>
  `;
}

function renderShiftBadge(shift) {
  const def = SHIFT_DEFS[shift.code];
  if (!def) return '';
  // カレンダーのマスは幅が狭いので、長いラベルは短縮表記(badge)を使う
  return `<span class="shift-badge shift-${escapeHtml(shift.code)}">${escapeHtml(def.badge || def.label)}</span>`;
}

function renderChip(ev) {
  const cat = CATEGORIES[ev.category] || CATEGORIES.other;
  return `<div class="chip" style="background:var(${cat.colorVar})">${escapeHtml(ev.title)}</div>`;
}

function renderSheetOverlay() {
  if (!uiState.sheet) return '';
  let content = '';
  if (uiState.sheet === 'day') content = renderDaySheet();
  else if (uiState.sheet === 'form') content = renderEventFormSheet();
  else if (uiState.sheet === 'settings') content = renderSettingsSheet();
  else if (uiState.sheet === 'event') content = renderEventDetailSheet();
  else if (uiState.sheet === 'share-onsale') content = renderShareOnSaleSheet();
  return `
    <div class="sheet-backdrop">
      <div class="sheet" data-sheet="${uiState.sheet}">${content}</div>
    </div>
  `;
}

function renderDaySheet() {
  const dateStr = uiState.selectedDate;
  const dayEvents = eventsOnDay(state, dateStr)
    .slice()
    .sort((a, b) => compareDates(a.startDate, b.startDate) || a.title.localeCompare(b.title));
  const normalEvents = dayEvents.filter((ev) => ev.longTerm !== true);
  const longTermEvents = dayEvents.filter((ev) => ev.longTerm === true);
  const shift = state.shifts[dateStr];
  const blocked = isBlockedDay(state, dateStr);
  const hasNormal = normalEvents.length > 0;
  const hasLongTerm = longTermEvents.length > 0;
  return `
    <div class="sheet-header">
      <h2>${escapeHtml(formatDateLabel(dateStr))}</h2>
      <button type="button" class="icon-btn" data-action="close-sheet" aria-label="閉じる">✕</button>
    </div>
    <div class="sheet-body">
      <section class="shift-picker">
        <h3>シフト</h3>
        <div class="shift-buttons">${renderShiftButtons(shift)}</div>
      </section>
      <section class="blocked-picker">
        <h3>FB通話</h3>
        <button type="button" class="blocked-btn${blocked ? ' active' : ''}" data-action="toggle-blocked" data-date="${dateStr}" aria-pressed="${blocked ? 'true' : 'false'}">
          ${blocked ? '🚫 申請不可日にしています' : '申請不可日にする'}
        </button>
      </section>
      <section class="day-events">
        <h3>予定</h3>
        ${hasNormal ? normalEvents.map((ev) => renderDayEventItem(ev)).join('') : ''}
        ${!hasNormal && !hasLongTerm ? '<p class="empty-hint">予定はありません</p>' : ''}
        ${hasLongTerm ? renderDayLongTermToggle(longTermEvents) : ''}
        <button type="button" class="add-event-btn" data-action="add-event" data-date="${dateStr}">+ 予定を追加</button>
      </section>
    </div>
  `;
}

// renderDayLongTermToggle: 日詳細シート内、通常予定の下に出す長期予定の折りたたみ行
function renderDayLongTermToggle(longTermEvents) {
  const open = uiState.dayLongTermOpen === true;
  return `
    <button type="button" class="longterm-collapse" data-action="toggle-day-longterm">📌 期間中の長期予定 ${longTermEvents.length}件 ${open ? '▾' : '▸'}</button>
    ${open ? longTermEvents.map((ev) => renderDayEventItem(ev)).join('') : ''}
  `;
}

// renderEventDetailSheet: 長期予定一覧タップで開く個別詳細シート。既存の日詳細カードを1件分再利用する
function renderEventDetailSheet() {
  const ev = state.events.find((x) => x.id === uiState.selectedEventId && !x.deleted);
  return `
    <div class="sheet-header">
      <h2>予定の詳細</h2>
      <button type="button" class="icon-btn" data-action="close-sheet" aria-label="閉じる">✕</button>
    </div>
    <div class="sheet-body">
      ${ev ? renderDayEventItem(ev) : '<p class="empty-hint">この予定は見つかりませんでした</p>'}
    </div>
  `;
}

// renderShareOnSaleSheet: 画像にする期間を選ぶシート(v34、v37でチェック式に変更)。
// いま画像にできる予定に含まれるカテゴリをチェックボックスで並べ、チェックした分だけ
// **カテゴリごとに1枚ずつ**画像を作ってまとめて共有する。
// 「すべて(1枚にまとめる)」は従来通り全カテゴリを1枚に詰めた画像で、他と同じく選択肢の1つ。
// チェックの状態は uiState.shareOnSaleSelection が持ち、切り替えでは再描画しない
// (シート内で全画面render()を呼ぶとフォーカスが飛ぶため。§8のハマりどころ参照)
function renderShareOnSaleSheet() {
  const options = listOnSaleShareCategories(state, todayStr());
  const selection = Array.isArray(uiState.shareOnSaleSelection) ? uiState.shareOnSaleSelection : [];
  if (!options.length) {
    return `
      <div class="sheet-header">
        <h2>どの期間を画像にしますか？</h2>
        <button type="button" class="icon-btn" data-action="close-sheet" aria-label="閉じる">✕</button>
      </div>
      <div class="sheet-body"><p class="empty-hint">画像にできる販売期間の予定がありません</p></div>
    `;
  }
  const items = options.map((opt) => `
    <label class="share-category-item">
      <input type="checkbox" data-share-category="${escapeHtml(opt.key)}" ${selection.indexOf(opt.key) !== -1 ? 'checked' : ''}>
      <span class="share-category-label">${escapeHtml(opt.key === 'all' ? 'すべて(1枚にまとめる)' : `${opt.label}期間`)}</span>
      <span class="share-category-count">${opt.count}件</span>
    </label>
  `).join('');
  return `
    <div class="sheet-header">
      <h2>どの期間を画像にしますか？</h2>
      <button type="button" class="icon-btn" data-action="close-sheet" aria-label="閉じる">✕</button>
    </div>
    <div class="sheet-body">
      <div class="share-category-list">${items}</div>
      <p class="share-note">
        チェックした分だけ画像を作ってXの投稿画面を開きます(1枚ずつ別の画像になります)。<br>
        Xの投稿に添付できるのは1回につき4枚までです。<br>
        自分の予定・シフト・メモは画像に入りません。
      </p>
      <button type="button" class="btn-primary share-run-btn" data-action="share-onsale-run">画像を作ってXで共有</button>
    </div>
  `;
}

// toggleShareCategory: チェックの入り切りを反映した新しい配列を返す純関数(不変更新)。
// 同じキーを二重に持たない。null/非配列を渡しても落ちない
function toggleShareCategory(selection, key, checked) {
  const current = Array.isArray(selection) ? selection : [];
  if (!key) return current.slice();
  const without = current.filter((k) => k !== key);
  return checked ? without.concat([key]) : without;
}

// defaultShareOnSaleSelection: シートを開いたときの既定チェック。
// カテゴリ別の画像を全部作る状態(=「すべて(1枚にまとめる)」以外を全部チェック)から始める
function defaultShareOnSaleSelection(options) {
  return (options || []).filter((opt) => opt.key !== 'all').map((opt) => opt.key);
}

function renderShiftButtons(shift) {
  const current = shift && !shift.deleted ? shift.code : null;
  const buttons = SHIFT_CODE_ORDER.map((code) => {
    const def = SHIFT_DEFS[code];
    const active = current === code ? ' active' : '';
    return `<button type="button" class="shift-btn${active}" data-action="set-shift" data-code="${code}">${escapeHtml(def.label)}</button>`;
  });
  buttons.push(`<button type="button" class="shift-btn${!current ? ' active' : ''}" data-action="set-shift" data-code="none">なし</button>`);
  return buttons.join('');
}

function renderDayEventItem(ev) {
  const cat = CATEGORIES[ev.category] || CATEGORIES.other;
  const schedule = formatEventSchedule(ev);
  return `
    <div class="event-item" style="border-left-color:var(${cat.colorVar})">
      <div class="event-item-main">
