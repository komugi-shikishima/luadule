# =============================================================
# ルアジュール Discord通知ワークフロー (v4)
# リポジトリに「.github/workflows/notify.yml」という名前で保存します。
#
# 起動: 毎日 0時 / 6時 / 12時 / 18時(日本時間)の1日4回だけ。
#   起動すると「その6時間の間に送るもの」を先に洗い出し、送る時刻まで待ってから送ります。
#   送るものが無くなった時点で終了します(v3までの30分ごとの起動は廃止)。
#   送る直前に毎回データ置き場を読み直すので、その時点の最新の予定で通知します。
#
# 送るもの:
#  - 朝・昼・夜のダイジェスト(時刻はアプリの ⚙設定 →「通知」で変更。-1=送らない)
#    朝・昼 … 今日の予定(長期予定は除く)+ 最終日のお知らせ
#              ※1日と月末の朝だけ「いま販売中のもの」一覧が付きます
#    夜   … 明日が最終日のお知らせ・明日のシフト・明日の予定(対象が無ければ送りません)
#  - 開始時刻がある予定の「30分前」リマインド(⏰)
#
# 必要なSecrets(リポジトリのSettings → Secrets and variables → Actions):
#   LUADULE_GIST_ID    … データ置き場(oshical-sync-v1)のGist ID
#   LUADULE_PASSPHRASE … アプリで決めた合言葉
#   LUADULE_WEBHOOK    … DiscordのWebhook URL
#
# ※Actionsタブから手動実行(Run workflow)すると、時刻に関係なく朝の通知を1回送ります
# ※起動が数分遅れることがあります。遅れて起動した場合、その間に送るはずだった分は起動直後にまとめて送ります
# ※起動の合間(例: 13時)に新しく追加した予定の⏰30分前リマインドは、次の起動(18時)以降の分から有効になります
# =============================================================
name: Luadule Discord Notify

on:
  schedule:
    # UTC 15/21/3/9時 = 日本時間 0/6/12/18時
    - cron: '0 3,9,15,21 * * *'
  workflow_dispatch: # 手動実行(テスト用・常に朝の通知を送る)

permissions:
  contents: write

# 同じ枠を2つのジョブが担当して二重送信するのを防ぐ。
# 起動が大幅に遅れて枠がずれた場合や、失敗ジョブの再実行が重なった場合に効く
concurrency:
  group: luadule-notify
  cancel-in-progress: true

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 送る時刻まで待つ方式のため長め(GitHubの上限)。通常は数分〜数時間で自然終了する
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Send Discord notification
        env:
          GIST_ID: ${{ secrets.LUADULE_GIST_ID }}
          PASSPHRASE: ${{ secrets.LUADULE_PASSPHRASE }}
          WEBHOOK: ${{ secrets.LUADULE_WEBHOOK }}
          FORCE_MODE: ${{ github.event_name == 'workflow_dispatch' && 'morning' || '' }}
        run: |
          cat > /tmp/notify.mjs << 'NOTIFY_EOF'
          'use strict';
          // ルアジュール通知スクリプト v4(アプリ本体 index.html と同じ暗号形式・表示ルール)
          //
          // v3からの変更点:
          //  1) 30分ごとの起動を廃止し、1日4回(JST 0/6/12/18時)の「6時間の枠」を担当する方式にした。
          //     起動すると枠内に送るべきタスク(ダイジェスト/⏰30分前リマインド)を洗い出し、
          //     その時刻まで待って(sleep)から送る。送るタスクが無くなったら即終了する。
          //     送信の直前に毎回データ置き場を読み直すので「通知と同じタイミングで更新確認」になる。
          //  2) ダイジェストの中身を絞った。以前は期間中の予定を毎日すべて並べていたが、
          //     長期予定(longTerm===true)はアプリの「今日の予定」カードと同じ基準で除外する。
          //     残るのは「その日の予定」と「最終日のお知らせ」のみ。
          //     ただし月初(1日)と月末(その月の最終日)の朝だけ「いま販売中のもの」一覧を添える。
          //  3) 「今日から!」(🎪)のお知らせは廃止した(その日の予定として出るため重複)。
          import { readFileSync } from 'fs';

          const GIST_ID = process.env.GIST_ID || '';
          const PASSPHRASE = process.env.PASSPHRASE || '';
          const WEBHOOK = process.env.WEBHOOK || '';
          const TEST_FILE = process.env.TEST_FILE || '';   // テスト用: 暗号化ペイロードJSONのパス
          const FORCE_MODE = process.env.FORCE_MODE || ''; // 'morning' | 'noon' | 'evening'
          const TEST_NOW = process.env.TEST_NOW || '';     // テスト用: 現在時刻(epoch ms)の上書き
          const DRY_RUN = process.env.DRY_RUN === '1';     // テスト用: Discordに送らず表示のみ
          const NO_SLEEP = process.env.NO_SLEEP === '1';   // テスト用: 待ち時間を実際には待たず時計だけ進める
          const PLAN_ONLY = process.env.PLAN_ONLY === '1'; // テスト用: 枠内のタスク一覧だけ出して終了

          const GIST_FILENAME = 'oshical.enc.json';
          const PBKDF2_ITERATIONS = 310000;
          const DEFAULT_MORNING_HOUR = 7;
          const DEFAULT_NOON_HOUR = 12;
          const DEFAULT_EVENING_HOUR = 20;
          const WINDOW_HOURS = 6;        // 1回の起動が担当する時間の長さ(0-6時/6-12時/12-18時/18-24時)
          const SOON_BEFORE_MIN = 30;    // ⏰リマインドを送る「開始の何分前か」
          const SOON_STALE_MIN = 20;     // ⏰が遅れた場合の許容(これ以上遅れたら送らない。開始後の「あと約0分」防止)
          const MAX_LOOPS = 100;         // 無限ループ保険(1枠で処理するタスク数の上限)
          const MAX_RETRY = 3;           // 通信失敗時のリトライ回数(GitHub API / Discord 共通)
          const RETRY_WAIT_MS = 5000;    // リトライの待ち時間(回数に応じて伸ばす)
          const DISCORD_MAX_CHARS = 1900; // Discordの1メッセージ上限(2000)より少し手前で分割する
          // index.html の SHIFT_DEFS と同一に保つこと。
          // 'hw' は細分化前(v34まで)の「休出」。既存データの表示のために残している
          const SHIFT_DEFS = {
            '1': { label: '①', time: '7:00–15:00' },
            '2': { label: '②', time: '15:00–22:15' },
            '3': { label: '③', time: '22:15–翌7:00' },
            off: { label: '休み', time: '' },
            paid: { label: '有給', time: '' },
            hw: { label: '休出', time: '' },
            hw1: { label: '休出①', time: '7:00–15:00' },
            hw2: { label: '休出②', time: '15:00–22:15' },
            hw3: { label: '休出③', time: '22:15–翌7:00' },
          };
          const CAT_LABELS = {
            event: 'イベント', goods: 'グッズ販売', ticket: 'チケット販売', stream: '配信', members: '限定配信',
            call: 'FB通話', other: 'その他', anniversary: '記念日', personal: '自分の予定',
          };
          const WEEKDAYS = ['日', '月', '火', '水', '木', '金', '土'];

          function b64ToBytes(b64) { return new Uint8Array(Buffer.from(b64, 'base64')); }

          async function decryptData(payload, passphrase) {
            if (!payload || payload.v !== 1 || !payload.salt || !payload.iv || !payload.data) {
              throw new Error('データ形式が不正です');
            }
            const enc = new TextEncoder();
            const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(passphrase), 'PBKDF2', false, ['deriveKey']);
            const key = await crypto.subtle.deriveKey(
              { name: 'PBKDF2', salt: b64ToBytes(payload.salt), iterations: PBKDF2_ITERATIONS, hash: 'SHA-256' },
              keyMaterial, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
            );
            try {
              const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64ToBytes(payload.iv) }, key, b64ToBytes(payload.data));
              return JSON.parse(new TextDecoder().decode(plain));
            } catch (e) {
              throw new Error('合言葉が違うか、データが壊れています');
            }
          }

          async function fetchEncryptedPayload() {
            if (TEST_FILE) return JSON.parse(readFileSync(TEST_FILE, 'utf8'));
            if (!GIST_ID) throw new Error('LUADULE_GIST_ID が設定されていません');
            const res = await fetch(`https://api.github.com/gists/${encodeURIComponent(GIST_ID)}`, {
              headers: { Accept: 'application/vnd.github+json' },
            });
            if (!res.ok) throw new Error(`データ置き場の取得に失敗しました(${res.status})`);
            const gist = await res.json();
            const file = gist.files && gist.files[GIST_FILENAME];
            if (!file || typeof file.content !== 'string') throw new Error(`データ置き場に ${GIST_FILENAME} が見つかりません`);
            return JSON.parse(file.content);
          }

          // loadData: データ置き場を読み直して復号する。送信の直前に毎回呼ぶ(=通知と同じタイミングで更新確認)。
          // 1日4回しか起動しない方式なので、一時的な通信エラーで枠まるごと落とさないようリトライする。
          // 合言葉違い・データ破損は何度やっても直らないのでリトライしない
          async function loadData() {
            let lastError = null;
            for (let attempt = 1; attempt <= MAX_RETRY; attempt++) {
              try {
                return await decryptData(await fetchEncryptedPayload(), PASSPHRASE);
              } catch (e) {
                lastError = e;
                if (/合言葉|データ形式/.test(e.message)) throw e;
                console.warn(`データ取得に失敗しました(${attempt}/${MAX_RETRY}): ${e.message}`);
                if (attempt < MAX_RETRY) await sleep(RETRY_WAIT_MS * attempt);
              }
            }
            throw lastError;
          }

          // --- 日付ユーティリティ(JST基準・文字列ベース) ---
          // jstNow()が返すDateは「UTCの読み方をするとJSTの値になる」ようにずらしたもの。
          // 以降のgetUTC*/Date.UTC()はすべてこのずらした時間軸の上で一貫して扱う
          let CLOCK_OFFSET_MS = 0; // NO_SLEEP のテスト時だけ、待った分を仮想的に進めるために使う
          function jstNow() {
            const base = TEST_NOW ? Number(TEST_NOW) : Date.now();
            return new Date(base + CLOCK_OFFSET_MS + 9 * 3600 * 1000);
          }
          function toDateStr(d) {
            return `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, '0')}-${String(d.getUTCDate()).padStart(2, '0')}`;
          }
          function addDaysStr(s, n) {
            const [y, m, d] = s.split('-').map(Number);
            return toDateStr(new Date(Date.UTC(y, m - 1, d + n)));
          }
          function inRange(x, a, b) { return x >= a && x <= b; }
          // isLeapYear: うるう年(2月29日が存在する年)かどうかを判定する純関数(index.htmlと同一仕様)
          function isLeapYear(year) { return (year % 4 === 0 && year % 100 !== 0) || year % 400 === 0; }
          // occursOnDay: 指定した日にその予定が表示されるかを判定する純関数(index.htmlと同一仕様)。
          // anniversary(記念日)以外は従来通り inRange による期間内判定。
          // anniversary は startDate の月日が dateStr の月日と一致すれば年を問わず毎年表示する。
          // 例外: startDate が 02-29(うるう日)の記念日は、2月29日が存在しない平年では 02-28 に表示する
          function occursOnDay(e, dateStr) {
            if (!e || !dateStr) return false;
            if (e.category !== 'anniversary') return inRange(dateStr, e.startDate, e.endDate);
            if (!e.startDate) return false;
            const [, sm, sd] = e.startDate.split('-').map(Number);
            const [ty, tm, td] = dateStr.split('-').map(Number);
            if (sm === tm && sd === td) return true;
            if (sm === 2 && sd === 29 && tm === 2 && td === 28) return !isLeapYear(ty);
            return false;
          }
          // isFirstDayOfMonth / isLastDayOfMonth: 月初(1日)・月末(その月の最終日)かどうか
          function isFirstDayOfMonth(dateStr) { return dateStr.split('-')[2] === '01'; }
          function isLastDayOfMonth(dateStr) { return addDaysStr(dateStr, 1).split('-')[2] === '01'; }
          function fmtMD(s) { const p = s.split('-').map(Number); return `${p[1]}/${p[2]}`; }
          function weekday(s) {
            const [y, m, d] = s.split('-').map(Number);
            return WEEKDAYS[new Date(Date.UTC(y, m - 1, d)).getUTCDay()];
          }
          function settingHour(value, fallback) {
            return (Number.isInteger(value) && value >= -1 && value <= 23) ? value : fallback;
          }
          // 予定の開始時刻(JST)を、jstNowと同じ「+9時間ずらしたUTC値」として返す
          function eventStartMs(ev) {
            if (!ev.time || !/^\d{2}:\d{2}$/.test(ev.time)) return null;
            const [y, m, d] = ev.startDate.split('-').map(Number);
            const [hh, mm] = ev.time.split(':').map(Number);
            return Date.UTC(y, m - 1, d, hh, mm);
          }
          function timeRange(ev) {
            return ev.time ? `${ev.time}〜${ev.endTime || ''}` : '';
          }
          function fmtClock(ms) {
            const d = new Date(ms);
            return `${toDateStr(d)} ${String(d.getUTCHours()).padStart(2, '0')}:${String(d.getUTCMinutes()).padStart(2, '0')}`;
          }
          function sleep(ms) {
            if (NO_SLEEP) { CLOCK_OFFSET_MS += ms; return Promise.resolve(); }
            return new Promise((resolve) => setTimeout(resolve, ms));
          }

          // --- 通知本文の組み立て(純関数) ---
          function activeEvents(events) {
            return (events || []).filter((e) => e && !e.deleted && e.title && e.startDate && e.endDate);
          }
          // 長期予定(アプリで「長期予定として表示する」にチェックしたもの)。
          // 販売期間などが毎日ずっと通知に並ぶのを防ぐため、日々の予定行からは除外する
          function isLongTerm(e) { return !!e && e.longTerm === true; }
          function shiftLine(shifts, dateStr, prefix) {
            const s = (shifts || {})[dateStr];
            if (!s || s.deleted || !SHIFT_DEFS[s.code]) return null;
            const def = SHIFT_DEFS[s.code];
            return `💼 ${prefix}のシフト: ${def.label}${def.time ? `(${def.time})` : ''}`;
          }
          // eventLines: その日の予定の行。長期予定はアプリの「今日の予定」カードと同じ基準で除外する。
          // ただし「その日から始まる」長期予定だけは、その日の予定として1回だけ出す
          // (販売開始を知らせないと買い逃すため。翌日以降は出ない)
          function eventLines(events, dateStr) {
            return activeEvents(events)
              .filter((e) => !isLongTerm(e) || e.startDate === dateStr)
              .filter((e) => occursOnDay(e, dateStr))
              .map((e) => {
                const cat = CAT_LABELS[e.category] || 'その他';
                const multi = e.startDate !== e.endDate;
                const extra = multi
                  ? `(${fmtMD(e.startDate)}${e.time ? ` ${e.time}` : ''}〜 ${fmtMD(e.endDate)}${e.endTime ? ` ${e.endTime}まで` : ''})`
                  : (e.time ? ` ${timeRange(e)}` : '');
                return `・[${cat}] ${e.title}${extra}`;
              });
          }
          // deadlineLines: 最終日のお知らせ(今日が最終日 / 明日が最終日)。期間もの(開始日≠終了日)のみ対象
          function deadlineLines(events, today) {
            const tomorrow = addDaysStr(today, 1);
            const lines = [];
            activeEvents(events).forEach((e) => {
              if (e.startDate === e.endDate) return;
              if (e.endDate === today) lines.push(`🔔 『${e.title}』は今日が最終日!`);
              else if (e.endDate === tomorrow) lines.push(`⚠ 『${e.title}』は明日が最終日!`);
            });
            return lines;
          }
          // onSaleLines: いま販売中(=長期予定でまだ終わっていないもの)の一覧。締切日が近い順。
          // 月初(1日)と月末の朝の通知にだけ添える
          function onSaleLines(events, today) {
            return activeEvents(events)
              .filter(isLongTerm)
              .filter((e) => e.endDate >= today)
              .slice()
              .sort((a, b) => (a.endDate < b.endDate ? -1 : a.endDate > b.endDate ? 1
                : (a.startDate < b.startDate ? -1 : a.startDate > b.startDate ? 1 : 0)))
              .map((e) => {
                const cat = CAT_LABELS[e.category] || 'その他';
                return `・[${cat}] ${e.title}(${fmtMD(e.startDate)}〜${fmtMD(e.endDate)}まで)`;
              });
          }
          // buildDaily: 朝・昼のダイジェスト。withOnSale=true(朝のみ)かつ月初/月末なら販売中一覧を添える
          function buildDaily(data, today, withOnSale) {
            const lines = [];
            const shift = shiftLine(data.shifts, today, '今日');
            if (shift) lines.push(shift);
            const evs = eventLines(data.events, today);
            if (evs.length) { lines.push('📅 今日の予定'); lines.push(...evs); }
            lines.push(...deadlineLines(data.events, today));
            const onSale = onSaleLines(data.events, today);
            if (withOnSale && (isFirstDayOfMonth(today) || isLastDayOfMonth(today)) && onSale.length) {
              lines.push(isFirstDayOfMonth(today) ? '🛒 いま販売中のもの(月初のお知らせ)' : '🛒 いま販売中のもの(月末のお知らせ)');
              lines.push(...onSale);
            }
            // 何も無い日でも、販売期間中のものがあるならその件数だけは伝える
            // (「予定はありません」だけだと販売が終わったと誤解するため)
            if (!lines.length) {
              lines.push(onSale.length ? `今日の予定はありません🌸(販売期間中のもの ${onSale.length}件)` : '今日の予定はありません🌸');
            }
            return lines;
          }
          function buildEvening(data, today) {
            const lines = [];
            const tomorrow = addDaysStr(today, 1);
            activeEvents(data.events).forEach((e) => {
              if (e.startDate !== e.endDate && e.endDate === tomorrow) {
                lines.push(`⚠ 『${e.title}』は明日が最終日! 買い逃し・見逃し注意!`);
              }
            });
            const shift = shiftLine(data.shifts, tomorrow, '明日');
            if (shift) lines.push(shift);
            const evs = eventLines(data.events, tomorrow);
            if (evs.length) { lines.push('📅 明日の予定'); lines.push(...evs); }
            return lines; // 空なら送信スキップ
          }
          function soonLine(ev, nowShiftedMs) {
            const start = eventStartMs(ev);
            const diffMin = start === null ? 0 : Math.max(0, Math.round((start - nowShiftedMs) / 60000));
            return `・『${ev.title}』${timeRange(ev)}(あと約${diffMin}分)`;
          }

          // --- 枠(6時間)の中で送るタスクの洗い出し ---
          // windowStartMs: 起動時刻が属する枠の開始時刻(JST 0/6/12/18時)
          function windowStartOf(now) {
            const base = Math.floor(now.getUTCHours() / WINDOW_HOURS) * WINDOW_HOURS;
            return Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), base);
          }
          // buildTasks: 枠[ws, we)の中に入る「送るもの」を時刻順で返す純関数。
          //  - ダイジェスト3種(設定時刻・-1は送らない)
          //  - 開始時刻がある予定の30分前リマインド(枠の日付とその翌日開始の予定が対象。
          //    枠は0時をまたがないので、翌日開始が枠に入るのは18-24時の枠だけ)
          // 各タスクには一意のkeyを付け、同じ枠の中で二重送信しないようにする
          function buildTasks(data, ws, we) {
            const dayStr = toDateStr(new Date(ws));
            const [y, m, d] = dayStr.split('-').map(Number);
            const settings = data.settings || {};
            const tasks = [];
            const add = (at, key, extra) => { if (at >= ws && at < we) tasks.push({ at, key, ...extra }); };
            const digestDefs = [
              ['morning', settingHour(settings.notifyMorningHour, DEFAULT_MORNING_HOUR)],
              ['noon', settingHour(settings.notifyNoonHour, DEFAULT_NOON_HOUR)],
              ['evening', settingHour(settings.notifyEveningHour, DEFAULT_EVENING_HOUR)],
            ];
            digestDefs.forEach(([mode, hour]) => {
              if (hour < 0 || hour > 23) return;
              add(Date.UTC(y, m - 1, d, hour, 0), `digest:${mode}:${dayStr}`, { type: 'digest', mode, dateStr: dayStr });
            });
            const tomorrow = addDaysStr(dayStr, 1);
            activeEvents(data.events)
              .filter((e) => e.startDate === dayStr || e.startDate === tomorrow)
              .forEach((e, index) => {
                const start = eventStartMs(e);
                if (start === null) return;
                // idが無い旧データ同士で衝突しないよう並び順も鍵に混ぜる
                add(start - SOON_BEFORE_MIN * 60000, `soon:${e.id || `idx${index}`}:${e.startDate}:${e.time}`, { type: 'soon', event: e });
              });
            return tasks.sort((a, b) => a.at - b.at);
          }

          // splitForDiscord: Discordの1メッセージ上限(2000文字)を超えないように行単位で分割する純関数。
          // 1行だけで上限を超える場合はその行を途中で切る(無限ループにしない)
          function splitForDiscord(content) {
            const chunks = [];
            let current = '';
            String(content).split('\n').forEach((line) => {
              let rest = line;
              while (rest.length > DISCORD_MAX_CHARS) {
                if (current) { chunks.push(current); current = ''; }
                chunks.push(rest.slice(0, DISCORD_MAX_CHARS));
                rest = rest.slice(DISCORD_MAX_CHARS);
              }
              const candidate = current ? `${current}\n${rest}` : rest;
              if (candidate.length > DISCORD_MAX_CHARS) { chunks.push(current); current = rest; }
              else current = candidate;
            });
            if (current) chunks.push(current);
            return chunks.length ? chunks : [''];
          }

          // postOnce: Discordへ1通送る。429(送りすぎ)はRetry-Afterに従って、5xxは間隔を空けてリトライする
          async function postOnce(content) {
            let lastError = null;
            for (let attempt = 1; attempt <= MAX_RETRY; attempt++) {
              try {
                const res = await fetch(WEBHOOK, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ content }),
                });
                if (res.ok) return;
                if (res.status === 429) {
                  const retryAfter = Number(res.headers.get('retry-after')) || 5;
                  console.warn(`Discordから送りすぎと言われたため${retryAfter}秒待ちます`);
                  await sleep(retryAfter * 1000);
                  lastError = new Error('Discordへの送信に失敗しました(429)');
                  continue;
                }
                lastError = new Error(`Discordへの送信に失敗しました(${res.status})`);
                if (res.status < 500) throw lastError; // 400番台(URL間違い等)は何度やっても直らない
              } catch (e) {
                lastError = e;
                if (/\(4\d\d\)/.test(e.message)) throw e;
              }
              console.warn(`Discordへの送信に失敗しました(${attempt}/${MAX_RETRY})`);
              if (attempt < MAX_RETRY) await sleep(RETRY_WAIT_MS * attempt);
            }
            throw lastError;
          }

          // postDiscord: 分割してから送る。DRY_RUNのときも同じ分割を通してから表示する
          // (テストが実際の送信単位を検査できるようにするため)
          async function postDiscord(content) {
            const chunks = splitForDiscord(content);
            if (DRY_RUN) {
              chunks.forEach((chunk) => console.log('--- DRY RUN(送信内容) ---\n' + chunk));
              return;
            }
            if (!WEBHOOK) throw new Error('LUADULE_WEBHOOK が設定されていません');
            for (const chunk of chunks) await postOnce(chunk);
          }

          // sendDigest: 朝/昼/夜のダイジェストを送る。夜は対象が無ければ送らない(戻り値false)
          async function sendDigest(data, mode, dateStr) {
            const name = (data.settings && data.settings.oshiName) || '推し';
            if (mode === 'evening') {
              const lines = buildEvening(data, dateStr);
              if (!lines.length) { console.log('夜の通知対象がないため送信をスキップしました'); return false; }
              await postDiscord(`🌙 **${name}ジュール 夜の通知**\n` + lines.join('\n'));
              console.log('夜の通知を送信しました');
              return true;
            }
            const label = mode === 'morning' ? '朝' : '昼';
            const icon = mode === 'morning' ? '🌸' : '🍙';
            const lines = buildDaily(data, dateStr, mode === 'morning');
            await postDiscord(`${icon} **${name}ジュール ${fmtMD(dateStr)}(${weekday(dateStr)}) ${label}の通知**\n` + lines.join('\n'));
            console.log(`${label}の通知を送信しました`);
            return true;
          }

          // runTask: 1つのタスクを実行する。
          // ⏰は「遅れて起動したときに、もう始まっている予定へ『あと約0分』と送る」のを防ぐため、
          // 予定時刻から SOON_STALE_MIN 分以上遅れていたら送らずに捨てる(ダイジェストは遅れても送る価値があるので送る)
          async function runTask(task, nowMs) {
            if (task.type === 'digest') return sendDigest(task.data, task.mode, task.dateStr);
            const lateMin = Math.round((nowMs - task.at) / 60000);
            if (lateMin > SOON_STALE_MIN) {
              console.log(`⏰リマインドを${lateMin}分遅れのため送信しませんでした`);
              return false;
            }
            await postDiscord(`⏰ **もうすぐ始まります!**\n` + soonLine(task.event, nowMs));
            console.log('30分前リマインドを送信しました');
            return true;
          }

          // task2label: ログ用の短い説明。
          // このリポジトリは公開されており、Actionsのログは誰でも読めるため、
          // 予定のタイトル・メモなど中身が分かる情報はログに一切出さない(v4での修正点)
          function task2label(t) {
            if (t.type === 'digest') return `${t.mode}のダイジェスト`;
            return '開始30分前のリマインド';
          }

          // --- main ---
          try {
            const startNow = jstNow();
            const ws = windowStartOf(startNow);
            const we = ws + WINDOW_HOURS * 3600 * 1000;

            // 手動実行(workflow_dispatch)は時刻に関係なく朝の通知を1回だけ送って終了する
            if (FORCE_MODE) {
              const data = await loadData();
              await sendDigest(data, FORCE_MODE, toDateStr(startNow));
              console.log('手動実行のため1回だけ送信して終了しました');
            } else {
              console.log(`担当する枠: ${fmtClock(ws)} 〜 ${fmtClock(we)}(現在 ${fmtClock(startNow.getTime())})`);
              const sent = new Set();
              const failures = [];
              let loops = 0;
              let loopedToEnd = false;
              while (loops++ < MAX_LOOPS) {
                const nowMs = jstNow().getTime();
                if (nowMs >= we) { console.log('枠の終わりに達したので終了します'); break; }

                // 送信の直前に毎回読み直す(=通知と同じタイミングで更新確認)
                const data = await loadData();
                const tasks = buildTasks(data, ws, we).map((t) => ({ ...t, data }));

                if (PLAN_ONLY) {
                  console.log('--- 枠内のタスク一覧(PLAN_ONLY) ---');
                  tasks.forEach((t) => console.log(`  ${fmtClock(t.at)} ${t.type}${t.mode ? `(${t.mode})` : ''} key=${t.key}`));
                  break;
                }

                const due = tasks.filter((t) => t.at <= nowMs && !sent.has(t.key));
                for (const task of due) {
                  // 1件の失敗でこの枠の残り全部を失わないよう、タスク単位でエラーを捕まえる。
                  // (通信の一時的な失敗は postDiscord / loadData 側でリトライ済み)
                  try {
                    await runTask(task, nowMs);
                  } catch (taskErr) {
                    failures.push(`${task2label(task)}: ${taskErr.message}`);
                    console.error(`${task2label(task)}の送信に失敗しました: ${taskErr.message}`);
                  }
                  sent.add(task.key); // 送信済み(夜のスキップ・失敗含む)は同じ枠で二度と対象にしない
                }

                const next = tasks.find((t) => t.at > nowMs && !sent.has(t.key));
                if (!next) { console.log('この枠で送るものは残っていません。終了します'); break; }
                const waitMs = next.at - jstNow().getTime();
                console.log(`次は ${fmtClock(next.at)}(${task2label(next)})。約${Math.max(0, Math.round(waitMs / 60000))}分待機します`);
                if (waitMs > 0) await sleep(waitMs);
                loopedToEnd = loops >= MAX_LOOPS;
              }
              if (loopedToEnd) console.warn('タスク数の上限に達したため打ち切りました');
              // 個別に失敗したタスクがあれば、最後にまとめて1通だけ知らせる(内容は出さない)
              if (failures.length) {
                try { await postDiscord(`⚠ ルアジュール通知の一部が送れませんでした(${failures.length}件)`); } catch (e2) { console.error(e2.message); }
                process.exitCode = 1;
              }
            }
          } catch (e) {
            console.error('通知処理でエラー:', e.message);
            try { await postDiscord(`⚠ ルアジュール通知でエラーが発生しました: ${e.message}`); } catch (e2) { console.error(e2.message); }
            process.exit(1);
          }
          NOTIFY_EOF
          node /tmp/notify.mjs

      # 公開リポジトリは60日間更新がないと定期実行が自動停止されるため、
      # 50日以上コミットが無ければ小さな更新を自動で入れて稼働を維持する
      - name: Keep repository active
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          days=$(( (now - last) / 86400 ))
          if [ "$days" -ge 50 ]; then
            git config user.name "luadule-bot"
            git config user.email "actions@users.noreply.github.com"
            date > .keepalive
            git add .keepalive
            git commit -m "chore: keep scheduled workflow active"
            git push
            echo "keepaliveコミットを実行しました"
          else
            echo "最終コミットから${days}日のためkeepalive不要"
          fi
